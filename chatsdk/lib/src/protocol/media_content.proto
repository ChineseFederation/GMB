syntax = "proto3";

package chatsdk.protocol;

// Encrypted attachment metadata carried inside the MLS mailbox.
message MediaDescriptor {
  string attachment_id = 1;
  string file_name = 2;
  string mime = 3;
  uint64 byte_size = 4;
  uint32 width = 5;
  uint32 height = 6;
  uint32 duration_ms = 7;
  string blurhash = 8;
  bytes cipher_key = 9;
  uint64 cipher_byte_size = 10;
  bytes cipher_sha256 = 11;
}

// Fields 16-19 do not overlap BasicPayload fields 1-3. Receivers can reject
// the wrong payload family without a parallel version or discriminator field.
message MediaPayload {
  oneof content {
    MediaDescriptor image = 16;
    MediaDescriptor video = 17;
    MediaDescriptor file = 18;
    MediaDescriptor audio = 19;
  }
}
