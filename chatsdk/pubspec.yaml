name: gmb_chat_sdk
description: Independent end-to-end encrypted chat SDK for mobile clients and self-hosted servers.
version: 1.0.0
homepage: https://github.com/ChineseFederation/GMB/tree/main/chatsdk
repository: https://github.com/ChineseFederation/GMB
issue_tracker: https://github.com/ChineseFederation/GMB/issues
topics:
  - chat
  - end-to-end-encryption
  - flutter
  - messaging
  - openmls

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter_webrtc: ^1.5.2
  camera: ^0.12.0+2
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  emoji_picker_flutter: ^4.4.0
  flutter_blurhash: ^0.9.1
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  provider: ^6.1.5+1
  video_player: ^2.10.1
  wechat_assets_picker: ^10.1.2
  blurhash_dart: ^1.2.1
  flutter_image_compress: ^2.4.0
  image: ^4.9.1
  image_size_getter: ^2.4.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  record: ^7.1.1
  saver_gallery: ^4.1.0
  shared_preferences: ^2.5.5
  video_compress: ^3.1.4
  crypto: ^3.0.6
  cryptography: ^2.9.0
  fixnum: ^1.1.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  meta: ^1.18.0
  path: ^1.9.1
  protobuf: ^6.0.0

dev_dependencies:
  build_runner: 2.15.0
  isar_community_generator: ^3.3.2
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  plugin:
    platforms:
      ios:
        ffiPlugin: true
  assets:
    - stickers/
