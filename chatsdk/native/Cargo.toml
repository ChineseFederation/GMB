[package]
name = "chat_sdk_native"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "ChatSDK OpenMLS native engine"

[lib]
name = "chat_sdk"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
openmls = "0.8.1"
openmls_rust_crypto = "0.5.1"
openmls_basic_credential = "0.5.0"
openmls_traits = "0.5.0"
openmls_memory_storage = { version = "0.5.0", features = ["persistence"] }
aes-gcm = "0.10"
hpke-rs = { version = "0.6.1", features = ["rustcrypto", "std"] }
hpke-rs-rust-crypto = { version = "0.6.1", features = ["std"] }
base64 = "0.22"

[workspace]
