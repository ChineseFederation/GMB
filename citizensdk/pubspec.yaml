name: citizen_sdk
description: Citizenchain light client, rootless hot wallet, sr25519 signing, and on-chain transaction SDK.
version: 0.1.0
repository: https://github.com/ChineseFederation/GMB

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  bip39_mnemonic: ^4.0.1
  characters: ^1.3.0
  convert: ^3.1.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.2.2
  meta: ^1.15.0
  path: ^1.9.1
  polkadart: ^0.7.0
  polkadart_keyring: ^0.7.1
  substrate_bip39: ^0.7.0
  shared_preferences: ^2.5.5
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: org.citizen.sdk
        pluginClass: CitizenSdkPlugin
      ios:
        pluginClass: CitizenSdkPlugin
  assets:
    - assets/chainspec.json
    - assets/light_sync_state.json
