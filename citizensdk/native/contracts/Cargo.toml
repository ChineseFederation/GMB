[package]
name = "citizen-sdk-contracts"
description = "CitizenSDK Core 的类型化链、签名、金库、钱包与状态存储合同。"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# watch_extrinsic 只暴露标准 Stream 语义，不把具体异步运行时带入合同层。
futures-core = "=0.3.31"
# SecretBuffer 的实际内存擦除由成熟实现负责，禁止以普通 Vec 模拟清零。
zeroize = "=1.9.0"

