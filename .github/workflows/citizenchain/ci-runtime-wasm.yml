name: 公民协议 · CI · WASM
# CI_CACHE_PROTOCOL: ci-v1
run-name: 公民协议 · CI · WASM

# 中文注释：只能由编程控制台协议行「运行 CI / Release」按钮经 workflow_dispatch 发起。
# 本软件不设 push 触发——main push 只运行独立仓库门禁，绝不产生任何 WASM 运行记录。
# 因此也不再需要按提交名分流：那套做法会让每一次普通 push 都留下一条 skipped 记录
# 污染 Actions 列表，失败重试还只能靠造空提交换 SHA；dispatch 可以直接对同一 SHA 重跑。
# CI 只验证 GitHub main 当前源码，不访问正式链、不分配正式版本、不创建 Tag。
# finalized Runtime、spec_version +1、正式构建与 Tag 全部只属于独立 Release。
on:
  workflow_dispatch:

concurrency:
  group: citizenchain-runtime-ci-wasm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GMB_SOURCE_SHA: ${{ github.sha }}

jobs:
  build-wasm:
    permissions: { actions: write, contents: read }
    name: 编译 WASM
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: 准备统一CI增量缓存
        id: ci_cache
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_PRODUCT: citizenchain
          CI_CACHE_PLATFORM: runtime-wasm
          CI_CACHE_ARCHITECTURE: wasm
          CI_CACHE_COMPONENT: build-wasm
          CI_CACHE_WORKFLOW: citizenchain-runtime-wasm
          CI_CACHE_JOB: build-wasm
          CI_CACHE_TOOLCHAIN_FINGERPRINT: ${{ hashFiles('.github/dependencies.json', 'Cargo.lock', '**/Cargo.lock', '**/pubspec.lock', '**/package-lock.json') }}
          CI_CACHE_PATHS: |
            cargo-home
            cargo-target
            npm
            xdg
          CI_CACHE_LINKS: |
            citizenchain/target=cargo-target
          CI_CACHE_FINALS: |
            cargo-target/release/wbuild
            cargo-target/release/citizenchain
        run: node .github/scripts/ci-cache.mjs prepare

      - name: 恢复上一次成功的CI增量缓存
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.restore_key }}

      - name: 接入受控生成目录
        run: node .github/scripts/ci-cache.mjs wire

      - name: 清理缓存中的最终产物
        run: node .github/scripts/ci-cache.mjs sanitize
      - name: 校验代码来源与 Runtime 源码版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/ci-runtime-wasm.mjs dependencies check --scope citizenchain-runtime
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          runtime_path = Path("citizenchain/runtime/src/lib.rs")
          test_path = Path("citizenchain/runtime/src/tests/cases.rs")
          runtime_text = runtime_path.read_text(encoding="utf-8")
          test_text = test_path.read_text(encoding="utf-8")
          runtime_pattern = re.compile(r"(?m)^(\s*spec_version:\s*)(\d+)(\s*,\s*)$")
          test_pattern = re.compile(r"assert_eq!\(VERSION\.spec_version,\s*(\d+)\);")
          runtime_matches = list(runtime_pattern.finditer(runtime_text))
          test_matches = list(test_pattern.finditer(test_text))
          if len(runtime_matches) != 1 or len(test_matches) != 1:
              raise SystemExit("Runtime spec_version 真源或测试断言不唯一")
          source_version = int(runtime_matches[0].group(2))
          test_version = int(test_matches[0].group(1))
          if source_version != test_version:
              raise SystemExit("Runtime 源码与测试断言的 spec_version 不一致")
          if source_version < 0 or source_version > 2**32 - 1:
              raise SystemExit("Runtime 源码 spec_version 无效")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a", encoding="utf-8") as out:
              out.write("## CitizenChain WASM 构建来源\n\n")
              out.write("- 构建用途：纯 CI 验证\n")
              out.write(f"- 源码 spec_version：`{source_version}`\n")
              out.write(f"- 源码提交：`{os.environ['GMB_SOURCE_SHA']}`\n")
              out.write("- CI 不读取正式链、不分配正式版本、不创建 Tag\n")
          PY

      - name: 安装 Rust 工具链
        # 1.97.1 在上游是可移动分支；固定当前生成提交，action 内仍硬编码 toolchain=1.97.1。
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: wasm32v1-none
          components: rust-src, clippy

      - name: 安装 Node.js
        # NodeGuard 行为探针编译完整 Node/Tauri 宿主；固定 Node.js 25.2.1 并复用锁文件缓存，
        # 保证编译期读取的 frontendDist 来自真实前端构建，而不是占位目录或本机残留。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1

      - name: 安装系统依赖
        # NodeGuard 行为探针会编译完整 node/Tauri 宿主；依赖必须与 Linux 节点 CI 对齐，
        # 否则 glib-sys 等桌面依赖会在探针真正执行前因缺少 pkg-config 元数据失败。
        run: node .github/scripts/citizenchain/ci-runtime-wasm.mjs linux-deps

      - name: 校验锁文件并记录构建环境
        working-directory: citizenchain
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          def command_output(*command: str) -> str:
              return subprocess.check_output(
                  command,
                  text=True,
                  stderr=subprocess.STDOUT,
              ).strip()

          lock_data = Path("Cargo.lock").read_bytes()
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## CitizenChain WASM 固定构建环境\n\n")
              out.write("- runner label：`ubuntu-24.04`\n")
              out.write(f"- runner OS / arch：`{os.environ['RUNNER_OS']} / {os.environ['RUNNER_ARCH']}`\n")
              out.write(f"- runner image OS：`{os.environ.get('ImageOS', 'unknown')}`\n")
              out.write(f"- runner image version：`{os.environ.get('ImageVersion', 'unknown')}`\n")
              out.write(
                  "- checkout action："
                  "`fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09` (`v5.1.0`)\n"
              )
              out.write(
                  "- rust-toolchain action："
                  "`46511b1c83438f0dd37c02d843619ece5a4abb5b` (`1.97.1`)\n"
              )
              out.write(f"- Cargo.lock SHA-256：`{hashlib.sha256(lock_data).hexdigest()}`\n")
              for label, command in (
                  ("rustc", ("rustc", "--version", "--verbose")),
                  ("cargo", ("cargo", "--version", "--verbose")),
                  ("protoc", ("protoc", "--version")),
                  ("clang", ("clang", "--version")),
              ):
                  out.write(f"\n### {label}\n\n```\n{command_output(*command)}\n```\n")
          PY

      - name: 校验正式 WASM 构建特性
        working-directory: citizenchain
        run: |
          if cargo tree --locked -p citizenchain -e features --no-default-features --features std \
            | grep -F 'citizenchain feature "runtime-benchmarks"'; then
            echo "正式 WASM 依赖图禁止启用 runtime-benchmarks" >&2
            exit 1
          fi

      - name: 执行 Runtime Clippy
        working-directory: citizenchain
        # 不设 WASM_BUILD_FROM_SOURCE/WASM_FILE：build.rs 走 else 分支不编 wasm，clippy 为纯 lint 快闸。
        # scope 与「编译 WASM」同 feature 配置（-p citizenchain --features std），仅覆盖 runtime 装配 crate。
        run: cargo clippy --locked -p citizenchain --no-default-features --features std -- -D warnings

      - name: 编译 WASM
        working-directory: citizenchain
        env:
          WASM_BUILD_FROM_SOURCE: "1"
          # build.rs 只对正式候选 WASM 启用 feature 构建闸，不影响权重 benchmark runtime。
          CITIZENCHAIN_PRODUCTION_WASM_BUILD: "1"
        run: cargo build --locked --release -p citizenchain --no-default-features --features std

      - name: 校验 WASM 产物并记录摘要
        working-directory: citizenchain
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          output_dir = Path("target/release/wbuild/citizenchain")
          filenames = (
              "citizenchain.wasm",
              "citizenchain.compact.wasm",
              "citizenchain.compact.compressed.wasm",
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          rows = []
          for filename in filenames:
              path = output_dir / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"WASM 产物不存在或为空：{path}")
              data = path.read_bytes()
              digest = hashlib.blake2b(data, digest_size=32).hexdigest()
              rows.append((filename, len(data), digest))

          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## CitizenChain WASM 产物\n\n")
              out.write("| 文件 | 字节数 | Blake2-256 |\n")
              out.write("| --- | ---: | --- |\n")
              for filename, size, digest in rows:
                  out.write(f"| `{filename}` | {size} | `0x{digest}` |\n")
          PY

      # tauri::generate_context! 在 node 测试编译期读取 frontendDist；必须使用锁文件构建
      # 真实前端产物，不能提交 dist 或创建空占位文件绕过 Tauri 校验。
      - name: 构建公民链节点前端
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 校验候选 WASM 安全行为
        working-directory: citizenchain
        env:
          # 对上一步刚生成、随后将上传的同一份压缩 WASM 执行 NodeGuard 行为探针。
          WASM_FILE: ${{ github.workspace }}/citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.compressed.wasm
        run: |
          cargo test --locked -p node \
            current_wasm_passes_candidate_runtime_policy_behavior_probes -- --nocapture

      # CI artifact 只用于定位源码构建问题，名称与正式 Release 资产严格隔离；开发升级入口
      # 禁止读取本 artifact，避免把未分配正式版本的验证产物提交上链。
      - name: 上传 CI 诊断 WASM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: citizenchain-wasm-ci
          path: |
            citizenchain/target/release/wbuild/citizenchain/citizenchain.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.compressed.wasm
          retention-days: 30

      - name: 签署 WASM CI 构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            citizenchain/target/release/wbuild/citizenchain/citizenchain.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.compressed.wasm

  # Release 独立读取正式链、分配 spec_version、重新执行版本相关门禁并构建正式资产；
  # CI 诊断产物不进入正式 Release，也不作为链上升级来源。
      - name: 记录失败CI增量缓存
        if: ${{ failure() && !cancelled() }}
        env:
          CI_CACHE_TERMINAL_STATE: failure
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次失败的CI增量缓存
        id: ci_cache_save_failure
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.failure_paths }}
          key: ${{ steps.ci_cache.outputs.failure_key }}

      - name: 清理旧失败CI增量缓存
        if: ${{ failure() && !cancelled() && steps.ci_cache_save_failure.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: failure
        run: node .github/scripts/ci-cache.mjs prune

      - name: 准备成功CI增量缓存
        if: ${{ success() }}
        env:
          CI_CACHE_TERMINAL_STATE: success
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次成功的CI增量缓存
        id: ci_cache_save_success
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.success_key }}

      - name: 清理旧成功CI增量缓存
        if: ${{ success() && steps.ci_cache_save_success.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: success
        run: node .github/scripts/ci-cache.mjs prune
