name: 公民链 · Release · Windows
run-name: 公民链 · Release · Windows

# 中文注释：本软件不设 push 触发；main push 只运行独立仓库门禁，不启动本 Release；
# CI 只能由公民控制台节点行的「运行 CI / Release」按钮经 workflow_dispatch 发起。
# 这样每个软件的 CI 彼此彻底分开，也不会出现「推送触发一条、dispatch 再触发一条、
# 后者用 concurrency 把前者掐掉」的空跑 runner 浪费。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: GitHub main 准确提交
        required: true
        type: string
      ci_run_id:
        description: 本次 Release 复核的准确成功 CI run_id
        required: true
        type: string
      version_tag:
        description: 公民链 Windows 正式版本 Tag
        required: true
        type: string
      software_version:
        description: 本次候选软件版本
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  # 中文注释：目标是并发键的一部分，四个目标互不取消；同目标新任务也只排队，绝不
  # 把已经运行数小时的任务掐掉。CitizenConsole 会在 dispatch 前负责精确去重。
  group: citizenchain-node-release-windows
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  GMB_SOURCE_SHA: ${{ inputs.source_sha }}
  GMB_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GMB_VERSION_TAG: ${{ inputs.version_tag }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}
  GMB_NODE_PLATFORM: windows

jobs:
  changes:
    name: 锁定公民链节点构建范围
    runs-on: ubuntu-24.04
    outputs:
      citizenchain: ${{ steps.scope.outputs.citizenchain }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_matrix: ${{ steps.scope.outputs.desktop_matrix }}
    steps:
      - name: 拉取完整变更历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: 验证公民链 Windows Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/version-tag-contract.mjs verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenchain-node-windows-v --product-id citizenchain-node
          --target windows --workflow citizenchain/ci-node-windows.yml

      # 桌面端与两款移动产品共用 docs/logo.png 唯一母版。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并启用节点全量构建
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/dependencies.mjs check --scope citizenchain-node
          echo "citizenchain=true" >> "$GITHUB_OUTPUT"
          echo "desktop=true" >> "$GITHUB_OUTPUT"
          test "$GMB_NODE_PLATFORM" = windows
          echo 'desktop_matrix=[{"platform":"windows","name":"Windows","os":"windows-2025","artifact":"公民链Windows","installer_name":"citizenchain-node-windows-x86_64.exe","manual_bundle_targets":"nsis","updater_manifest_name":"citizenchain-node-latest-windows-x86_64.json","expected_runner_arch":"X64","cache_key":"citizenchain-windows"}]' >> "$GITHUB_OUTPUT"

  build-desktop:
    name: 打包公民链桌面端 (${{ matrix.name }})
    needs: changes
    # 中文注释：CI 来源已由 CitizenConsole 锁定；Release 只构建本平台正式候选。
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.desktop_matrix) }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/github-release.mjs
            .github/scripts/version-tag-contract.mjs
            .github/scripts/citizenchain-node-version.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 校验代码来源并应用节点候选版本
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/dependencies.mjs check --scope citizenchain-node
          node release-tool/.github/scripts/citizenchain-node-version.mjs apply "$GMB_SOFTWARE_VERSION"

      - name: 校验 runner 架构
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]; then
            echo "::error::runner 架构不符合 ${EXPECTED_RUNNER_ARCH}: 当前为 ${RUNNER_ARCH}"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: 安装 Node.js
        # 固定使用 Node.js 24,与项目 package.json engines 和 GitHub Actions node24 运行时一致。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 同步桌面端版本
        shell: bash
        env:
          CITIZENCHAIN_CI_BUNDLE_TARGETS: ${{ matrix.ci_bundle_targets }}
          CITIZENCHAIN_MANUAL_BUNDLE_TARGETS: ${{ matrix.manual_bundle_targets }}
          CITIZENCHAIN_UPDATER_MANIFEST_NAME: ${{ matrix.updater_manifest_name }}
          CITIZENCHAIN_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const targetSource = process.env.CITIZENCHAIN_MANUAL_BUNDLE_TARGETS;
          const bundleTargets = (targetSource || '')
            .split(',')
            .map((target) => target.trim())
            .filter(Boolean);

          if (bundleTargets.length === 0) {
            throw new Error('缺少本 matrix 的 Tauri bundle targets。');
          }

          // 候选版本已在当前 runner 工作区应用；这里只设置本 matrix 的 bundle 目标。
          const tauriPath = 'citizenchain/node/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          const version = tauri.version;
          tauri.bundle = tauri.bundle || {};
          // 中文注释：Release 生成安装包与 updater 正式文件；updater 在同一 runner 内签名。
          tauri.bundle.targets = bundleTargets;
          // 中文注释：按现有 Windows NSIS 文件格式在后续步骤签名并生成清单。
          delete tauri.bundle.createUpdaterArtifacts;
          // 中文注释：平台 Release 可以独立成功，因此每个安装包只读取自己的更新清单；
          // 不能再用一个根 version 同时描述版本可能不同的四个目标。
          tauri.plugins = tauri.plugins || {};
          tauri.plugins.updater = tauri.plugins.updater || {};
          tauri.plugins.updater.endpoints = [
            `https://github.com/ChineseFederation/GMB/releases/download/${process.env.GMB_VERSION_TAG}/${process.env.CITIZENCHAIN_UPDATER_MANIFEST_NAME}`,
          ];
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          console.log(`桌面端版本(源码): ${version}`);
          console.log(`Tauri bundle targets: ${bundleTargets.join(',')}`);
          NODE

      - name: 安装 Windows 构建依赖
        if: matrix.platform == 'windows'
        run: |
          choco install protoc -y
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> "$env:GITHUB_ENV"

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.cache_key }}
          workspaces: citizenchain -> target

      - name: 同步并锁定节点候选版本
        # Windows 默认 shell 是 PowerShell；统一版本脚本使用 POSIX 环境变量语法，必须固定 Bash。
        shell: bash
        run: node release-tool/.github/scripts/citizenchain-node-version.mjs lock "$GMB_SOFTWARE_VERSION"

      - name: 安装前端依赖并构建
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 准备空创世状态资源目录
        shell: bash
        run: |
          # 中文注释：安装包只携带节点软件；首次启动按冻结 chainspec 本地初始化并联网同步。
          rm -rf citizenchain/node/resources/genesis-state

      - name: Tauri 打包正式软件
        working-directory: citizenchain/node
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --ci -- --locked

      - name: 整理 Windows 产物
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installerName = "${{ matrix.installer_name }}"
          $versionedName = $installerName -replace '\.exe$', "-v$env:GMB_SOFTWARE_VERSION.exe"
          New-Item -ItemType Directory -Force citizenchain-release | Out-Null

          $exe = Get-ChildItem -Path "citizenchain/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error "未找到 Windows exe 安装包。"
            exit 1
          }

          Copy-Item $exe.FullName (Join-Path "citizenchain-release" $versionedName)
          # 中文注释：NSIS exe 同时作为 Windows updater 正式文件；后续步骤在同一 runner 内签名。
          Get-ChildItem citizenchain-release | Format-Table Name, Length

      - name: 签名 Windows updater 并生成正式清单
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_PASS }}
        run: |
          set -euo pipefail
          updater="$(find citizenchain-release -maxdepth 1 -type f -name '*.exe' -print)"
          test "$(printf '%s\n' "$updater" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          (cd citizenchain/node && node frontend/node_modules/@tauri-apps/cli/tauri.js signer sign "$GITHUB_WORKSPACE/$updater")
          signature="$(tr -d '\r\n' < "${updater}.sig")"
          test -n "$signature"
          node - "$(basename "$updater")" "$signature" <<'NODE'
          const fs = require('node:fs');
          const [asset, signature] = process.argv.slice(2);
          fs.writeFileSync('citizenchain-release/citizenchain-node-latest-windows-x86_64.json', `${JSON.stringify({
            version: process.env.GMB_SOFTWARE_VERSION,
            notes: `CitizenChain Windows v${process.env.GMB_SOFTWARE_VERSION}。`,
            pub_date: new Date().toISOString(),
            platforms: { 'windows-x86_64': {
              signature,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GMB_VERSION_TAG}/${asset}`,
            } },
          }, null, 2)}\n`);
          NODE

      - name: 签署节点平台正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenchain-release/*

      - name: 固化 Windows 正式 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find citizenchain-release -type f | wc -l | tr -d ' ')" = 3
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/github-release.mjs \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民链 · Release · Windows' \
            --notes "公民链 Windows 正式版 v${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets citizenchain-release/*
