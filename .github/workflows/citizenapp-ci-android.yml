name: 公民 · CI · Android
run-name: 公民 · CI · Android

# 中文注释：本软件不设 push 触发；main push 只运行独立仓库门禁，不启动本 CI；
# 本文件只处理 CitizenApp Android CI，其它产品、动作和端使用独立 workflow 并可并行。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: GitHub main 准确提交
        required: true
        type: string
      software_version:
        description: 本次候选软件版本
        required: true
        type: string
      build_number:
        description: 本次候选构建号
        required: true
        type: string

concurrency:
  group: citizenapp-ci-android
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GMB_SOURCE_SHA: ${{ inputs.source_sha }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}
  GMB_BUILD_NUMBER: ${{ inputs.build_number }}

jobs:
  # ── 代码检查 ──
  check:
    name: Flutter 代码检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}

      # 全产品 Logo 只允许由 docs/logo.png 唯一母版生成。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/dependencies.mjs check --scope citizenapp
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["GMB_SOFTWARE_VERSION"]
          build = os.environ["GMB_BUILD_NUMBER"]
          if not re.fullmatch(r"\d+\.\d{1,2}\.\d{1,2}", version) or not re.fullmatch(r"[1-9]\d*", build):
              raise SystemExit("CitizenApp 候选版本输入无效")
          path = Path("citizenapp/pubspec.yaml")
          text, count = re.subn(r"(?m)^version:\s*\d+\.\d+\.\d+\+\d+\s*$", f"version: {version}+{build}", path.read_text(), count=1)
          if count != 1:
              raise SystemExit("CitizenApp pubspec 版本真源无效")
          path.write_text(text)
          PY

      - name: 校验 chainspec.json 冻结
        run: |
          bash citizenapp/scripts/check-chainspec-frozen.sh

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".fvm/fvm_config.json").read_text(encoding="utf-8"))["flutterSdkVersion"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装依赖
        working-directory: citizenapp
        run: flutter pub get --enforce-lockfile

      # 扫码设备层由 CitizenApp / CitizenWallet 共同消费；包本身不解析业务码型。
      - name: 检查 Flutter 共享扫码适配器
        working-directory: shared/scanner-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 本机与 CI 共用唯一入口：锁定 Flutter → 构建并验收宿主 libsmoldot
      # 全部 FFI 符号 → analyze → 顺序执行 Flutter 测试。
      - name: 分析并运行完整测试
        working-directory: citizenapp
        run: ./scripts/citizenapp-test.sh

  # ── Android APK 打包 ──
  android:
    name: 打包公民.apk
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/dependencies.mjs check --scope citizenapp
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version, build = os.environ["GMB_SOFTWARE_VERSION"], os.environ["GMB_BUILD_NUMBER"]
          if not re.fullmatch(r"\d+\.\d{1,2}\.\d{1,2}", version) or not re.fullmatch(r"[1-9]\d*", build):
              raise SystemExit("CitizenApp 候选版本输入无效")
          path = Path("citizenapp/pubspec.yaml")
          text, count = re.subn(r"(?m)^version:\s*\d+\.\d+\.\d+\+\d+\s*$", f"version: {version}+{build}", path.read_text(), count=1)
          if count != 1: raise SystemExit("CitizenApp pubspec 版本真源无效")
          path.write_text(text)
          PY

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".fvm/fvm_config.json").read_text(encoding="utf-8"))["flutterSdkVersion"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装 Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装 Android SDK Platform 与 Build Tools 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # chainspec.json 是从 plain SSOT + 创世状态包派生的 stateRootHash 轻形态。
      # runtime 升级走链上 system.setCode，不要重新 build-spec。
      # 可执行冻结契约由 citizenapp/scripts/check-chainspec-frozen.sh 负责。
      - name: 再次校验 chainspec.json 冻结
        run: |
          bash citizenapp/scripts/check-chainspec-frozen.sh

      # 产品 APK 只允许 arm64-v8a；禁止 CI 恢复 32 位原生库或产品包。
      - name: 编译 smoldot native library (Android ARM64)
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "citizenapp-rust-android"
          workspaces: citizenapp/rust -> target

      - name: 安装 Flutter 依赖
        working-directory: citizenapp
        run: flutter pub get --enforce-lockfile

      - name: 修复 isar_flutter_libs compileSdk
        run: |
          ISAR_GRADLE=$(find "$HOME/.pub-cache" -path "*/isar_flutter_libs*/android/build.gradle" | head -1)
          if [ -n "$ISAR_GRADLE" ]; then
            sed -i 's/compileSdkVersion 30/compileSdkVersion 36/' "$ISAR_GRADLE"
            echo "已将 isar_flutter_libs compileSdkVersion 30 → 36"
          fi

      # 普通 CI 与正式 Release 使用同一种 Release 产品构建。CI 生成当次临时证书完成
      # 非生产签名，任务结束即销毁；正式 APP_KEY 始终不进入 GitHub。
      - name: 打包 Android Release（CI）
        working-directory: citizenapp
        run: flutter build apk --release --target-platform android-arm64

      - name: 核验 Android CI 候选中英文系统弹窗应用名
        working-directory: citizenapp
        run: bash scripts/citizenapp-run.sh verify-android-localization build/app/outputs/flutter-apk/app-release.apk

      - name: 使用当次 CI 证书签名并核验 APK
        run: |
          set -euo pipefail
          GMB_CI_STORE_PASSWORD="$(openssl rand -hex 32)"
          GMB_CI_KEY_PASSWORD="$GMB_CI_STORE_PASSWORD"
          GMB_CI_APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          export GMB_CI_STORE_PASSWORD GMB_CI_KEY_PASSWORD
          test -x "$GMB_CI_APKSIGNER"
          trap 'rm -f "$RUNNER_TEMP/citizenapp-ci.p12"' EXIT
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/citizenapp-ci.p12" \
            -storepass:env GMB_CI_STORE_PASSWORD -keypass:env GMB_CI_KEY_PASSWORD -alias ci \
            -keyalg RSA -keysize 4096 -validity 2 \
            -dname 'CN=CitizenApp CI,O=GMB,C=US'
          "$GMB_CI_APKSIGNER" sign --ks "$RUNNER_TEMP/citizenapp-ci.p12" \
            --ks-type PKCS12 --ks-key-alias ci \
            --ks-pass env:GMB_CI_STORE_PASSWORD --key-pass env:GMB_CI_KEY_PASSWORD \
            --out citizenapp/build/app/outputs/flutter-apk/公民-CI.apk \
            citizenapp/build/app/outputs/flutter-apk/app-release.apk
          "$GMB_CI_APKSIGNER" verify --verbose --print-certs citizenapp/build/app/outputs/flutter-apk/公民-CI.apk
          unset GMB_CI_STORE_PASSWORD GMB_CI_KEY_PASSWORD

      - name: 上传签名后的公民 CI APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 公民-CI.apk
          path: citizenapp/build/app/outputs/flutter-apk/公民-CI.apk
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: 签署公民 CI APK 构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenapp/build/app/outputs/flutter-apk/公民-CI.apk

  # 中文注释：Android 与 iOS 各自维护独立版本线；本端成功不会等待或推进 iOS。
