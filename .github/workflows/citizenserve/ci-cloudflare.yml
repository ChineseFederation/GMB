name: 公民服务端 · CI · Cloudflare
run-name: 公民服务端 · CI · Cloudflare

# 中文注释：CitizenServe 是与 CitizenApp、CitizenWeb 分离的 Cloudflare 服务端产品，只由公民控制台显式发起；
# 普通 main push 只触发独立仓库门禁，不触发本软件 CI；本 CI 绝不读取生产 Secret 或修改 Cloudflare 远端资源。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: GitHub main 准确提交
        required: true
        type: string
      software_version:
        description: 本次候选软件版本
        required: true
        type: string

concurrency:
  group: citizenserve-cloudflare-ci
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CI: 1
  WRANGLER_SEND_METRICS: false
  GMB_SOURCE_SHA: ${{ inputs.source_sha }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}

jobs:
  check:
    name: 后端代码、D1 与 Cloudflare 资源检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenserve/ci-cloudflare.mjs dependencies check --scope citizenserve
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.GMB_SOFTWARE_VERSION;
          if (!/^\d+\.\d{1,2}\.\d{1,2}$/.test(version)) throw new Error('后端候选版本输入无效');
          for (const path of ['citizenserve/package.json', 'citizenserve/package-lock.json']) {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            value.version = version;
            if (path.endsWith('package-lock.json')) {
              if (!value.packages?.['']) throw new Error('后端 package-lock 缺少根 package');
              value.packages[''].version = version;
            }
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          }
          NODE

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: citizenserve/package-lock.json

      - name: 安装后端锁定依赖
        working-directory: citizenserve
        run: npm ci

      - name: 执行依赖安全审计
        run: node .github/scripts/citizenserve/ci-cloudflare.mjs dependencies audit --scope citizenserve

      - name: 校验 Worker 绑定类型未过期
        working-directory: citizenserve
        run: npm run types:check

      - name: 检查 TypeScript
        working-directory: citizenserve
        run: npm run typecheck

      - name: 运行后端测试
        working-directory: citizenserve
        run: npm test

      # CI 必须从空白 D1 验证唯一 schema；运行器临时目录可避免复用开发机或前一次任务的数据。
      - name: 在全新本地 D1 执行唯一 schema
        working-directory: citizenserve
        run: |
          npm exec -- wrangler d1 execute DB --local \
            --persist-to "$RUNNER_TEMP/citizenserve-cloudflare-d1" \
            --file schema/citizenserve.sql
          # 当前没有真实结构变化，因此目录不存在；将来只在实际 migration 已受审时按顺序应用。
          if [ -d migrations ]; then
            npm exec -- wrangler d1 migrations apply DB --local \
              --persist-to "$RUNNER_TEMP/citizenserve-cloudflare-d1"
          fi

      # 中文注释：dry-run 会解析并校验 Worker、D1、R2、KV、Queue、Durable Objects、Cron、
      # Route 和 bindings，但只把无 Secret bundle 写入 runner 临时目录，不调用部署 API。
      - name: 校验 Cloudflare 资源配置并生成无 Secret 候选
        working-directory: citizenserve
        run: npm exec -- wrangler deploy --dry-run --outdir "$RUNNER_TEMP/citizenserve-cloudflare-bundle"

      # 中文注释：CI 与 Release 动作脚本彼此独立，但执行同一确定性候选契约；
      # 测试保证同一提交、版本、payload 与锁定工具得到相同 manifest 和文件哈希。
      - name: 生成并复核不可变后端候选
        run: >-
          node .github/scripts/citizenserve/ci-cloudflare.mjs action
          --project citizenserve
          --bundle "$RUNNER_TEMP/citizenserve-cloudflare-bundle/index.js"
          --output "$RUNNER_TEMP/citizenserve-cloudflare-candidate"
          --git-sha "$GMB_SOURCE_SHA"
          --archive "$RUNNER_TEMP/citizenserve-cloudflare-release.tgz"

      - name: 上传后端候选
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CitizenServe-Cloudflare-CI
          path: |
            ${{ runner.temp }}/citizenserve-cloudflare-candidate
            ${{ runner.temp }}/citizenserve-cloudflare-release.tgz
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # CI/Release 候选都使用 GitHub OIDC 建立仓库、workflow、提交和产物摘要的签名来源；
      # 不引入长期 CI 私钥，也不接触 Cloudflare 生产部署凭据。
      - name: 签署后端候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/citizenserve-cloudflare-release.tgz
