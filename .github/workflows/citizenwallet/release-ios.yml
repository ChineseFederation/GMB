name: 公民钱包 · Release · iOS
# RELEASE_BUILD_MODE: full-v1
run-name: 公民钱包 · Release · iOS

# 中文注释：本软件不设 push 触发；main push 只运行独立仓库门禁，不启动本 Release；
# CI 只能由编程控制台「公民 → 公民钱包 → 运行 CI / Release」按钮经 workflow_dispatch 发起。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: GitHub main 准确提交
        required: true
        type: string
      ci_run_id:
        description: 本次 Release 复核的准确成功 CI run_id
        required: true
        type: string
      version_tag:
        description: 公民钱包 iOS 正式版本 Tag
        required: true
        type: string
      software_version:
        description: 本次候选软件版本
        required: true
        type: string

env:
  GMB_SOURCE_SHA: ${{ inputs.source_sha }}
  GMB_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GMB_VERSION_TAG: ${{ inputs.version_tag }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}

concurrency:
  group: citizenwallet-release-ios
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  ios:
    env: { CARGO_INCREMENTAL: "0" }
    name: 签名并固化公民钱包 iOS Release
    runs-on: macos-15
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenwallet/release-ios.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 验证公民钱包 iOS Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/citizenwallet/release-ios.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenwallet-ios-v --product-id citizenwallet
          --target ios --workflow citizenwallet/ci-ios.yml

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenwallet/release-ios.mjs dependencies check --scope citizenwallet
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version, build = os.environ["GMB_SOFTWARE_VERSION"], os.environ["GITHUB_RUN_NUMBER"]
          if not re.fullmatch(r"\d+\.\d{1,2}\.\d{1,2}", version) or not re.fullmatch(r"[1-9]\d*", build):
              raise SystemExit("CitizenWallet 候选版本输入无效")
          path = Path("citizenwallet/pubspec.yaml")
          text, count = re.subn(r"(?m)^version:\s*\d+\.\d+\.\d+\+\d+\s*$", f"version: {version}+{build}", path.read_text(), count=1)
          if count != 1: raise SystemExit("CitizenWallet pubspec 版本真源无效")
          path.write_text(text)
          PY

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-apple-ios

      - name: 安装固定依赖审计器
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: 执行依赖安全审计
        run: node .github/scripts/citizenwallet/release-ios.mjs dependencies audit --scope citizenwallet

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".github/dependencies.json").read_text(encoding="utf-8"))["toolchains"]["flutter"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          cache: false
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      # 与 build-apk 调同一个脚本：冷钱包离线签名，索引与链端脱节没有任何编译期信号。
      - name: 同步 runtime pallet/call 索引
        run: ./citizenwallet/scripts/sync-pallet-registry.sh

      # ↓↓ 以下三步顺序是硬约束，颠倒会崩在很难读的 CocoaPods 报错里 ↓↓
      # 1) flutter pub get 生成 ios/Flutter/Generated.xcconfig —— Podfile 必须读它定位 FLUTTER_ROOT
      # 2) build-signer-native.sh ios 产出 libcitizenwallet_signer.a
      #    —— citizenwallet_signer.podspec 依赖它，冷端只有 4 个导出符号，
      #    正是 release 的 -dead_strip 最容易整组剔干净的规模
      # 3) flutter build ios 内部自带 pod install（且自带正确的 LANG；手动跑才需要
      #    LANG=en_US.UTF-8，否则 CocoaPods 编码崩溃）
      - name: 安装依赖
        working-directory: citizenwallet
        run: flutter pub get --enforce-lockfile

      - name: 编译原生签名库 (iOS arm64)
        working-directory: citizenwallet
        run: ./scripts/build-signer-native.sh ios

      - name: 构建 iOS Release 正式包
        working-directory: citizenwallet
        run: flutter build ios --release --no-codesign

      - name: 核验 iOS Runner 架构与钱包原生符号
        working-directory: citizenwallet
        run: ./scripts/build-signer-native.sh verify-ios-package build/ios/iphoneos/Runner.app

      - name: 使用 Apple Distribution 签名并生成 IPA
        env:
          IOS_KEY: ${{ secrets.IOS_KEY }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.WALLET_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/citizenwallet-ios-signing"
          publish="citizenwallet/build/release"
          rm -rf "$work" "$publish"
          mkdir -p "$work" "$publish"
          keychain="$work/release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          python3 - "$work" <<'PY'
          import base64, os, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          fields = {}
          for raw in os.environ.get("IOS_KEY", "").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              name, sep, value = line.partition("=")
              if not sep or name.strip() in fields or not value.strip():
                  raise SystemExit("IOS_KEY 行格式无效")
              fields[name.strip()] = value.strip()
          if set(fields) != {"pkcs12", "password", "certificate_sha1"}:
              raise SystemExit("IOS_KEY 字段集合无效")
          if not re.fullmatch(r"[0-9A-F]{40}", fields["certificate_sha1"]):
              raise SystemExit("Apple Distribution 证书摘要无效")
          try:
              pkcs12 = base64.b64decode(fields["pkcs12"], validate=True)
              profile = base64.b64decode(os.environ.get("IOS_PROVISIONING_PROFILE", ""), validate=True)
          except ValueError as exc:
              raise SystemExit("Apple Distribution 或 provisioning profile Base64 无效") from exc
          if not 1024 <= len(pkcs12) <= 32 * 1024 * 1024 or not 1024 <= len(profile) <= 1024 * 1024:
              raise SystemExit("Apple Distribution 签名材料大小无效")
          (root / "distribution.p12").write_bytes(pkcs12)
          (root / "password").write_text(fields["password"])
          (root / "certificate-sha1").write_text(fields["certificate_sha1"])
          (root / "profile.mobileprovision").write_bytes(profile)
          PY
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # 中文注释：codesign 查找 identity 依赖用户钥匙串搜索列表；仅传 --keychain
          # 不能保证干净 runner 能从证书继续定位到同钥匙串中的私钥。
          security list-keychains -d user -s "$keychain"
          security import "$work/distribution.p12" -k "$keychain" -P "$(cat "$work/password")" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          certificate_sha1="$(cat "$work/certificate-sha1")"
          security find-certificate -a -Z "$keychain" | grep -F "SHA-1 hash: $certificate_sha1"
          security find-identity -v -p codesigning "$keychain" | grep -Fq "$certificate_sha1"
          # 中文注释：干净 runner 的钥匙串不保证预装描述文件 CMS 签发链；LibreSSL
          # 直接验证 CMS 密码学签名并解出载荷，再用正式证书摘要锁定唯一配对。
          /usr/bin/openssl smime -verify -inform DER -in "$work/profile.mobileprovision" \
            -noverify -out "$work/profile.plist" >/dev/null
          profile_certificate_sha1="$(
            plutil -extract DeveloperCertificates.0 raw -o - "$work/profile.plist" \
              | base64 -D | shasum -a 1 | awk '{print toupper($1)}'
          )"
          test "$profile_certificate_sha1" = "$certificate_sha1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$work/profile.plist")" = MHYMVRN6FC
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$work/profile.plist")" = MHYMVRN6FC.ios.citizenwallet
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$work/profile.plist")" = false
          plutil -extract Entitlements xml1 -o "$work/entitlements.plist" "$work/profile.plist"
          app="citizenwallet/build/ios/iphoneos/Runner.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = ios.citizenwallet
          cp "$work/profile.mobileprovision" "$app/embedded.mobileprovision"
          find "$app" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' item; do
            codesign --force --sign "$certificate_sha1" --keychain "$keychain" --timestamp=none "$item"
          done
          find "$app" -type d \( -name '*.framework' -o -name '*.appex' \) -print0 \
            | while IFS= read -r -d '' item; do
                codesign --force --sign "$certificate_sha1" --keychain "$keychain" --timestamp=none "$item"
              done
          codesign --force --sign "$certificate_sha1" --keychain "$keychain" --timestamp=none \
            --generate-entitlement-der --entitlements "$work/entitlements.plist" "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2> "$work/codesign.txt"
          grep -F 'TeamIdentifier=MHYMVRN6FC' "$work/codesign.txt"
          mkdir -p "$work/package/Payload"
          cp -R "$app" "$work/package/Payload/Runner.app"
          (cd "$work/package" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/$publish/citizenwallet.ipa")
          unzip -Z1 "$publish/citizenwallet.ipa" | grep -Fx 'Payload/Runner.app/Info.plist'

      - name: 生成并核验 iOS 正式清单
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const root = 'citizenwallet/build/release';
          const digest = createHash('sha256').update(fs.readFileSync(`${root}/citizenwallet.ipa`)).digest('hex');
          fs.writeFileSync(`${root}/citizenwallet-release-ios.json`, `${JSON.stringify({
            product_id: 'citizenwallet', version: process.env.GMB_SOFTWARE_VERSION,
            github_run_number: Number(process.env.GITHUB_RUN_NUMBER), head_sha: process.env.GMB_SOURCE_SHA,
            bundle_id: 'ios.citizenwallet', package_name: 'com.crcfrcn.citizenwallet',
            assets: [{ platform: 'ios', asset_name: 'citizenwallet.ipa', asset_sha256: digest }],
          }, null, 2)}\n`);
          NODE
          test "$(find citizenwallet/build/release -type f | wc -l | tr -d ' ')" = 2

      - name: 签署 iOS 正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenwallet/build/release/*

      - name: 固化 iOS 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizenwallet/release-ios.mjs github-release \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民钱包 · Release · iOS' \
            --notes "公民钱包 iOS 正式版 v${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets citizenwallet/build/release/*
