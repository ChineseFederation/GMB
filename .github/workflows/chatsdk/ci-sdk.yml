name: 聊天SDK · CI · SDK
# CI_CACHE: enabled
# 中文注释：CI 只复用可再生成缓存，最终候选产物在保存前清除。
run-name: 聊天SDK · CI · SDK

# 中文注释：ChatSDK CI 只验证当前 main 提交并生成三端原生候选；CI 不生成、递增或持久化软件版本。
on:
  workflow_dispatch:

concurrency:
  group: chatsdk-ci-sdk
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CI: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  GMB_SOURCE_SHA: ${{ github.sha }}

jobs:
  check:
    permissions: { actions: write, contents: read }
    name: SDK 源码、原生核心与三端候选检查
    runs-on: macos-15
    steps:
      - name: 拉取当前 main 代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: 准备统一CI增量缓存
        id: ci_cache
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_PRODUCT: chatsdk
          CI_CACHE_PLATFORM: sdk
          CI_CACHE_ARCHITECTURE: sdk
          CI_CACHE_COMPONENT: check
          CI_CACHE_WORKFLOW: chatsdk-sdk
          CI_CACHE_JOB: check
          CI_CACHE_TOOLCHAIN_FINGERPRINT: ${{ hashFiles('.github/dependencies.json', 'Cargo.lock', '**/Cargo.lock', '**/pubspec.lock', '**/package-lock.json') }}
          CI_CACHE_PATHS: |
            cargo-home
            cargo-target
            dart-pub
            xdg
          CI_CACHE_LINKS: ""
          CI_CACHE_FINALS: |
            cargo-target/aarch64-linux-android/release/libchat_sdk.so
            cargo-target/aarch64-apple-ios/release/libchat_sdk.a
            cargo-target/aarch64-apple-darwin/release/libchat_sdk.dylib
        run: node .github/scripts/ci-cache.mjs prepare

      - name: 恢复上一次成功的CI增量缓存
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.restore_key }}

      - name: 接入受控生成目录
        run: node .github/scripts/ci-cache.mjs wire

      - name: 清理缓存中的最终产物
        run: node .github/scripts/ci-cache.mjs sanitize
      - name: 安装固定 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1

      - name: 校验代码来源与 ChatSDK 依赖作用域
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/chatsdk/ci-sdk.mjs dependencies check --scope chatsdk
          node --test chatsdk/scripts/release.test.mjs

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android,aarch64-apple-ios,aarch64-apple-darwin

      - name: 安装固定 Cargo 审计工具
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          value = json.loads(Path('.github/dependencies.json').read_text(encoding='utf-8'))
          print(f"version={value['toolchains']['flutter']}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装固定 Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: 建立 ChatSDK 隔离构建源码
        run: |
          build_source="$RUNNER_TEMP/chatsdk/build-source"
          test ! -e "$build_source"
          mkdir -p "$(dirname "$build_source")"
          /usr/bin/ditto chatsdk "$build_source"

      - name: 检查 Dart、Flutter 与 Rust 源码
        working-directory: ${{ runner.temp }}/chatsdk/build-source
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          cargo test --manifest-path native/Cargo.toml --all-targets --locked
          flutter test

      - name: 执行 ChatSDK 依赖安全审计
        run: node .github/scripts/chatsdk/ci-sdk.mjs dependencies audit --scope chatsdk

      - name: 构建 Android、iOS 与 macOS ARM64 原生核心
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          CARGO_TARGET_DIR: $CI_INCREMENTAL_ROOT/cargo-target
        run: |
          build_source="$RUNNER_TEMP/chatsdk/build-source"
          native_output="$RUNNER_TEMP/chatsdk/native"
          ndk_host="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -x "$ndk_host/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk_host/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$ndk_host/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk_host/bin/llvm-ar"
          cargo build --manifest-path "$build_source/native/Cargo.toml" --target aarch64-linux-android --release --locked
          cargo build --manifest-path "$build_source/native/Cargo.toml" --target aarch64-apple-ios --release --locked
          cargo build --manifest-path "$build_source/native/Cargo.toml" --target aarch64-apple-darwin --release --locked
          mkdir -p "$native_output/android" "$native_output/ios" "$native_output/macos"
          cp "$CARGO_TARGET_DIR/aarch64-linux-android/release/libchat_sdk.so" "$native_output/android/libchat_sdk.so"
          cp "$CARGO_TARGET_DIR/aarch64-apple-ios/release/libchat_sdk.a" "$native_output/ios/libchat_sdk.a"
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/libchat_sdk.dylib" "$native_output/macos/libchat_sdk.dylib"
          printf '%s\n' "$GMB_SOURCE_SHA" > "$RUNNER_TEMP/chatsdk/source-sha.txt"

      - name: 上传 ChatSDK 三端原生候选
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChatSDK-CI
          path: |
            ${{ runner.temp }}/chatsdk/native/android/libchat_sdk.so
            ${{ runner.temp }}/chatsdk/native/ios/libchat_sdk.a
            ${{ runner.temp }}/chatsdk/native/macos/libchat_sdk.dylib
            ${{ runner.temp }}/chatsdk/source-sha.txt
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: 签署 ChatSDK 三端原生候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/chatsdk/native/android/libchat_sdk.so
            ${{ runner.temp }}/chatsdk/native/ios/libchat_sdk.a
            ${{ runner.temp }}/chatsdk/native/macos/libchat_sdk.dylib
            ${{ runner.temp }}/chatsdk/source-sha.txt
      - name: 记录失败CI增量缓存
        if: ${{ failure() && !cancelled() }}
        env:
          CI_CACHE_TERMINAL_STATE: failure
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次失败的CI增量缓存
        id: ci_cache_save_failure
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.failure_paths }}
          key: ${{ steps.ci_cache.outputs.failure_key }}

      - name: 清理旧失败CI增量缓存
        if: ${{ failure() && !cancelled() && steps.ci_cache_save_failure.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: failure
        run: node .github/scripts/ci-cache.mjs prune

      - name: 准备成功CI增量缓存
        if: ${{ success() }}
        env:
          CI_CACHE_TERMINAL_STATE: success
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次成功的CI增量缓存
        id: ci_cache_save_success
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.success_key }}

      - name: 清理旧成功CI增量缓存
        if: ${{ success() && steps.ci_cache_save_success.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: success
        run: node .github/scripts/ci-cache.mjs prune
