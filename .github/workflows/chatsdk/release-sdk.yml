name: 聊天SDK · Release · SDK
# RELEASE_BUILD_MODE: full-v1
run-name: 聊天SDK · Release · SDK

# 中文注释：Release 只接收准确成功 CI 的 source_sha 和三端候选，一次生成并固化正式三件套。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 成功 CI 的准确 GitHub main 提交
        required: true
        type: string
      ci_run_id:
        description: 本次 Release 复核的准确成功 CI run_id
        required: true
        type: string
      version_tag:
        description: ChatSDK 正式版本 Tag
        required: true
        type: string
      software_version:
        description: ChatSDK 正式软件版本
        required: true
        type: string

concurrency:
  group: chatsdk-release-sdk
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  CI: true
  GMB_SOURCE_SHA: ${{ inputs.source_sha }}
  GMB_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GMB_VERSION_TAG: ${{ inputs.version_tag }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}

jobs:
  check:
    env: { CARGO_INCREMENTAL: "0" }
    name: SDK 正式三件套验真与固化
    runs-on: macos-15
    steps:
      - name: 拉取成功 CI 的代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}

      - name: 拉取 Release 事务工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/chatsdk/release-sdk.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 安装固定 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1

      - name: 验证 ChatSDK Release 来源与版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/chatsdk/release-sdk.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --software-version "$GMB_SOFTWARE_VERSION"
          --prefix chatsdk-v --product-id chatsdk
          --target sdk --workflow chatsdk/ci-sdk.yml

      - name: 校验 ChatSDK 依赖作用域与发布闭集
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/chatsdk/release-sdk.mjs dependencies check --scope chatsdk
          node --test chatsdk/scripts/release.test.mjs

      - name: 下载准确成功 CI 的三端原生候选
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          native_root="$RUNNER_TEMP/chatsdk/ci"
          mkdir -p "$native_root"
          gh run download "$GMB_CI_RUN_ID" --name ChatSDK-CI --dir "$native_root"
          test "$(cat "$native_root/source-sha.txt")" = "$GMB_SOURCE_SHA"
          test -s "$native_root/native/android/libchat_sdk.so"
          test -s "$native_root/native/ios/libchat_sdk.a"
          test -s "$native_root/native/macos/libchat_sdk.dylib"

      - name: 生成并复核 ChatSDK 正式三件套
        run: |
          output="$RUNNER_TEMP/chatsdk/release"
          node chatsdk/scripts/release.mjs \
            --source chatsdk \
            --native "$RUNNER_TEMP/chatsdk/ci/native" \
            --output "$output" \
            --archive "$output/chatsdk.tgz" \
            --git-sha "$GMB_SOURCE_SHA" \
            --software-version "$GMB_SOFTWARE_VERSION"
          node chatsdk/scripts/release.mjs --verify-assets "$output" \
            --expected-git-sha "$GMB_SOURCE_SHA" \
            --software-version "$GMB_SOFTWARE_VERSION"

      - name: 签署 ChatSDK 正式三件套构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/chatsdk/release/chatsdk.tgz
            ${{ runner.temp }}/chatsdk/release/chatsdk-release.json
            ${{ runner.temp }}/chatsdk/release/SHA256SUMS

      - name: 固化 ChatSDK 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          output="$RUNNER_TEMP/chatsdk/release"
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/chatsdk/release-sdk.mjs github-release \
            --tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA" \
            --title '聊天SDK · Release · SDK' \
            --notes "聊天SDK ${GMB_SOFTWARE_VERSION}，包含 Android ARM64、iOS ARM64 与 macOS ARM64。\n+              GMB_RELEASE_CI_RUN_ID:${GMB_CI_RUN_ID}\n+              GMB_RELEASE_RUN_ID:${GITHUB_RUN_ID}" \
            --latest false \
            --assets "$output/chatsdk.tgz" \
              "$output/chatsdk-release.json" "$output/SHA256SUMS"
