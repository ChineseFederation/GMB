name: 公民网 · CI · Web
# CI_CACHE: enabled
# 中文注释：CI 只复用可再生成缓存，最终候选产物在保存前清除。
run-name: 公民网 · CI · Web

# 中文注释：官网是独立产品，使用自己的 workflow、版本和候选产物；CI 只构建静态网站，
# 不读取 Cloudflare 生产令牌，不创建 Pages Deployment，也不复用 CitizenApp 移动端流水线。
on:
  workflow_dispatch:

concurrency:
  group: citizenweb-ci-web
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CI: 1
  WRANGLER_SEND_METRICS: false
  GMB_SOURCE_SHA: ${{ github.sha }}

jobs:
  check:
    permissions: { actions: write, contents: read }
    name: 官网代码与正式构建检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: 准备统一CI增量缓存
        id: ci_cache
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_PRODUCT: citizenweb
          CI_CACHE_PLATFORM: web
          CI_CACHE_ARCHITECTURE: web
          CI_CACHE_COMPONENT: check
          CI_CACHE_WORKFLOW: citizenweb-web
          CI_CACHE_JOB: check
          CI_CACHE_TOOLCHAIN_FINGERPRINT: ${{ hashFiles('.github/dependencies.json', 'Cargo.lock', '**/Cargo.lock', '**/pubspec.lock', '**/package-lock.json') }}
          CI_CACHE_PATHS: |
            npm
            xdg
          CI_CACHE_LINKS: ""
          CI_CACHE_FINALS: ""
        run: node .github/scripts/ci-cache.mjs prepare

      - name: 恢复上一次成功的CI增量缓存
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.restore_key }}

      - name: 接入受控生成目录
        run: node .github/scripts/ci-cache.mjs wire

      - name: 清理缓存中的最终产物
        run: node .github/scripts/ci-cache.mjs sanitize
      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenweb/ci-web.mjs dependencies check --scope citizenweb

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1

      - name: 安装官网锁定依赖
        working-directory: citizenweb
        run: npm ci

      - name: 执行依赖安全审计
        run: node .github/scripts/citizenweb/ci-web.mjs dependencies audit --scope citizenweb

      - name: 检查官网代码
        working-directory: citizenweb
        run: npm run lint

      - name: 执行官网候选契约测试
        working-directory: citizenweb
        run: npm test

      - name: 生成官网正式构建产物
        working-directory: citizenweb
        run: npm run build

      - name: 生成不可变官网候选与规范归档
        run: |
          node .github/scripts/citizenweb/ci-web.mjs citizenweb-release \
            --project citizenweb \
            --dist citizenweb/dist \
            --output "$RUNNER_TEMP/citizenweb-candidate" \
            --git-sha "$GMB_SOURCE_SHA" \
            --archive "$RUNNER_TEMP/citizenweb-release.tgz"

      - name: 上传官网候选
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CitizenWeb-CI
          path: |
            ${{ runner.temp }}/citizenweb-candidate
            ${{ runner.temp }}/citizenweb-release.tgz
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: 签署官网候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/citizenweb-release.tgz
      - name: 记录失败CI增量缓存
        if: ${{ failure() && !cancelled() }}
        env:
          CI_CACHE_TERMINAL_STATE: failure
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次失败的CI增量缓存
        id: ci_cache_save_failure
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.failure_paths }}
          key: ${{ steps.ci_cache.outputs.failure_key }}

      - name: 清理旧失败CI增量缓存
        if: ${{ failure() && !cancelled() && steps.ci_cache_save_failure.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: failure
        run: node .github/scripts/ci-cache.mjs prune

      - name: 准备成功CI增量缓存
        if: ${{ success() }}
        env:
          CI_CACHE_TERMINAL_STATE: success
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次成功的CI增量缓存
        id: ci_cache_save_success
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.success_key }}

      - name: 清理旧成功CI增量缓存
        if: ${{ success() && steps.ci_cache_save_success.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: success
        run: node .github/scripts/ci-cache.mjs prune
