name: 公民网 · CI · Web
run-name: 公民网 · CI · Web

# 中文注释：官网是独立产品，使用自己的 workflow、版本和候选产物；CI 只构建静态网站，
# 不读取 Cloudflare 生产令牌，不创建 Pages Deployment，也不复用 CitizenApp 移动端流水线。
on:
  workflow_dispatch:

concurrency:
  group: citizenweb-ci-web
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CI: 1
  WRANGLER_SEND_METRICS: false
  GMB_SOURCE_SHA: ${{ github.sha }}

jobs:
  check:
    name: 官网代码与正式构建检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenweb/ci-web.mjs dependencies check --scope citizenweb

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenweb/package-lock.json

      - name: 安装官网锁定依赖
        working-directory: citizenweb
        run: npm ci

      - name: 执行依赖安全审计
        run: node .github/scripts/citizenweb/ci-web.mjs dependencies audit --scope citizenweb

      - name: 检查官网代码
        working-directory: citizenweb
        run: npm run lint

      - name: 执行官网候选契约测试
        working-directory: citizenweb
        run: npm test

      - name: 生成官网正式构建产物
        working-directory: citizenweb
        run: npm run build

      - name: 生成不可变官网候选与规范归档
        run: |
          node .github/scripts/citizenweb/ci-web.mjs citizenweb-release \
            --project citizenweb \
            --dist citizenweb/dist \
            --output "$RUNNER_TEMP/citizenweb-candidate" \
            --git-sha "$GMB_SOURCE_SHA" \
            --archive "$RUNNER_TEMP/citizenweb-release.tgz"

      - name: 上传官网候选
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CitizenWeb-CI
          path: |
            ${{ runner.temp }}/citizenweb-candidate
            ${{ runner.temp }}/citizenweb-release.tgz
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: 签署官网候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/citizenweb-release.tgz
