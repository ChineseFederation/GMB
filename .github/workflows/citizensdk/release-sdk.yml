name: 公民SDK · Release · SDK
run-name: 公民SDK · Release · SDK

# 中文注释：Release 只重建并固化与成功 CI 完全相同 source_sha 的单一 SDK 候选；
# 不读取宿主产品密钥，也不把 Runner 临时产物回写 citizensdk 源码目录。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 成功 CI 的准确 GitHub main 提交
        required: true
        type: string
      ci_run_id:
        description: 本次 Release 复核的准确成功 CI run_id
        required: true
        type: string
      version_tag:
        description: CitizenSDK 正式版本 Tag
        required: true
        type: string
      software_version:
        description: CitizenSDK 候选软件版本
        required: true
        type: string

concurrency:
  group: citizensdk-release-sdk
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  CI: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  GMB_SOURCE_SHA: ${{ inputs.source_sha }}
  GMB_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GMB_VERSION_TAG: ${{ inputs.version_tag }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}

jobs:
  check:
    name: SDK 正式候选重建与固化
    runs-on: macos-15
    steps:
      - name: 拉取成功 CI 的代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}

      # 中文注释：产品源码固定在成功 CI 提交；Release 事务工具从当前统一入口提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizensdk/release-sdk.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 安装固定 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1

      - name: 验证 CitizenSDK Release 正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/citizensdk/release-sdk.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --software-version "$GMB_SOFTWARE_VERSION"
          --prefix citizensdk-v --product-id citizensdk
          --target sdk --workflow citizensdk/ci-sdk.yml

      - name: 校验代码来源与 CitizenSDK 依赖作用域
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizensdk/release-sdk.mjs dependencies check --scope citizensdk

      - name: 检查 CitizenSDK 发布闭集与归档合同
        env:
          PROGRAM_CONSOLE_WORK_DIR: ${{ runner.temp }}/citizensdk/release-tests
        run: node --test citizensdk/scripts/release.test.mjs

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: 安装固定 Cargo 审计工具
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          value = json.loads(Path('.github/dependencies.json').read_text(encoding='utf-8'))
          print(f"version={value['toolchains']['flutter']}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装 Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装固定 Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      # 中文注释：正式候选的源码必须保持检出字节不变；全部工具记录和生成头文件只允许
      # 出现在 Runner 临时快照，打包继续读取原始 citizensdk 目录。
      - name: 建立 CitizenSDK 隔离构建源码
        run: |
          build_source="$RUNNER_TEMP/citizensdk/build-source"
          test ! -e "$build_source"
          mkdir -p "$(dirname "$build_source")"
          /usr/bin/ditto citizensdk "$build_source"

      - name: 安装锁定 Dart 与 Flutter 依赖
        working-directory: ${{ runner.temp }}/citizensdk/build-source
        run: flutter pub get --enforce-lockfile

      - name: 执行 CitizenSDK 依赖安全审计
        run: node .github/scripts/citizensdk/release-sdk.mjs dependencies audit --scope citizensdk

      - name: 检查 Dart、Flutter 与 Rust 源码
        run: |
          build_source="$RUNNER_TEMP/citizensdk/build-source"
          # 中文注释：单包重构把已验证的 smoldot 绑定及其来源测试迁入根包；保留其
          # 既有 warning/info，不通过批量改写改变行为，但任何 analyzer error 仍会失败。
          (cd "$build_source" && dart format --output=none --set-exit-if-changed lib test && flutter analyze --no-fatal-infos --no-fatal-warnings)
          cargo test --manifest-path "$build_source/Cargo.toml" --workspace --all-targets --locked
          cargo test --manifest-path "$build_source/native/smoldot/ffi/Cargo.toml" --all-targets --locked
          # 中文注释：PoW workspace 的 Criterion 基准使用随机输入；完整运行测试，但只编译
          # 所有 target，避免把性能基准误当成具有确定输入的测试执行。
          cargo test --manifest-path "$build_source/native/smoldot/pow/Cargo.toml" --workspace --locked
          cargo check --manifest-path "$build_source/native/smoldot/pow/Cargo.toml" --workspace --all-targets --locked

      - name: 构建并核验移动原生核心
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          CITIZENSDK_WORK_DIR: ${{ runner.temp }}/citizensdk/work
          CITIZENSDK_NATIVE_OUTPUT_DIR: ${{ runner.temp }}/citizensdk/native
        run: $RUNNER_TEMP/citizensdk/build-source/scripts/build-native.sh all

      - name: 编译并运行 Android 与 iOS 插件测试
        env:
          PROGRAM_CONSOLE_NATIVE_ANDROID_DIR: ${{ runner.temp }}/citizensdk/native/android
          PROGRAM_CONSOLE_NATIVE_IOS_DIR: ${{ runner.temp }}/citizensdk/native/ios
          PROGRAM_CONSOLE_NATIVE_IOS_SIMULATOR_DIR: ${{ runner.temp }}/citizensdk/native/ios-simulator
          GRADLE_USER_HOME: ${{ runner.temp }}/citizensdk/gradle
          TMPDIR: ${{ runner.temp }}/citizensdk/tmp
        run: |
          build_source="$RUNNER_TEMP/citizensdk/build-source"
          hosts="$RUNNER_TEMP/citizensdk/platform-hosts"
          mkdir -p "$hosts" "$GRADLE_USER_HOME" "$TMPDIR"

          android_host="$hosts/android"
          test ! -e "$android_host"
          flutter create --platforms=android --org org.citizensdk.verify \
            --project-name citizensdk_android_verify "$android_host"
          flutter pub add --directory "$android_host" citizen_sdk --path "$build_source"
          (cd "$android_host" && flutter build apk --debug --target-platform android-arm64)
          (cd "$android_host/android" && ./gradlew :citizen_sdk:testDebugUnitTest --no-daemon)

          ios_device_host="$hosts/ios-device"
          ios_test_host="$hosts/ios-test"
          for ios_host in "$ios_device_host" "$ios_test_host"; do
            test ! -e "$ios_host"
            flutter create --platforms=ios --org org.citizensdk.verify \
              --project-name citizensdk_ios_verify "$ios_host"
            flutter pub add --directory "$ios_host" citizen_sdk --path "$build_source"
          done
          python3 - \
            "$ios_device_host/ios/Podfile" "$ios_device_host/ios/Runner.xcodeproj/project.pbxproj" \
            "$ios_test_host/ios/Podfile" "$ios_test_host/ios/Runner.xcodeproj/project.pbxproj" <<'PY'
          import re
          import sys
          from pathlib import Path

          arguments = sys.argv[1:]
          if len(arguments) != 4:
              raise SystemExit('iOS 宿主参数数量漂移')
          for offset in range(0, len(arguments), 2):
              podfile_path = Path(arguments[offset])
              project_path = Path(arguments[offset + 1])
              podfile = podfile_path.read_text(encoding='utf-8')
              podfile, platform_count = re.subn(
                  r"^#?\s*platform :ios, '[^']+'$",
                  "platform :ios, '16.0'",
                  podfile,
                  count=1,
                  flags=re.MULTILINE,
              )
              needle = "    flutter_additional_ios_build_settings(target)\n"
              replacement = (
                  needle
                  + "    target.build_configurations.each do |config|\n"
                  + "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'\n"
                  + "    end\n"
              )
              if platform_count != 1 or podfile.count(needle) != 1:
                  raise SystemExit('生成的 iOS Podfile 结构漂移')
              podfile_path.write_text(podfile.replace(needle, replacement), encoding='utf-8')
              project = project_path.read_text(encoding='utf-8')
              project, target_count = re.subn(
                  r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;",
                  "IPHONEOS_DEPLOYMENT_TARGET = 16.0;",
                  project,
              )
              if target_count == 0:
                  raise SystemExit('生成的 iOS deployment target 缺失')
              project_path.write_text(project, encoding='utf-8')
          PY
          (cd "$ios_device_host" && flutter build ios --no-codesign --release)

          # 正式 podspec 只接收 iOS ARM64 设备库。测试快照在设备构建通过后解除
          # Simulator 架构排除，并注入仅测试的同宿主 Rust 静态库。
          python3 - "$build_source/ios/citizen_sdk.podspec" \
            "$build_source/ios/Tests/SecureEnclaveSecretVaultTests.swift" \
            "$build_source/ios/Tests/VaultEnvelopeTests.swift" \
            "$ios_test_host/ios/RunnerTests/RunnerTests.swift" <<'PY'
          import re
          import sys
          from pathlib import Path

          podspec = Path(sys.argv[1])
          source = podspec.read_text(encoding='utf-8')
          source, count = re.subn(
              r"^\s*'EXCLUDED_ARCHS\[sdk=iphonesimulator\*\]'\s*=>\s*'i386 x86_64',\n",
              '',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit('CitizenSDK iOS Simulator 架构合同漂移')
          podspec.write_text(source, encoding='utf-8')
          tests = [Path(sys.argv[2]), Path(sys.argv[3])]
          Path(sys.argv[4]).write_text(
              '\n'.join(path.read_text(encoding='utf-8') for path in tests),
              encoding='utf-8',
          )
          PY
          (
            cd "$ios_test_host/ios"
            PROGRAM_CONSOLE_NATIVE_IOS_DIR="$PROGRAM_CONSOLE_NATIVE_IOS_SIMULATOR_DIR" pod install
          )
          simulator_id="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json'],
              text=True,
          ))
          candidates = [
              device
              for devices in payload.get('devices', {}).values()
              for device in devices
              if device.get('isAvailable') and device.get('name', '').startswith('iPhone')
          ]
          if not candidates:
              raise SystemExit('Runner 没有可用 iPhone Simulator')
          print(candidates[-1]['udid'])
          PY
          )"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild test \
            -workspace "$ios_test_host/ios/Runner.xcworkspace" \
            -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO

      - name: 运行 CitizenSDK Dart 与 Flutter 测试
        working-directory: ${{ runner.temp }}/citizensdk/build-source
        env:
          DYLD_LIBRARY_PATH: ${{ runner.temp }}/citizensdk/native/host
        run: |
          # smoldot Dart 绑定已经并入根包；宿主测试库只注入隔离构建根目录，
          # 绝不回写 CitizenSDK 包源码或正式候选。
          /usr/bin/ditto "$RUNNER_TEMP/citizensdk/native/host/libsmoldot.dylib" \
            "$RUNNER_TEMP/citizensdk/build-source/libsmoldot.dylib"
          # 来源测试已迁入根 test/smoldot；两分钟外层超时覆盖其 30 秒活链窗口。
          flutter test --timeout=2m

      - name: 生成并复核 CitizenSDK 正式候选
        run: |
          node .github/scripts/citizensdk/release-sdk.mjs citizensdk-release \
            --source citizensdk \
            --native "$RUNNER_TEMP/citizensdk/native" \
            --output "$RUNNER_TEMP/citizensdk/candidate" \
            --archive "$RUNNER_TEMP/citizensdk/citizensdk.tgz" \
            --git-sha "$GMB_SOURCE_SHA" \
            --software-version "$GMB_SOFTWARE_VERSION"
          node .github/scripts/citizensdk/release-sdk.mjs citizensdk-release \
            --verify "$RUNNER_TEMP/citizensdk/candidate" \
            --archive "$RUNNER_TEMP/citizensdk/citizensdk.tgz" \
            --expected-git-sha "$GMB_SOURCE_SHA"

      # 中文注释：正式 GitHub Release 与未来 Hosted 发布共用唯一候选；这里只验证
      # Hosted 可发布性，不在 Release workflow 内执行实际 Hosted 上传。验证在逐字节
      # 临时副本执行，避免 Dart 写入 .dart_tool 后污染已反向核验的正式候选。
      - name: 验证 CitizenSDK Hosted Package 正式候选
        run: |
          hosted_dry_run="$RUNNER_TEMP/citizensdk/hosted-dry-run"
          test ! -e "$hosted_dry_run"
          /usr/bin/ditto "$RUNNER_TEMP/citizensdk/candidate" "$hosted_dry_run"
          dart pub publish --dry-run -C "$hosted_dry_run"

      - name: 签署 CitizenSDK 正式候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/citizensdk/citizensdk.tgz
            ${{ runner.temp }}/citizensdk/candidate/citizensdk-release.json
            ${{ runner.temp }}/citizensdk/candidate/SHA256SUMS

      - name: 固化 CitizenSDK 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate="$RUNNER_TEMP/citizensdk/candidate"
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizensdk/release-sdk.mjs github-release \
            --tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA" \
            --title '公民SDK · Release · SDK' \
            --notes "公民SDK ${GMB_SOFTWARE_VERSION}，包含 Android ARM64 与 iOS ARM64。
              GMB_RELEASE_CI_RUN_ID:${GMB_CI_RUN_ID}
              GMB_RELEASE_RUN_ID:${GITHUB_RUN_ID}" \
            --latest false \
            --assets "$RUNNER_TEMP/citizensdk/citizensdk.tgz" \
              "$candidate/citizensdk-release.json" "$candidate/SHA256SUMS"
