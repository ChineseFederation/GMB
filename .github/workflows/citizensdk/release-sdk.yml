name: 公民SDK · Release · SDK
run-name: 公民SDK · Release · SDK

# 中文注释：Release 只重建并固化与成功 CI 完全相同 source_sha 的单一 SDK 候选；
# 不读取宿主产品密钥，也不把 Runner 临时产物回写 citizensdk 源码目录。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 成功 CI 的准确 GitHub main 提交
        required: true
        type: string
      ci_run_id:
        description: 本次 Release 复核的准确成功 CI run_id
        required: true
        type: string
      version_tag:
        description: CitizenSDK 正式版本 Tag
        required: true
        type: string
      software_version:
        description: CitizenSDK 候选软件版本
        required: true
        type: string

concurrency:
  group: citizensdk-release-sdk
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  CI: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  GMB_SOURCE_SHA: ${{ inputs.source_sha }}
  GMB_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GMB_VERSION_TAG: ${{ inputs.version_tag }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}

jobs:
  check:
    name: SDK 正式候选重建与固化
    runs-on: macos-15
    steps:
      - name: 拉取成功 CI 的代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}

      # 中文注释：产品源码固定在成功 CI 提交；Release 事务工具从当前统一入口提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizensdk/release-sdk.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 验证 CitizenSDK Release 正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/citizensdk/release-sdk.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizensdk-v --product-id citizensdk
          --target sdk --workflow citizensdk/ci-sdk.yml

      - name: 校验代码来源与 CitizenSDK 依赖作用域
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizensdk/release-sdk.mjs dependencies check --scope citizensdk

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android,aarch64-apple-ios

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          value = json.loads(Path('.github/dependencies.json').read_text(encoding='utf-8'))
          print(f"version={value['toolchains']['flutter']}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装 Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装固定 Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: 安装锁定 Flutter 依赖
        working-directory: citizensdk
        run: flutter pub get --enforce-lockfile

      - name: 执行 CitizenSDK 依赖安全审计
        run: node .github/scripts/citizensdk/release-sdk.mjs dependencies audit --scope citizensdk

      - name: 检查 Dart、Flutter 与 Rust 源码
        run: |
          (cd citizensdk && dart format --output=none --set-exit-if-changed lib test && flutter analyze)
          cargo test --manifest-path citizensdk/Cargo.toml --workspace --all-targets --locked
          cargo test --manifest-path citizensdk/native/smoldot/ffi/Cargo.toml --all-targets --locked
          cargo test --manifest-path citizensdk/native/smoldot/pow/Cargo.toml --workspace --all-targets --locked

      - name: 构建并核验移动原生核心
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          CITIZENSDK_WORK_DIR: ${{ runner.temp }}/citizensdk/work
          CITIZENSDK_NATIVE_OUTPUT_DIR: ${{ runner.temp }}/citizensdk/native
        run: citizensdk/scripts/build-native.sh all

      - name: 运行 CitizenSDK Flutter 测试
        working-directory: citizensdk
        env:
          DYLD_LIBRARY_PATH: ${{ runner.temp }}/citizensdk/native/host
        run: flutter test

      - name: 生成并复核 CitizenSDK 正式候选
        run: |
          node .github/scripts/citizensdk/release-sdk.mjs citizensdk-release \
            --source citizensdk \
            --native "$RUNNER_TEMP/citizensdk/native" \
            --output "$RUNNER_TEMP/citizensdk/candidate" \
            --archive "$RUNNER_TEMP/citizensdk/citizensdk.tgz" \
            --git-sha "$GMB_SOURCE_SHA" \
            --software-version "$GMB_SOFTWARE_VERSION"
          node .github/scripts/citizensdk/release-sdk.mjs citizensdk-release \
            --verify "$RUNNER_TEMP/citizensdk/candidate" \
            --expected-git-sha "$GMB_SOURCE_SHA"

      - name: 签署 CitizenSDK 正式候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/citizensdk/citizensdk.tgz
            ${{ runner.temp }}/citizensdk/candidate/citizensdk-release.json
            ${{ runner.temp }}/citizensdk/candidate/SHA256SUMS

      - name: 固化 CitizenSDK 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate="$RUNNER_TEMP/citizensdk/candidate"
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizensdk/release-sdk.mjs github-release \
            --tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA" \
            --title '公民SDK · Release · SDK' \
            --notes "公民SDK ${GMB_SOFTWARE_VERSION}，包含 Android ARM64 与 iOS ARM64。" \
            --latest false \
            --assets "$RUNNER_TEMP/citizensdk/citizensdk.tgz" \
              "$candidate/citizensdk-release.json" "$candidate/SHA256SUMS"
