      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/ci-node-linux-arm.yaml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 锁定公民链 LinuxARM 构建范围
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      citizenchain: ${{ steps.scope.outputs.citizenchain }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_matrix: ${{ steps.scope.outputs.desktop_matrix }}
    steps:
      - name: 拉取完整变更历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          fetch-depth: 0

      # 桌面端与两款移动产品共用 shared/branding/logo.png 唯一母版。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并启用节点全量构建
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/ci-node-linux-arm.mjs dependencies check --scope citizenchain-node
          echo "citizenchain=true" >> "$GITHUB_OUTPUT"
