      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenchain/release-node-linux-arm.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 校验代码来源并应用节点候选版本
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/release-node-linux-arm.mjs dependencies check --scope citizenchain-node
          node release-tool/.github/scripts/citizenchain/release-node-linux-arm.mjs node-version apply "$GMB_SOFTWARE_VERSION"

      - name: 校验 runner 架构
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]; then
            echo "::error::runner 架构不符合 ${EXPECTED_RUNNER_ARCH}: 当前为 ${RUNNER_ARCH}"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: 安装 Node.js
        # 固定使用 Node.js 25.2.1,与项目 package.json engines 统一 Node.js 工具链一致。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 同步桌面端版本
        shell: bash
        env:
          CITIZENCHAIN_CI_BUNDLE_TARGETS: ${{ matrix.ci_bundle_targets }}
          CITIZENCHAIN_MANUAL_BUNDLE_TARGETS: ${{ matrix.manual_bundle_targets }}
          CITIZENCHAIN_UPDATER_MANIFEST_NAME: ${{ matrix.updater_manifest_name }}
          CITIZENCHAIN_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const targetSource = process.env.CITIZENCHAIN_MANUAL_BUNDLE_TARGETS;
          const bundleTargets = (targetSource || '')
            .split(',')
            .map((target) => target.trim())
            .filter(Boolean);

          if (bundleTargets.length === 0) {
            throw new Error('缺少本 matrix 的 Tauri bundle targets。');
          }

          // 候选版本已在当前 runner 工作区应用；这里只设置本 matrix 的 bundle 目标。
          const tauriPath = 'citizenchain/node/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          const version = tauri.version;
          tauri.bundle = tauri.bundle || {};
          // 中文注释：Release 生成安装包与 updater 正式文件；正式签名在同一 runner 的后续步骤完成。
          tauri.bundle.targets = bundleTargets;
          // 中文注释：显式关闭 Tauri 自动 updater 归档；本 workflow 按现有平台文件格式签名并生成清单。
          delete tauri.bundle.createUpdaterArtifacts;
          // 中文注释：平台 Release 可以独立成功，因此每个安装包只读取自己的更新清单；
          // 不能再用一个根 version 同时描述版本可能不同的四个目标。
          tauri.plugins = tauri.plugins || {};
          tauri.plugins.updater = tauri.plugins.updater || {};
          tauri.plugins.updater.endpoints = [
            `https://github.com/ChineseFederation/GMB/releases/download/${process.env.GMB_VERSION_TAG}/${process.env.CITIZENCHAIN_UPDATER_MANIFEST_NAME}`,
          ];
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          console.log(`桌面端版本(源码): ${version}`);
          console.log(`Tauri bundle targets: ${bundleTargets.join(',')}`);
          NODE

      - name: 安装 Linux 构建依赖
        if: startsWith(matrix.platform, 'linux-')
        run: node .github/scripts/citizenchain/release-node-linux-arm.mjs linux-deps

      - name: 配置 Linux libclang 环境变量
        if: startsWith(matrix.platform, 'linux-')
        run: |
          {
            echo "LLVM_CONFIG_PATH=$(command -v llvm-config)"
            echo "LIBCLANG_PATH=$(llvm-config --libdir)"
            echo "PROTOC=$(command -v protoc)"
          } >> "$GITHUB_ENV"

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.cache_key }}
          workspaces: citizenchain -> target

      - name: 同步并锁定节点候选版本
        run: node release-tool/.github/scripts/citizenchain/release-node-linux-arm.mjs node-version lock "$GMB_SOFTWARE_VERSION"

      - name: 安装前端依赖并构建
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 准备空创世状态资源目录
        shell: bash
        run: |
          # 中文注释：安装包只携带节点软件；首次启动按冻结 chainspec 本地初始化并联网同步。
          rm -rf citizenchain/node/resources/genesis-state

      - name: Tauri 打包正式软件
        working-directory: citizenchain/node
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --ci -- --locked

      - name: 整理 Linux 产物
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        env:
          INSTALLER_NAME: ${{ matrix.installer_name }}
          UPDATER_ASSET_NAME: ${{ matrix.updater_asset_name }}
          EXPECTED_DEB_ARCH: ${{ matrix.deb_arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_PASS }}
        run: |
          set -euo pipefail
          mkdir -p citizenchain-release
          versioned_installer="${INSTALLER_NAME%.deb}-v${GMB_SOFTWARE_VERSION}.deb"
          versioned_updater="${UPDATER_ASSET_NAME%.AppImage}-v${GMB_SOFTWARE_VERSION}.AppImage"

          deb_file="$(find citizenchain/target/release/bundle/deb -name '*.deb' | head -1)"
          if [ -z "$deb_file" ]; then
            echo "::error::未找到 Linux deb 安装包。"
            exit 1
          fi
          actual_deb_arch="$(dpkg-deb -f "$deb_file" Architecture)"
          if [ "$actual_deb_arch" != "$EXPECTED_DEB_ARCH" ]; then
            echo "::error::deb 架构不符合 ${EXPECTED_DEB_ARCH}: 当前为 ${actual_deb_arch}"
            exit 1
          fi
          cp "$deb_file" "citizenchain-release/${versioned_installer}"

          appimage_file=""
          if [ -d citizenchain/target/release/bundle/appimage ]; then
            appimage_file="$(find citizenchain/target/release/bundle/appimage -name '*.AppImage' | head -1)"
          fi

          if [ -z "$appimage_file" ]; then
            echo "::error::Release 缺少 Linux updater AppImage。"
            exit 1
          fi
          cp "$appimage_file" "citizenchain-release/${versioned_updater}"
          (cd citizenchain/node && node frontend/node_modules/@tauri-apps/cli/tauri.js signer sign "$GITHUB_WORKSPACE/citizenchain-release/${versioned_updater}")
          signature="$(tr -d '\r\n' < "citizenchain-release/${versioned_updater}.sig")"
          test -n "$signature"
          node - "$versioned_updater" "$signature" <<'NODE'
          const fs = require('node:fs');
          const [asset, signature] = process.argv.slice(2);
          fs.writeFileSync('citizenchain-release/citizenchain-node-latest-linux-arm64.json', `${JSON.stringify({
            version: process.env.GMB_SOFTWARE_VERSION,
            notes: `CitizenChain LinuxARM v${process.env.GMB_SOFTWARE_VERSION}。`,
            pub_date: new Date().toISOString(),
            platforms: { 'linux-aarch64': {
              signature,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GMB_VERSION_TAG}/${asset}`,
            } },
          }, null, 2)}\n`);
          NODE

          ls -lh citizenchain-release

      - name: 签署节点平台正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenchain-release/*

      - name: 固化 LinuxARM 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find citizenchain-release -type f | wc -l | tr -d ' ')" = 4
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizenchain/release-node-linux-arm.mjs github-release \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民链 · Release · LinuxARM' \
            --notes "公民链 LinuxARM 正式版 v${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets citizenchain-release/*

  # ── .github/workflows/citizenchain/release-node-macos.yml ──
  citizenchain_release_node_macos__changes:
    env:
      GMB_NODE_PLATFORM: macos
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/release-node-macos.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 锁定公民链节点构建范围
    runs-on: ubuntu-24.04
    outputs:
      citizenchain: ${{ steps.scope.outputs.citizenchain }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_matrix: ${{ steps.scope.outputs.desktop_matrix }}
    steps:
      - name: 拉取完整变更历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          fetch-depth: 0

      # 中文注释：统一入口必须与产品分组真源同步；源码固定在成功 CI，前置版本
      # 验证只读取本次 workflow 的隔离工具，禁止再次执行旧 CI 中的版本算法。
      - name: 拉取前置 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenchain/release-node-macos.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 验证公民链 macOS Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/citizenchain/release-node-macos.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenchain-node-macos-v --product-id citizenchain-node
          --target macos --workflow citizenchain/ci-node-macos.yml

      # 桌面端与两款移动产品共用 shared/branding/logo.png 唯一母版。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并启用节点全量构建
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/release-node-macos.mjs dependencies check --scope citizenchain-node
          echo "citizenchain=true" >> "$GITHUB_OUTPUT"
          echo "desktop=true" >> "$GITHUB_OUTPUT"
          test "$GMB_NODE_PLATFORM" = macos
          echo 'desktop_matrix=[{"platform":"macos","name":"macOS Apple","os":"macos-15","artifact":"公民链macOS","installer_name":"citizenchain-node-macos-arm64.dmg","manual_bundle_targets":"dmg","updater_asset_name":"citizenchain-node-macos-arm64.app.tar.gz","updater_manifest_name":"citizenchain-node-latest-macos-arm64.json","expected_runner_arch":"ARM64","cache_key":"citizenchain-macos-apple"}]' >> "$GITHUB_OUTPUT"

  citizenchain_release_node_macos__build_desktop:
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    name: 打包公民链桌面端 (${{ matrix.name }})
    needs: [validate_dispatch, citizenchain_release_node_macos__changes]
    # 中文注释：CI 来源已由 CitizenConsole 锁定；Release 只构建本平台正式候选。
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/release-node-macos.yml' && needs.validate_dispatch.result == 'success' && (needs.citizenchain_release_node_macos__changes.outputs.desktop == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.citizenchain_release_node_macos__changes.outputs.desktop_matrix) }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenchain/release-node-macos.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 校验代码来源并应用节点候选版本
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/release-node-macos.mjs dependencies check --scope citizenchain-node
          node release-tool/.github/scripts/citizenchain/release-node-macos.mjs node-version apply "$GMB_SOFTWARE_VERSION"

      - name: 校验 runner 架构
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]; then
            echo "::error::runner 架构不符合 ${EXPECTED_RUNNER_ARCH}: 当前为 ${RUNNER_ARCH}"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: 安装 Node.js
        # 固定使用 Node.js 25.2.1,与项目 package.json engines 统一 Node.js 工具链一致。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 同步桌面端版本
        shell: bash
        env:
          CITIZENCHAIN_CI_BUNDLE_TARGETS: ${{ matrix.ci_bundle_targets }}
          CITIZENCHAIN_MANUAL_BUNDLE_TARGETS: ${{ matrix.manual_bundle_targets }}
          CITIZENCHAIN_UPDATER_MANIFEST_NAME: ${{ matrix.updater_manifest_name }}
          CITIZENCHAIN_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const targetSource = process.env.CITIZENCHAIN_MANUAL_BUNDLE_TARGETS;
          const bundleTargets = (targetSource || '')
            .split(',')
            .map((target) => target.trim())
            .filter(Boolean);

          if (bundleTargets.length === 0) {
            throw new Error('缺少本 matrix 的 Tauri bundle targets。');
          }

          // 候选版本已在当前 runner 工作区应用；这里只设置本 matrix 的 bundle 目标。
          const tauriPath = 'citizenchain/node/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          const version = tauri.version;
          tauri.bundle = tauri.bundle || {};
          // 中文注释：Release 生成安装包与 updater 正式文件；updater 在同一 runner 内签名。
          tauri.bundle.targets = bundleTargets;
          // 中文注释：按现有平台归档格式在后续步骤签名，禁止再交给本机下载后二次处理。
          delete tauri.bundle.createUpdaterArtifacts;
          // 中文注释：平台 Release 可以独立成功，因此每个安装包只读取自己的更新清单；
          // 不能再用一个根 version 同时描述版本可能不同的四个目标。
          tauri.plugins = tauri.plugins || {};
          tauri.plugins.updater = tauri.plugins.updater || {};
          tauri.plugins.updater.endpoints = [
            `https://github.com/ChineseFederation/GMB/releases/download/${process.env.GMB_VERSION_TAG}/${process.env.CITIZENCHAIN_UPDATER_MANIFEST_NAME}`,
          ];
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          console.log(`桌面端版本(源码): ${version}`);
          console.log(`Tauri bundle targets: ${bundleTargets.join(',')}`);
          NODE

      - name: 安装 macOS 构建依赖
        if: matrix.platform == 'macos'
        run: brew install protobuf llvm

      - name: 配置 macOS LLVM 环境变量
        if: matrix.platform == 'macos'
        run: |
          echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: 配置 macOS 应用签名
        if: matrix.platform == 'macos'
        run: |
          # 中文注释：现有节点软件只要求完整可验证的 Apple Silicon 应用签名；正式 updater
          # 签名由本 workflow 的独立 Tauri 私钥完成。显式使用 Tauri 官方 ad-hoc 身份，避免 bundler 自动
          # 生成只有资源封套声明、却缺少 CodeResources 的残缺签名。
          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.cache_key }}
          workspaces: citizenchain -> target

      - name: 同步并锁定节点候选版本
        run: node release-tool/.github/scripts/citizenchain/release-node-macos.mjs node-version lock "$GMB_SOFTWARE_VERSION"

      - name: 安装前端依赖并构建
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 准备空创世状态资源目录
        shell: bash
        run: |
          # 中文注释：安装包只携带节点软件；首次启动按冻结 chainspec 本地初始化并联网同步。
          rm -rf citizenchain/node/resources/genesis-state

      - name: Tauri 打包正式软件
        working-directory: citizenchain/node
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --ci -- --locked

      # Tauri 的 DMG bundler 会在生成 DMG 后清理 bundle/macos 中间 App。必须从最终 DMG
      # 重新挂载并提取真实 App，再校验签名和生成 updater 候选；继续读取已清理目录会把
      # 已成功的 macOS 构建误判成失败。
      - name: 从最终 DMG 提取并验证 macOS App
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg_file="$(find citizenchain/target/release/bundle/dmg -name '*.dmg' | head -1)"
          if [ -z "$dmg_file" ]; then
            echo "::error::未找到 macOS dmg 安装包。"
            exit 1
          fi
          mount_dir="$(mktemp -d)"
          extracted_dir="citizenchain-macos-app"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_file" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          app_bundle="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' | head -1)"
          if [ -z "$app_bundle" ]; then
            echo "::error::最终 DMG 中没有 macOS App bundle。"
            exit 1
          fi
          rm -rf "$extracted_dir"
          mkdir -p "$extracted_dir"
          ditto "$app_bundle" "$extracted_dir/$(basename "$app_bundle")"
          app_bundle="$extracted_dir/$(basename "$app_bundle")"
          codesign --verify --deep --strict "$app_bundle"
          entitlements="$(codesign -d --entitlements :- "$app_bundle" 2>/dev/null)"
          for entitlement in \
            com.apple.security.device.camera \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory; do
            # plutil 的 key path 以点号分层，签名 entitlement 的点号必须转义。
            entitlement_key_path="${entitlement//./\\.}"
            if [ "$(printf '%s' "$entitlements" | plutil -extract "$entitlement_key_path" raw -)" != "true" ]; then
              echo "::error::macOS App 缺少 $entitlement。"
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' \
            "$app_bundle/Contents/Info.plist" >/dev/null

      - name: 整理 macOS 产物
        if: matrix.platform == 'macos'
        shell: bash
        env:
          INSTALLER_NAME: ${{ matrix.installer_name }}
          UPDATER_ASSET_NAME: ${{ matrix.updater_asset_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_PASS }}
        run: |
          set -euo pipefail
          mkdir -p citizenchain-release
          versioned_installer="${INSTALLER_NAME%.dmg}-v${GMB_SOFTWARE_VERSION}.dmg"
          versioned_updater="${UPDATER_ASSET_NAME%.app.tar.gz}-v${GMB_SOFTWARE_VERSION}.app.tar.gz"

          dmg_file="$(find citizenchain/target/release/bundle/dmg -name '*.dmg' | head -1)"
          if [ -z "$dmg_file" ]; then
            echo "::error::未找到 macOS dmg 安装包。"
            exit 1
          fi
          cp "$dmg_file" "citizenchain-release/${versioned_installer}"

          app_bundle="$(find citizenchain-macos-app -maxdepth 1 -type d -name '*.app' | head -1)"
          if [ -z "$app_bundle" ]; then
            echo "::error::Release 缺少从最终 DMG 验证并提取的 macOS App bundle。"
            exit 1
          fi
          # 中文注释：保持 Tauri updater 要求的 .app 根目录归档格式，并在同一 runner 内签名。
          COPYFILE_DISABLE=1 tar \
            -C "$(dirname "$app_bundle")" \
            -czf "citizenchain-release/${versioned_updater}" \
            "$(basename "$app_bundle")"
          (cd citizenchain/node && node frontend/node_modules/@tauri-apps/cli/tauri.js signer sign "$GITHUB_WORKSPACE/citizenchain-release/${versioned_updater}")
          signature="$(tr -d '\r\n' < "citizenchain-release/${versioned_updater}.sig")"
          test -n "$signature"
          node - "$versioned_updater" "$signature" <<'NODE'
          const fs = require('node:fs');
          const [asset, signature] = process.argv.slice(2);
          fs.writeFileSync('citizenchain-release/citizenchain-node-latest-macos-arm64.json', `${JSON.stringify({
            version: process.env.GMB_SOFTWARE_VERSION,
            notes: `CitizenChain macOS v${process.env.GMB_SOFTWARE_VERSION}。`,
            pub_date: new Date().toISOString(),
            platforms: { 'darwin-aarch64': {
              signature,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GMB_VERSION_TAG}/${asset}`,
            } },
          }, null, 2)}\n`);
          NODE

          ls -lh citizenchain-release

      - name: 签署节点平台正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenchain-release/*

      - name: 固化 macOS 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find citizenchain-release -type f | wc -l | tr -d ' ')" = 4
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizenchain/release-node-macos.mjs github-release \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民链 · Release · macOS' \
            --notes "公民链 macOS 正式版 v${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets citizenchain-release/*

  # ── .github/workflows/citizenchain/release-node-windows.yml ──
  citizenchain_release_node_windows__changes:
    env:
      GMB_NODE_PLATFORM: windows
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/release-node-windows.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 锁定公民链节点构建范围
    runs-on: ubuntu-24.04
    outputs:
      citizenchain: ${{ steps.scope.outputs.citizenchain }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_matrix: ${{ steps.scope.outputs.desktop_matrix }}
    steps:
      - name: 拉取完整变更历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          fetch-depth: 0

      # 中文注释：统一入口必须与产品分组真源同步；源码固定在成功 CI，前置版本
      # 验证只读取本次 workflow 的隔离工具，禁止再次执行旧 CI 中的版本算法。
      - name: 拉取前置 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenchain/release-node-windows.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 验证公民链 Windows Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/citizenchain/release-node-windows.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenchain-node-windows-v --product-id citizenchain-node
          --target windows --workflow citizenchain/ci-node-windows.yml

      # 桌面端与两款移动产品共用 shared/branding/logo.png 唯一母版。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并启用节点全量构建
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/release-node-windows.mjs dependencies check --scope citizenchain-node
          echo "citizenchain=true" >> "$GITHUB_OUTPUT"
          echo "desktop=true" >> "$GITHUB_OUTPUT"
          test "$GMB_NODE_PLATFORM" = windows
          echo 'desktop_matrix=[{"platform":"windows","name":"Windows","os":"windows-2025","artifact":"公民链Windows","installer_name":"citizenchain-node-windows-x86_64.exe","manual_bundle_targets":"nsis","updater_manifest_name":"citizenchain-node-latest-windows-x86_64.json","expected_runner_arch":"X64","cache_key":"citizenchain-windows"}]' >> "$GITHUB_OUTPUT"

  citizenchain_release_node_windows__build_desktop:
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    name: 打包公民链桌面端 (${{ matrix.name }})
    needs: [validate_dispatch, citizenchain_release_node_windows__changes]
    # 中文注释：CI 来源已由 CitizenConsole 锁定；Release 只构建本平台正式候选。
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/release-node-windows.yml' && needs.validate_dispatch.result == 'success' && (needs.citizenchain_release_node_windows__changes.outputs.desktop == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.citizenchain_release_node_windows__changes.outputs.desktop_matrix) }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenchain/release-node-windows.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 校验代码来源并应用节点候选版本
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/release-node-windows.mjs dependencies check --scope citizenchain-node
          node release-tool/.github/scripts/citizenchain/release-node-windows.mjs node-version apply "$GMB_SOFTWARE_VERSION"

      - name: 校验 runner 架构
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]; then
            echo "::error::runner 架构不符合 ${EXPECTED_RUNNER_ARCH}: 当前为 ${RUNNER_ARCH}"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: 安装 Node.js
        # 固定使用 Node.js 25.2.1,与项目 package.json engines 统一 Node.js 工具链一致。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 同步桌面端版本
        shell: bash
        env:
          CITIZENCHAIN_CI_BUNDLE_TARGETS: ${{ matrix.ci_bundle_targets }}
          CITIZENCHAIN_MANUAL_BUNDLE_TARGETS: ${{ matrix.manual_bundle_targets }}
          CITIZENCHAIN_UPDATER_MANIFEST_NAME: ${{ matrix.updater_manifest_name }}
          CITIZENCHAIN_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const targetSource = process.env.CITIZENCHAIN_MANUAL_BUNDLE_TARGETS;
          const bundleTargets = (targetSource || '')
            .split(',')
            .map((target) => target.trim())
            .filter(Boolean);

          if (bundleTargets.length === 0) {
            throw new Error('缺少本 matrix 的 Tauri bundle targets。');
          }

          // 候选版本已在当前 runner 工作区应用；这里只设置本 matrix 的 bundle 目标。
          const tauriPath = 'citizenchain/node/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          const version = tauri.version;
          tauri.bundle = tauri.bundle || {};
          // 中文注释：Release 生成安装包与 updater 正式文件；updater 在同一 runner 内签名。
          tauri.bundle.targets = bundleTargets;
          // 中文注释：按现有 Windows NSIS 文件格式在后续步骤签名并生成清单。
          delete tauri.bundle.createUpdaterArtifacts;
          // 中文注释：平台 Release 可以独立成功，因此每个安装包只读取自己的更新清单；
          // 不能再用一个根 version 同时描述版本可能不同的四个目标。
          tauri.plugins = tauri.plugins || {};
          tauri.plugins.updater = tauri.plugins.updater || {};
          tauri.plugins.updater.endpoints = [
            `https://github.com/ChineseFederation/GMB/releases/download/${process.env.GMB_VERSION_TAG}/${process.env.CITIZENCHAIN_UPDATER_MANIFEST_NAME}`,
          ];
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          console.log(`桌面端版本(源码): ${version}`);
          console.log(`Tauri bundle targets: ${bundleTargets.join(',')}`);
          NODE

      - name: 安装 Windows 构建依赖
        if: matrix.platform == 'windows'
        run: |
          choco install protoc -y
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> "$env:GITHUB_ENV"

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.cache_key }}
          workspaces: citizenchain -> target

      - name: 同步并锁定节点候选版本
        # Windows 默认 shell 是 PowerShell；统一版本脚本使用 POSIX 环境变量语法，必须固定 Bash。
        shell: bash
        run: node release-tool/.github/scripts/citizenchain/release-node-windows.mjs node-version lock "$GMB_SOFTWARE_VERSION"

      - name: 安装前端依赖并构建
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 准备空创世状态资源目录
        shell: bash
        run: |
          # 中文注释：安装包只携带节点软件；首次启动按冻结 chainspec 本地初始化并联网同步。
          rm -rf citizenchain/node/resources/genesis-state

      - name: Tauri 打包正式软件
        working-directory: citizenchain/node
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --ci -- --locked

      - name: 整理 Windows 产物
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installerName = "${{ matrix.installer_name }}"
          $versionedName = $installerName -replace '\.exe$', "-v$env:GMB_SOFTWARE_VERSION.exe"
          New-Item -ItemType Directory -Force citizenchain-release | Out-Null

          $exe = Get-ChildItem -Path "citizenchain/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error "未找到 Windows exe 安装包。"
            exit 1
          }

          Copy-Item $exe.FullName (Join-Path "citizenchain-release" $versionedName)
          # 中文注释：NSIS exe 同时作为 Windows updater 正式文件；后续步骤在同一 runner 内签名。
          Get-ChildItem citizenchain-release | Format-Table Name, Length

      - name: 签名 Windows updater 并生成正式清单
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_PASS }}
        run: |
          set -euo pipefail
          updater="$(find citizenchain-release -maxdepth 1 -type f -name '*.exe' -print)"
          test "$(printf '%s\n' "$updater" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          (cd citizenchain/node && node frontend/node_modules/@tauri-apps/cli/tauri.js signer sign "$GITHUB_WORKSPACE/$updater")
          signature="$(tr -d '\r\n' < "${updater}.sig")"
          test -n "$signature"
          node - "$(basename "$updater")" "$signature" <<'NODE'
          const fs = require('node:fs');
          const [asset, signature] = process.argv.slice(2);
          fs.writeFileSync('citizenchain-release/citizenchain-node-latest-windows-x86_64.json', `${JSON.stringify({
            version: process.env.GMB_SOFTWARE_VERSION,
            notes: `CitizenChain Windows v${process.env.GMB_SOFTWARE_VERSION}。`,
            pub_date: new Date().toISOString(),
            platforms: { 'windows-x86_64': {
              signature,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GMB_VERSION_TAG}/${asset}`,
            } },
          }, null, 2)}\n`);
          NODE

      - name: 签署节点平台正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenchain-release/*

      - name: 固化 Windows 正式 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find citizenchain-release -type f | wc -l | tr -d ' ')" = 3
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizenchain/release-node-windows.mjs github-release \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民链 · Release · Windows' \
            --notes "公民链 Windows 正式版 v${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets citizenchain-release/*

  # ── .github/workflows/citizenchain/release-runtime-wasm.yml ──
  citizenchain_release_runtime_wasm__build_wasm:
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/release-runtime-wasm.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 编译 WASM
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenchain/release-runtime-wasm.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 验证公民协议 Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/citizenchain/release-runtime-wasm.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenchain-runtime-wasm-v --product-id citizenchain-runtime
          --target wasm --workflow citizenchain/ci-runtime-wasm.yml --spec-version "$GMB_SPEC_VERSION"

      - name: 校验代码来源并应用 Runtime 候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/release-runtime-wasm.mjs dependencies check --scope citizenchain-runtime
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          runtime_path = Path("citizenchain/runtime/src/lib.rs")
          test_path = Path("citizenchain/runtime/src/tests/cases.rs")
          runtime_text = runtime_path.read_text(encoding="utf-8")
          test_text = test_path.read_text(encoding="utf-8")
          runtime_pattern = re.compile(r"(?m)^(\s*spec_version:\s*)(\d+)(\s*,\s*)$")
          test_pattern = re.compile(r"assert_eq!\(VERSION\.spec_version,\s*(\d+)\);")
          runtime_matches = list(runtime_pattern.finditer(runtime_text))
          test_matches = list(test_pattern.finditer(test_text))
          if len(runtime_matches) != 1 or len(test_matches) != 1:
              raise SystemExit("Runtime spec_version 真源或测试断言不唯一")
          source_version = int(runtime_matches[0].group(2))
          test_version = int(test_matches[0].group(1))
          if source_version != test_version:
              raise SystemExit("Runtime 源码与测试断言的 spec_version 不一致")
          target_text = os.environ["GMB_SPEC_VERSION"]
          chain_text = os.environ["GMB_CHAIN_SPEC_VERSION"]
          genesis_hash = os.environ["GMB_CHAIN_GENESIS_HASH"]
          finalized_head = os.environ["GMB_CHAIN_FINALIZED_HEAD"]
          if not re.fullmatch(r"(?:0|[1-9]\d*)", target_text) or int(target_text) > 2**32 - 1:
              raise SystemExit("Runtime 候选 spec_version 输入无效")
          if not re.fullmatch(r"(?:0|[1-9]\d*)", chain_text) or int(chain_text) >= 2**32 - 1:
              raise SystemExit("finalized 链 spec_version 输入无效")
          if not re.fullmatch(r"0x[0-9a-f]{64}", genesis_hash):
              raise SystemExit("正式链 genesis hash 输入无效")
          if not re.fullmatch(r"0x[0-9a-f]{64}", finalized_head):
              raise SystemExit("正式链 finalized block hash 输入无效")
          target_version = int(target_text)
          chain_version = int(chain_text)
          if target_version != chain_version + 1:
              raise SystemExit("Runtime Release 版本必须严格等于 finalized 链 spec_version + 1")
          if source_version not in (chain_version, target_version):
              raise SystemExit("Runtime Release 源码与 finalized 链版本差值不是 0 或 1")
          if source_version != target_version:
              runtime_match = runtime_matches[0]
              test_match = test_matches[0]
              runtime_text = runtime_text[:runtime_match.start(2)] + target_text + runtime_text[runtime_match.end(2):]
              test_text = test_text[:test_match.start(1)] + target_text + test_text[test_match.end(1):]
              test_path.write_text(test_text, encoding="utf-8")
              runtime_path.write_text(runtime_text, encoding="utf-8")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a", encoding="utf-8") as out:
              out.write("## CitizenChain WASM 构建来源\n\n")
              out.write("- 构建用途：正式 Release\n")
              out.write(f"- finalized 链 spec_version：`{chain_version}`\n")
              out.write(f"- finalized block hash：`{finalized_head}`\n")
              out.write(f"- genesis hash：`{genesis_hash}`\n")
              out.write(f"- 源码 spec_version：`{source_version}`\n")
              out.write(f"- 构建 spec_version：`{target_version}`\n")
              out.write(f"- 源码提交：`{os.environ['GMB_SOURCE_SHA']}`\n")
              out.write("- 候选版本只存在于本次 runner，不提交或推送源码\n")
          PY

      - name: 安装 Rust 工具链
        # 1.97.1 在上游是可移动分支；固定当前生成提交，action 内仍硬编码 toolchain=1.97.1。
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: wasm32v1-none
          components: rust-src, clippy

      - name: 安装 Node.js
        # NodeGuard 行为探针编译完整 Node/Tauri 宿主；固定 Node.js 25.2.1 并复用锁文件缓存，
        # 保证编译期读取的 frontendDist 来自真实前端构建，而不是占位目录或本机残留。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 安装系统依赖
        # NodeGuard 行为探针会编译完整 node/Tauri 宿主；依赖必须与 Linux 节点 CI 对齐，
        # 否则 glib-sys 等桌面依赖会在探针真正执行前因缺少 pkg-config 元数据失败。
        run: node .github/scripts/citizenchain/release-runtime-wasm.mjs linux-deps

      - name: 校验锁文件并记录构建环境
        working-directory: citizenchain
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          def command_output(*command: str) -> str:
              return subprocess.check_output(
                  command,
                  text=True,
                  stderr=subprocess.STDOUT,
              ).strip()

          lock_data = Path("Cargo.lock").read_bytes()
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## CitizenChain WASM 固定构建环境\n\n")
              out.write("- runner label：`ubuntu-24.04`\n")
              out.write(f"- runner OS / arch：`{os.environ['RUNNER_OS']} / {os.environ['RUNNER_ARCH']}`\n")
              out.write(f"- runner image OS：`{os.environ.get('ImageOS', 'unknown')}`\n")
              out.write(f"- runner image version：`{os.environ.get('ImageVersion', 'unknown')}`\n")
              out.write(
                  "- checkout action："
                  "`fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09` (`v5.1.0`)\n"
              )
              out.write(
                  "- rust-toolchain action："
                  "`46511b1c83438f0dd37c02d843619ece5a4abb5b` (`1.97.1`)\n"
              )
              out.write(f"- Cargo.lock SHA-256：`{hashlib.sha256(lock_data).hexdigest()}`\n")
              for label, command in (
                  ("rustc", ("rustc", "--version", "--verbose")),
                  ("cargo", ("cargo", "--version", "--verbose")),
                  ("protoc", ("protoc", "--version")),
                  ("clang", ("clang", "--version")),
              ):
                  out.write(f"\n### {label}\n\n```\n{command_output(*command)}\n```\n")
          PY

      - name: 删除全部旧编译产物
        working-directory: citizenchain
        run: |
          rm -rf target
          echo "已删除全部 target 目录，从零开始编译"

      - name: 校验正式 WASM 构建特性
        working-directory: citizenchain
        run: |
          if cargo tree --locked -p citizenchain -e features --no-default-features --features std \
            | grep -F 'citizenchain feature "runtime-benchmarks"'; then
            echo "正式 WASM 依赖图禁止启用 runtime-benchmarks" >&2
            exit 1
          fi

      - name: 执行 Runtime Clippy
        working-directory: citizenchain
        # 不设 WASM_BUILD_FROM_SOURCE/WASM_FILE：build.rs 走 else 分支不编 wasm，clippy 为纯 lint 快闸。
        # scope 与「编译 WASM」同 feature 配置（-p citizenchain --features std），仅覆盖 runtime 装配 crate。
        run: cargo clippy --locked -p citizenchain --no-default-features --features std -- -D warnings

      - name: 编译 WASM
        working-directory: citizenchain
        env:
          WASM_BUILD_FROM_SOURCE: "1"
          # build.rs 只对正式候选 WASM 启用 feature 构建闸，不影响权重 benchmark runtime。
          CITIZENCHAIN_PRODUCTION_WASM_BUILD: "1"
        run: cargo build --locked --release -p citizenchain --no-default-features --features std

      - name: 校验 WASM 产物并记录摘要
        working-directory: citizenchain
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          output_dir = Path("target/release/wbuild/citizenchain")
          filenames = (
              "citizenchain.wasm",
              "citizenchain.compact.wasm",
              "citizenchain.compact.compressed.wasm",
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          rows = []
          for filename in filenames:
              path = output_dir / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"WASM 产物不存在或为空：{path}")
              data = path.read_bytes()
              digest = hashlib.blake2b(data, digest_size=32).hexdigest()
              rows.append((filename, len(data), digest))

          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## CitizenChain WASM 产物\n\n")
              out.write("| 文件 | 字节数 | Blake2-256 |\n")
              out.write("| --- | ---: | --- |\n")
              for filename, size, digest in rows:
                  out.write(f"| `{filename}` | {size} | `0x{digest}` |\n")
          PY

      # tauri::generate_context! 在 node 测试编译期读取 frontendDist；必须使用锁文件构建
      # 真实前端产物，不能提交 dist 或创建空占位文件绕过 Tauri 校验。
      - name: 构建公民链节点前端
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 校验候选 WASM 安全行为
        working-directory: citizenchain
        env:
          # 对上一步刚生成、随后将上传的同一份压缩 WASM 执行 NodeGuard 行为探针。
          WASM_FILE: ${{ github.workspace }}/citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.compressed.wasm
        run: |
          cargo test --locked -p node \
            current_wasm_passes_candidate_runtime_policy_behavior_probes -- --nocapture

      - name: 签署正式 WASM 构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            citizenchain/target/release/wbuild/citizenchain/citizenchain.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.compressed.wasm

      # 中文注释：GitHub runner 在同一受审工作流内直接固化正式 Release；公民控制台不再
      # 下载 Actions 候选、不再本地签名或二次发布。草稿只作为资产上传的原子事务边界。
      - name: 固化公民协议正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/citizenchain/target/release/wbuild/citizenchain"
          notes_file="$RUNNER_TEMP/citizenchain-runtime-release-notes.md"
          {
            echo '公民协议正式 Release，可直接用于链上 Runtime 升级。'
            echo
            echo "- spec_version：\`${GMB_SPEC_VERSION}\`"
            echo "- 源码提交：\`${GMB_SOURCE_SHA}\`"
            echo "- Release workflow run：\`${GITHUB_RUN_ID}\`"
            echo
            echo '| 产物 | SHA-256 |'
            echo '| --- | --- |'
            for filename in citizenchain.wasm citizenchain.compact.wasm citizenchain.compact.compressed.wasm; do
              digest="$(sha256sum "$release_dir/$filename" | awk '{print $1}')"
              echo "| \`$filename\` | \`$digest\` |"
            done
          } >"$notes_file"
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizenchain/release-runtime-wasm.mjs github-release \
            --tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA" \
            --title '公民协议 · Release · WASM' --notes-file "$notes_file" --latest false \
            --assets "$release_dir/citizenchain.wasm" \
            "$release_dir/citizenchain.compact.wasm" \
            "$release_dir/citizenchain.compact.compressed.wasm"

  # ── .github/workflows/citizenserve/ci-cloudflare.yml ──
  citizenserve_ci_cloudflare__check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenserve/ci-cloudflare.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 后端代码、D1 与 Cloudflare 资源检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenserve/ci-cloudflare.mjs dependencies check --scope citizenserve

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenserve/package-lock.json

      - name: 安装后端锁定依赖
        working-directory: citizenserve
        run: npm ci

      - name: 执行依赖安全审计
        run: node .github/scripts/citizenserve/ci-cloudflare.mjs dependencies audit --scope citizenserve

      - name: 校验 Worker 绑定类型未过期
        working-directory: citizenserve
        run: npm run types:check

      - name: 检查 TypeScript
        working-directory: citizenserve
        run: npm run typecheck

      - name: 运行后端测试
        working-directory: citizenserve
        run: npm test

      # CI 必须从空白 D1 验证唯一 schema；运行器临时目录可避免复用开发机或前一次任务的数据。
      - name: 在全新本地 D1 执行唯一 schema
        working-directory: citizenserve
        run: |
          npm exec -- wrangler d1 execute DB --local \
            --persist-to "$RUNNER_TEMP/citizenserve-cloudflare-d1" \
            --file schema/citizenserve.sql
          # 当前没有真实结构变化，因此目录不存在；将来只在实际 migration 已受审时按顺序应用。
          if [ -d migrations ]; then
            npm exec -- wrangler d1 migrations apply DB --local \
              --persist-to "$RUNNER_TEMP/citizenserve-cloudflare-d1"
          fi

      # 中文注释：dry-run 会解析并校验 Worker、D1、R2、KV、Queue、Durable Objects、Cron、
      # Route 和 bindings，但只把无 Secret bundle 写入 runner 临时目录，不调用部署 API。
      - name: 校验 Cloudflare 资源配置并生成无 Secret 候选
        working-directory: citizenserve
        run: npm exec -- wrangler deploy --dry-run --outdir "$RUNNER_TEMP/citizenserve-cloudflare-bundle"

      # 中文注释：CI 与 Release 动作脚本彼此独立，但执行同一确定性候选契约；
      # 测试保证同一提交、版本、payload 与锁定工具得到相同 manifest 和文件哈希。
      - name: 生成并复核不可变后端候选
        run: >-
          node .github/scripts/citizenserve/ci-cloudflare.mjs action
          --project citizenserve
          --bundle "$RUNNER_TEMP/citizenserve-cloudflare-bundle/index.js"
          --output "$RUNNER_TEMP/citizenserve-cloudflare-candidate"
          --git-sha "$GMB_SOURCE_SHA"
          --archive "$RUNNER_TEMP/citizenserve-cloudflare-release.tgz"

      - name: 上传后端候选
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CitizenServe-Cloudflare-CI
          path: |
            ${{ runner.temp }}/citizenserve-cloudflare-candidate
            ${{ runner.temp }}/citizenserve-cloudflare-release.tgz
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # CI/Release 候选都使用 GitHub OIDC 建立仓库、workflow、提交和产物摘要的签名来源；
      # 不引入长期 CI 私钥，也不接触 Cloudflare 生产部署凭据。
      - name: 签署后端候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/citizenserve-cloudflare-release.tgz

  # ── .github/workflows/citizenserve/release-cloudflare.yml ──
  citizenserve_release_cloudflare__check:
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenserve/release-cloudflare.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 后端代码、D1 与 Cloudflare 资源检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenserve/release-cloudflare.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 验证公民服务端 Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/citizenserve/release-cloudflare.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenserve-cloudflare-v --product-id citizenserve
          --target cloudflare --workflow citizenserve/ci-cloudflare.yml

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenserve/release-cloudflare.mjs dependencies check --scope citizenserve
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.GMB_SOFTWARE_VERSION;
          if (!/^\d+\.\d{1,2}\.\d{1,2}$/.test(version)) throw new Error('后端候选版本输入无效');
          for (const path of ['citizenserve/package.json', 'citizenserve/package-lock.json']) {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            value.version = version;
            if (path.endsWith('package-lock.json')) {
              if (!value.packages?.['']) throw new Error('后端 package-lock 缺少根 package');
              value.packages[''].version = version;
            }
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          }
          NODE

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenserve/package-lock.json

      - name: 安装后端锁定依赖
        working-directory: citizenserve
        run: npm ci

      - name: 执行依赖安全审计
        run: node .github/scripts/citizenserve/release-cloudflare.mjs dependencies audit --scope citizenserve

      - name: 校验 Worker 绑定类型未过期
        working-directory: citizenserve
        run: npm run types:check

      - name: 检查 TypeScript
        working-directory: citizenserve
        run: npm run typecheck

      - name: 运行后端测试
        working-directory: citizenserve
        run: npm test

      # CI 必须从空白 D1 验证唯一 schema；运行器临时目录可避免复用开发机或前一次任务的数据。
      - name: 在全新本地 D1 执行唯一 schema
        working-directory: citizenserve
        run: |
          npm exec -- wrangler d1 execute DB --local \
            --persist-to "$RUNNER_TEMP/citizenserve-cloudflare-d1" \
            --file schema/citizenserve.sql
          # 当前没有真实结构变化，因此目录不存在；将来只在实际 migration 已受审时按顺序应用。
          if [ -d migrations ]; then
            npm exec -- wrangler d1 migrations apply DB --local \
              --persist-to "$RUNNER_TEMP/citizenserve-cloudflare-d1"
          fi

      # 中文注释：dry-run 会解析并校验 Worker、D1、R2、KV、Queue、Durable Objects、Cron、
      # Route 和 bindings，但只把无 Secret bundle 写入 runner 临时目录，不调用部署 API。
      - name: 校验 Cloudflare 资源配置并生成无 Secret 候选
        working-directory: citizenserve
        run: npm exec -- wrangler deploy --dry-run --outdir "$RUNNER_TEMP/citizenserve-cloudflare-bundle"

      # 中文注释：Release 独立重建并复核 CI 的确定性候选契约；manifest 不写生成时间，
      # 同一提交、版本、payload 与锁定工具重复构建必须得到相同文件哈希。
      - name: 生成并复核不可变后端候选
        run: >-
          node .github/scripts/citizenserve/release-cloudflare.mjs action
          --project citizenserve
          --bundle "$RUNNER_TEMP/citizenserve-cloudflare-bundle/index.js"
          --output "$RUNNER_TEMP/citizenserve-cloudflare-candidate"
          --git-sha "$GMB_SOURCE_SHA"
          --archive "$RUNNER_TEMP/citizenserve-cloudflare-release.tgz"

      # GitHub OIDC 建立仓库、workflow、提交和正式归档摘要的签名来源；不读取 Cloudflare
      # 生产部署凭据，Release 与后续生产部署仍是两条独立流程。
      - name: 签署后端正式构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/citizenserve-cloudflare-release.tgz

      # 中文注释：GitHub runner 只固化已验证归档；公民控制台不再下载 Actions 候选、
      # 本机复核后二次创建 Release。草稿只作为三项正式资产上传的原子事务边界，
      # Cloudflare 生产发布仍由控制台的独立“发布”动作负责。
      - name: 固化公民服务端正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_dir="$RUNNER_TEMP/citizenserve-cloudflare-candidate"
          archive="$RUNNER_TEMP/citizenserve-cloudflare-release.tgz"
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizenserve/release-cloudflare.mjs github-release \
            --tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA" \
            --title '公民服务端 · Release · Cloudflare' \
            --notes "CitizenServe Cloudflare 后端 ${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets "$archive" "$candidate_dir/release-manifest.json" "$candidate_dir/SHA256SUMS"

  # ── .github/workflows/citizenwallet/ci-android.yml ──
  citizenwallet_ci_android__build_apk:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenwallet/ci-android.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 构建 公民钱包.apk
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 全产品 Logo 只允许由 shared/branding/logo.png 唯一母版生成。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenwallet/ci-android.mjs dependencies check --scope citizenwallet

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".github/dependencies.json").read_text(encoding="utf-8"))["toolchains"]["flutter"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      # flutter-action 只安装 Flutter，不保证 apksigner 位于 PATH。钱包 CI 与公民 CI
      # 使用同一种临时证书签名口径，必须显式配置 Android SDK，避免签名步骤以 127 失败。
      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装 Android SDK Platform 与 Build Tools 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # 索引同步的唯一实现在 citizenwallet/scripts/sync-pallet-registry.sh。
      # 此前 CI 与 citizenwallet-run.sh 各持一份、且覆盖范围不同（CI 只同步 3 个 pallet，
      # 本地同步 20 个），加 iOS job 会变成三份，故收敛到脚本，三处共用同一个全集。
      - name: 同步 runtime pallet/call 索引
        run: ./citizenwallet/scripts/sync-pallet-registry.sh

      - name: 安装依赖
        working-directory: citizenwallet
        run: flutter pub get --enforce-lockfile

      # 公民与公民钱包共用同一扫码设备适配器，两条移动端流水线都必须验证它。
      - name: 检查 Flutter 共享扫码适配器
        working-directory: shared/scanner-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 原生签名库(schnorrkel)从源码重建，不信任入库的 .so。
      # 四端统一口径：产物一律由 CI 从源码构建——入库二进制与源码脱节时不会有任何报错，
      # 只会在装机后签名失败，那时已经晚了。公民端一直如此，本端此前是唯一例外。
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android

      - name: 安装固定依赖审计器
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: 执行依赖安全审计
        run: node .github/scripts/citizenwallet/ci-android.mjs dependencies audit --scope citizenwallet

      - name: 编译原生签名库 (Android ARM64)
        working-directory: citizenwallet
        run: ./scripts/build-signer-native.sh android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "citizenwallet-rust-android"
          workspaces: citizenwallet/rust -> target

      - name: 分析代码
        working-directory: citizenwallet
        run: flutter analyze --no-fatal-infos

      # flutter test 在 runner 宿主上跑，Dart FFI 要 dlopen 宿主平台动态库；
      # 上面编译的是 Android ARM 产物，宿主库必须单独编一次，否则金标签名测试全数失败。
      - name: 编译原生签名库（宿主，flutter test 用）
        working-directory: citizenwallet
        run: ./scripts/build-signer-native.sh host

      - name: 运行测试
        working-directory: citizenwallet
        run: flutter test

      # CI 使用当次临时证书完成非生产签名，正式 APP_KEY 不进入 GitHub；构建类型仍是
      # 与正式版完全一致的 Release，不生成 Debug/Profile 或第二版本。
      - name: 构建 Android Release（CI）
        working-directory: citizenwallet
        run: flutter build apk --release --target-platform android-arm64

      - name: 核验 APK 内钱包原生库
        working-directory: citizenwallet
        run: ./scripts/build-signer-native.sh verify-android-package build/app/outputs/flutter-apk/app-release.apk

      - name: 使用当次 CI 证书签名并核验 APK
        run: |
          set -euo pipefail
          GMB_CI_STORE_PASSWORD="$(openssl rand -hex 32)"
          GMB_CI_KEY_PASSWORD="$GMB_CI_STORE_PASSWORD"
          GMB_CI_APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          export GMB_CI_STORE_PASSWORD GMB_CI_KEY_PASSWORD
          test -x "$GMB_CI_APKSIGNER"
          trap 'rm -f "$RUNNER_TEMP/citizenwallet-ci.p12"' EXIT
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/citizenwallet-ci.p12" \
            -storepass:env GMB_CI_STORE_PASSWORD -keypass:env GMB_CI_KEY_PASSWORD -alias ci \
            -keyalg RSA -keysize 4096 -validity 2 \
            -dname 'CN=CitizenWallet CI,O=GMB,C=US'
          "$GMB_CI_APKSIGNER" sign --ks "$RUNNER_TEMP/citizenwallet-ci.p12" \
            --ks-type PKCS12 --ks-key-alias ci \
            --ks-pass env:GMB_CI_STORE_PASSWORD --key-pass env:GMB_CI_KEY_PASSWORD \
            --out citizenwallet/build/app/outputs/flutter-apk/公民钱包-CI.apk \
            citizenwallet/build/app/outputs/flutter-apk/app-release.apk
          "$GMB_CI_APKSIGNER" verify --verbose --print-certs citizenwallet/build/app/outputs/flutter-apk/公民钱包-CI.apk
          unset GMB_CI_STORE_PASSWORD GMB_CI_KEY_PASSWORD

      - name: 上传签名后的公民钱包 CI APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 公民钱包-CI.apk
          path: citizenwallet/build/app/outputs/flutter-apk/公民钱包-CI.apk
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: 签署公民钱包 CI APK 构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenwallet/build/app/outputs/flutter-apk/公民钱包-CI.apk

  # ── .github/workflows/citizenwallet/ci-ios.yml ──
  citizenwallet_ci_ios__check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenwallet/ci-ios.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 校验 CitizenWallet iOS 源码
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 全产品 Logo 只允许由 shared/branding/logo.png 唯一母版生成。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenwallet/ci-ios.mjs dependencies check --scope citizenwallet

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".github/dependencies.json").read_text(encoding="utf-8"))["toolchains"]["flutter"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      # 索引同步的唯一实现在 citizenwallet/scripts/sync-pallet-registry.sh。
      # 此前 CI 与 citizenwallet-run.sh 各持一份、且覆盖范围不同（CI 只同步 3 个 pallet，
      # 本地同步 20 个），加 iOS job 会变成三份，故收敛到脚本，三处共用同一个全集。
      - name: 同步 runtime pallet/call 索引
        run: ./citizenwallet/scripts/sync-pallet-registry.sh

      - name: 安装依赖
        working-directory: citizenwallet
        run: flutter pub get --enforce-lockfile

      # 公民与公民钱包共用同一扫码设备适配器，两条移动端流水线都必须验证它。
      - name: 检查 Flutter 共享扫码适配器
        working-directory: shared/scanner-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: 安装固定依赖审计器
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: 执行依赖安全审计
        run: node .github/scripts/citizenwallet/ci-ios.mjs dependencies audit --scope citizenwallet

      - name: 分析代码
        working-directory: citizenwallet
        run: flutter analyze --no-fatal-infos

      # flutter test 在 runner 宿主上跑，Dart FFI 要 dlopen 宿主平台动态库；
      # 上面编译的是 Android ARM 产物，宿主库必须单独编一次，否则金标签名测试全数失败。
      - name: 编译原生签名库（宿主，flutter test 用）
        working-directory: citizenwallet
        run: ./scripts/build-signer-native.sh host

      - name: 运行测试
        working-directory: citizenwallet
        run: flutter test

  citizenwallet_ci_ios__ios:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenwallet/ci-ios.yml' && needs.validate_dispatch.result == 'success' }}
    needs: [validate_dispatch, citizenwallet_ci_ios__check]
    name: 构建 公民钱包 iOS CI
    runs-on: macos-15
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenwallet/ci-ios.mjs dependencies check --scope citizenwallet

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-apple-ios

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".github/dependencies.json").read_text(encoding="utf-8"))["toolchains"]["flutter"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      # 与 build-apk 调同一个脚本：冷钱包离线签名，索引与链端脱节没有任何编译期信号。
      - name: 同步 runtime pallet/call 索引
        run: ./citizenwallet/scripts/sync-pallet-registry.sh

      # ↓↓ 以下三步顺序是硬约束，颠倒会崩在很难读的 CocoaPods 报错里 ↓↓
      # 1) flutter pub get 生成 ios/Flutter/Generated.xcconfig —— Podfile 必须读它定位 FLUTTER_ROOT
      # 2) build-signer-native.sh ios 产出 libcitizenwallet_signer.a
      #    —— citizenwallet_signer.podspec 依赖它，冷端只有 4 个导出符号，
      #    正是 release 的 -dead_strip 最容易整组剔干净的规模
      # 3) flutter build ios 内部自带 pod install（且自带正确的 LANG；手动跑才需要
      #    LANG=en_US.UTF-8，否则 CocoaPods 编码崩溃）
      - name: 安装依赖
        working-directory: citizenwallet
        run: flutter pub get --enforce-lockfile

      - name: 编译原生签名库 (iOS arm64)
        working-directory: citizenwallet
        run: ./scripts/build-signer-native.sh ios

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "citizenwallet-rust-ios"
          workspaces: citizenwallet/rust -> target

      - name: 构建 iOS Release 候选
        working-directory: citizenwallet
        run: flutter build ios --release --no-codesign

      - name: 核验 iOS Runner 架构与钱包原生符号
        working-directory: citizenwallet
        run: ./scripts/build-signer-native.sh verify-ios-package build/ios/iphoneos/Runner.app

      - name: 使用 ad-hoc CI 身份签名并核验 iOS 产物
        run: |
          codesign --force --deep --sign - citizenwallet/build/ios/iphoneos/Runner.app
          codesign --verify --deep --strict citizenwallet/build/ios/iphoneos/Runner.app

      - name: 整理 iOS 候选
        run: |
          set -euo pipefail
          mkdir -p citizenwallet/build/release-candidate/ios
          asset='公民钱包-iOS-CI.app.zip'
          ditto -c -k --keepParent citizenwallet/build/ios/iphoneos/Runner.app \
            "citizenwallet/build/release-candidate/ios/${asset}"

      - name: 上传 iOS 候选
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 公民钱包-iOS-CI
          path: citizenwallet/build/release-candidate/ios/*.app.zip
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: 签署 iOS 候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenwallet/build/release-candidate/ios/*.app.zip

  # ── .github/workflows/citizenwallet/release-android.yml ──
  citizenwallet_release_android__build_apk:
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenwallet/release-android.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 签名并固化公民钱包 Android Release
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenwallet/release-android.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 验证公民钱包 Android Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/citizenwallet/release-android.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenwallet-android-v --product-id citizenwallet
          --target android --workflow citizenwallet/ci-android.yml

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenwallet/release-android.mjs dependencies check --scope citizenwallet
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version, build = os.environ["GMB_SOFTWARE_VERSION"], os.environ["GITHUB_RUN_NUMBER"]
          if not re.fullmatch(r"\d+\.\d{1,2}\.\d{1,2}", version) or not re.fullmatch(r"[1-9]\d*", build):
              raise SystemExit("CitizenWallet 候选版本输入无效")
          path = Path("citizenwallet/pubspec.yaml")
          text, count = re.subn(r"(?m)^version:\s*\d+\.\d+\.\d+\+\d+\s*$", f"version: {version}+{build}", path.read_text(), count=1)
          if count != 1: raise SystemExit("CitizenWallet pubspec 版本真源无效")
          path.write_text(text)
          PY

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".github/dependencies.json").read_text(encoding="utf-8"))["toolchains"]["flutter"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装 Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装 Android SDK 签名工具
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "cmdline-tools;latest"

      # 索引同步的唯一实现在 citizenwallet/scripts/sync-pallet-registry.sh。
      # 此前 CI 与 citizenwallet-run.sh 各持一份、且覆盖范围不同（CI 只同步 3 个 pallet，
      # 本地同步 20 个），加 iOS job 会变成三份，故收敛到脚本，三处共用同一个全集。
      - name: 同步 runtime pallet/call 索引
        run: ./citizenwallet/scripts/sync-pallet-registry.sh

      - name: 安装依赖
        working-directory: citizenwallet
        run: flutter pub get --enforce-lockfile

      # 原生签名库(schnorrkel)从源码重建，不信任入库的 .so。
      # 四端统一口径：产物一律由 CI 从源码构建——入库二进制与源码脱节时不会有任何报错，
      # 只会在装机后签名失败，那时已经晚了。公民端一直如此，本端此前是唯一例外。
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android

      - name: 安装固定依赖审计器
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: 执行依赖安全审计
        run: node .github/scripts/citizenwallet/release-android.mjs dependencies audit --scope citizenwallet

      - name: 编译原生签名库 (Android ARM64)
        working-directory: citizenwallet
        run: ./scripts/build-signer-native.sh android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "citizenwallet-rust-android"
          workspaces: citizenwallet/rust -> target

      - name: 构建 Android Release 正式包
        working-directory: citizenwallet
        run: |
          flutter build apk --release --target-platform android-arm64
          flutter build appbundle --release --target-platform android-arm64

      - name: 核验 APK 与 AAB 内钱包原生库
        working-directory: citizenwallet
        run: |
          ./scripts/build-signer-native.sh verify-android-package build/app/outputs/flutter-apk/app-release.apk
          ./scripts/build-signer-native.sh verify-android-package build/app/outputs/bundle/release/app-release.aab

      - name: 使用 APP_KEY 签名并回读验证正式包
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/citizenwallet-android-signing"
          publish="citizenwallet/build/release"
          rm -rf "$work" "$publish"
          mkdir -p "$work" "$publish"
          trap 'rm -rf "$work"' EXIT
          python3 - "$work" <<'PY'
          import base64, os, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          fields = {}
          for raw in os.environ.get("APP_KEY", "").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              name, sep, value = line.partition("=")
              if not sep or name.strip() in fields or not value.strip():
                  raise SystemExit("APP_KEY 行格式无效")
              fields[name.strip()] = value.strip()
          if set(fields) - {"keystore", "password", "alias", "keyPassword"}:
              raise SystemExit("APP_KEY 包含未登记字段")
          alias = fields.get("alias", "upload")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,128}", alias):
              raise SystemExit("APP_KEY alias 无效")
          try:
              key = base64.b64decode(fields["keystore"], validate=True)
              password = fields["password"]
          except (KeyError, ValueError) as exc:
              raise SystemExit("APP_KEY 缺少有效签名材料") from exc
          if not 1024 <= len(key) <= 32 * 1024 * 1024:
              raise SystemExit("APP_KEY keystore 大小无效")
          (root / "release.keystore").write_bytes(key)
          (root / "password").write_text(password)
          (root / "key-password").write_text(fields.get("keyPassword", password))
          (root / "alias").write_text(alias)
          PY
          GMB_ANDROID_STORE_PASSWORD="$(cat "$work/password")"
          GMB_ANDROID_KEY_PASSWORD="$(cat "$work/key-password")"
          export GMB_ANDROID_STORE_PASSWORD GMB_ANDROID_KEY_PASSWORD
          alias="$(cat "$work/alias")"
          apksigner="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          test -x "$apksigner"
          "$apksigner" sign --ks "$work/release.keystore" \
            --ks-pass env:GMB_ANDROID_STORE_PASSWORD --key-pass env:GMB_ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false \
            --ks-key-alias "$alias" --out "$publish/citizenwallet.apk" \
            citizenwallet/build/app/outputs/flutter-apk/app-release.apk
          cp citizenwallet/build/app/outputs/bundle/release/app-release.aab "$publish/citizenwallet.aab"
          jarsigner -keystore "$work/release.keystore" \
            -storepass:env GMB_ANDROID_STORE_PASSWORD -keypass:env GMB_ANDROID_KEY_PASSWORD \
            "$publish/citizenwallet.aab" "$alias"
          "$apksigner" verify --verbose --print-certs "$publish/citizenwallet.apk" \
            | tee "$work/apk-verification.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$work/apk-verification.txt"
          # Android 上传证书按平台规范可以自签名；只验证包完整性，再从三处回读同一证书。
          jarsigner -verify "$publish/citizenwallet.aab"
          apk_certificate_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$work/apk-verification.txt")"
          key_certificate_sha256="$(keytool -exportcert -alias "$alias" \
            -keystore "$work/release.keystore" -storepass:env GMB_ANDROID_STORE_PASSWORD -rfc \
            | openssl x509 -outform DER | sha256sum | awk '{print $1}')"
          aab_certificate_sha256="$(keytool -printcert -jarfile "$publish/citizenwallet.aab" -rfc \
            | openssl x509 -outform DER | sha256sum | awk '{print $1}')"
          [[ "$apk_certificate_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$apk_certificate_sha256" = "$key_certificate_sha256"
          test "$apk_certificate_sha256" = "$aab_certificate_sha256"
          test "$(apkanalyzer manifest application-id "$publish/citizenwallet.apk")" = com.crcfrcn.citizenwallet
          test "$(apkanalyzer manifest version-code "$publish/citizenwallet.apk")" = "$GITHUB_RUN_NUMBER"

      - name: 生成并核验 Android 正式清单
        run: |
          set -euo pipefail
          node <<'NODE'
            const { createHash } = require("node:crypto");
            const fs = require("node:fs");
            const root = "citizenwallet/build/release";
            const digest = (name) => createHash("sha256").update(fs.readFileSync(`${root}/${name}`)).digest("hex");
            fs.writeFileSync(`${root}/citizenwallet-release-android.json`, `${JSON.stringify({
              product_id: "citizenwallet", version: process.env.GMB_SOFTWARE_VERSION,
              github_run_number: Number(process.env.GITHUB_RUN_NUMBER), head_sha: process.env.GMB_SOURCE_SHA,
              bundle_id: "ios.citizenwallet", package_name: "com.crcfrcn.citizenwallet",
              assets: [
                { platform: "android", asset_name: "citizenwallet.apk", asset_sha256: digest("citizenwallet.apk") },
                { platform: "android", asset_name: "citizenwallet.aab", asset_sha256: digest("citizenwallet.aab") },
              ],
            }, null, 2)}\n`);
          NODE
          test "$(find citizenwallet/build/release -type f | wc -l | tr -d ' ')" = 3

      - name: 签署 Android 正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenwallet/build/release/*

      - name: 固化 Android 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizenwallet/release-android.mjs github-release \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民钱包 · Release · Android' \
            --notes "公民钱包 Android 正式版 v${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets citizenwallet/build/release/*

  # ── .github/workflows/citizenwallet/release-ios.yml ──
  citizenwallet_release_ios__ios:
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenwallet/release-ios.yml' && needs.validate_dispatch.result == 'success' }}
