name: GMB · 全仓统一
run-name: ${{ github.event_name == 'push' && 'GMB · 全仓统一' || inputs.run_title }}

# 中文注释：GitHub 只注册 workflows 顶层文件。本文件是唯一注册入口；分组目录下的
# 22 份文件继续作为可审查的产品流水线真源，不移动、不复制成额外顶层文件。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pipeline:
        description: 分组流水线文件路径
        required: true
        type: string
      run_title:
        description: 公民控制台展示标题
        required: true
        type: string
      source_sha:
        description: 成功 CI 准确提交（仅 Release）
        required: false
        type: string
      ci_run_id:
        description: 对应成功 CI run id（仅 Release）
        required: false
        type: string
      version_tag:
        description: 正式版本 Tag（仅 Release）
        required: false
        type: string
      software_version:
        description: 候选软件版本
        required: false
        type: string
      spec_version:
        description: Runtime spec_version
        required: false
        type: string
      chain_spec_version:
        description: 当前链上 spec_version
        required: false
        type: string
      genesis_hash:
        description: 当前链 genesis hash
        required: false
        type: string
      finalized_head:
        description: 当前链 finalized head
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # 中文注释：每条逻辑流水线独立串行；仓库门禁仍可取消自己的旧运行，不互相取消产品。
  group: ${{ github.event_name == 'push' && 'gmb-repository' || inputs.pipeline }}
  cancel-in-progress: ${{ github.event_name == 'push' || inputs.pipeline == 'repository' }}

env:
  CI: true
  WRANGLER_SEND_METRICS: false
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # CI 始终使用 workflow_dispatch 创建时由 GitHub 锁定的 main 提交；只有 Release
  # 使用对应成功 CI 的 source_sha。禁止控制台给 CI 注入预读或历史提交。
  GMB_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && contains(inputs.pipeline, '/release-') && inputs.source_sha || github.sha }}
  GMB_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GMB_VERSION_TAG: ${{ inputs.version_tag }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}
  GMB_SPEC_VERSION: ${{ inputs.spec_version }}
  GMB_CHAIN_SPEC_VERSION: ${{ inputs.chain_spec_version }}
  GMB_CHAIN_GENESIS_HASH: ${{ inputs.genesis_hash }}
  GMB_CHAIN_FINALIZED_HEAD: ${{ inputs.finalized_head }}

jobs:
  validate_dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: 校验统一入口路由身份
        env:
          PIPELINE: ${{ inputs.pipeline }}
          RUN_TITLE: ${{ inputs.run_title }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOFTWARE_VERSION: ${{ inputs.software_version }}
        run: |
          node <<'NODE'
          const routes = new Map([
            ['repository', 'GMB · 全仓统一'],
            ['.github/workflows/citizenapp/ci-ios.yml', '公民 · CI · iOS'],
            ['.github/workflows/citizenapp/ci-android.yml', '公民 · CI · Android'],
            ['.github/workflows/citizenapp/release-ios.yml', '公民 · Release · iOS'],
            ['.github/workflows/citizenapp/release-android.yml', '公民 · Release · Android'],
            ['.github/workflows/citizenwallet/ci-ios.yml', '公民钱包 · CI · iOS'],
            ['.github/workflows/citizenwallet/ci-android.yml', '公民钱包 · CI · Android'],
            ['.github/workflows/citizenwallet/release-ios.yml', '公民钱包 · Release · iOS'],
            ['.github/workflows/citizenwallet/release-android.yml', '公民钱包 · Release · Android'],
            ['.github/workflows/citizenserve/ci-cloudflare.yml', '公民服务端 · CI · Cloudflare'],
            ['.github/workflows/citizenserve/release-cloudflare.yml', '公民服务端 · Release · Cloudflare'],
            ['.github/workflows/citizenweb/ci-web.yml', '公民网 · CI · Web'],
            ['.github/workflows/citizenweb/release-web.yml', '公民网 · Release · Web'],
            ['.github/workflows/citizenchain/ci-runtime-wasm.yml', '公民协议 · CI · WASM'],
            ['.github/workflows/citizenchain/release-runtime-wasm.yml', '公民协议 · Release · WASM'],
            ['.github/workflows/citizenchain/ci-node-linux-arm.yaml', '公民链 · CI · LinuxARM'],
            ['.github/workflows/citizenchain/ci-node-linux-amd.yml', '公民链 · CI · LinuxAMD'],
            ['.github/workflows/citizenchain/ci-node-macos.yml', '公民链 · CI · macOS'],
            ['.github/workflows/citizenchain/ci-node-windows.yml', '公民链 · CI · Windows'],
            ['.github/workflows/citizenchain/release-node-linux-arm.yml', '公民链 · Release · LinuxARM'],
            ['.github/workflows/citizenchain/release-node-linux-amd.yml', '公民链 · Release · LinuxAMD'],
            ['.github/workflows/citizenchain/release-node-macos.yml', '公民链 · Release · macOS'],
            ['.github/workflows/citizenchain/release-node-windows.yml', '公民链 · Release · Windows'],
          ]);
          if (routes.get(process.env.PIPELINE) !== process.env.RUN_TITLE) {
            throw new Error(`未登记或标题不匹配的分组流水线：${process.env.PIPELINE}`);
          }
          const isCI = /\/ci-[^/]+\.ya?ml$/.test(process.env.PIPELINE);
          const isRelease = /\/release-[^/]+\.ya?ml$/.test(process.env.PIPELINE);
          if (isCI && process.env.SOURCE_SHA !== '') {
            throw new Error('CI 禁止接收 source_sha；源码必须使用任务创建时的 github.sha');
          }
          if (isCI && process.env.SOFTWARE_VERSION !== '') {
            throw new Error('CI 禁止接收 software_version；正式版本只属于 Release');
          }
          if (isRelease && !/^[0-9a-f]{40}$/.test(process.env.SOURCE_SHA)) {
            throw new Error('Release 必须指定成功 CI 的准确 source_sha');
          }
          NODE

  retain-current-run:
    permissions:
      actions: write
      contents: read
    if: ${{ github.event_name == 'push' || inputs.pipeline == 'repository' }}
    name: 只保留当前门禁记录
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 删除当前门禁之前的全部运行记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository='${{ github.repository }}'
          current='${{ github.run_id }}'
          workflow_id="$(gh api "repos/${repository}/actions/runs/${current}" --jq '.workflow_id')"
          while IFS= read -r previous; do
            [[ -n "$previous" && "$previous" != "$current" ]] || continue
            gh api --method DELETE "repos/${repository}/actions/runs/${previous}"
            echo "已删除上一条门禁记录：${previous}"
          done < <(gh api --paginate "repos/${repository}/actions/workflows/${workflow_id}/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id < ${current} and .display_title == \"GMB · 全仓统一\") | .id")

  dependency-contracts:
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' || inputs.pipeline == 'repository' }}
    name: 全仓依赖契约与供应链完整性
    needs: retain-current-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 校验代码来源
        run: test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"

      # 中文注释：这里只做全仓确定性契约检查；依赖升级必须产生明确 manifest/lockfile diff，
      # 禁止在 push 门禁或产品 CI/Release 中自动选择新的上游版本。
      - name: 检查全仓依赖契约
        run: node .github/scripts/gmb-repository/ci-repository.mjs dependencies check --scope repository

  cross-platform-contracts:
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' || inputs.pipeline == 'repository' }}
    name: 全仓跨端契约一致
    needs: retain-current-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 校验代码来源
        run: test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"

      - name: 校验金标向量跨端一致
        run: node .github/scripts/gmb-repository/ci-repository.mjs golden-vectors

      - name: 校验 pallet 注册表与链上一致
        run: node .github/scripts/gmb-repository/ci-repository.mjs pallet-registry

      - name: 校验全仓统一数据字典
        run: |
          node --test .github/scripts/gmb-repository/ci-repository.test.mjs
          node .github/scripts/gmb-repository/ci-repository.mjs data-dictionary

  repository-guardrails:
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' || inputs.pipeline == 'repository' }}
    name: 文档、残留与统一仓库规则
    needs: retain-current-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 拉取完整变更历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          fetch-depth: 0

      - name: 校验代码来源
        run: test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"

      - name: 检查公开仓库残留、命名与安全边界
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BASE_SHA" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            base_ref="$PUSH_BASE_SHA"
          else
            base_ref="${GMB_SOURCE_SHA}^"
          fi
          BASE_REF="$base_ref" node .github/scripts/gmb-repository/ci-repository.mjs guardrails
          node .github/scripts/gmb-repository/ci-repository.mjs data-dictionary --base-ref "$base_ref"

  shared-contracts:
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' || inputs.pipeline == 'repository' }}
    name: 统一签名、账户密码学与 QR 协议
    needs: retain-current-run
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 校验代码来源
        run: test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          components: rustfmt, clippy

      - name: 缓存共享 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: gmb-repository-shared-rust
          workspaces: . -> target

      # 根 workspace 只包含 shared/qr-protocol、shared/citizen-signer 和
      # shared/account-crypto；产品 workspace 不在本仓库级门禁中重复执行。
      - name: 检查共享 Rust 格式
        run: cargo fmt --all -- --check

      - name: 执行共享 Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 运行共享 Rust 测试
        run: cargo test --workspace --all-targets --locked

      - name: 清理本次 Rust 增量缓存
        if: ${{ success() }}
        run: find target -type d -name incremental -prune -exec rm -rf {} +

  # ── .github/workflows/citizenapp/ci-android.yml ──
  # ── 代码检查 ──
  citizenapp_ci_android__check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenapp/ci-android.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: Flutter 代码检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 全产品 Logo 只允许由 shared/branding/logo.png 唯一母版生成。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenapp/ci-android.mjs dependencies check --scope citizenapp

      - name: 校验 chainspec.json 冻结
        run: |
          bash citizenapp/scripts/check-chainspec-frozen.sh

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".github/dependencies.json").read_text(encoding="utf-8"))["toolchains"]["flutter"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装依赖
        working-directory: citizenapp
        run: flutter pub get --enforce-lockfile

      # 扫码设备层由 CitizenApp / CitizenWallet 共同消费；包本身不解析业务码型。
      - name: 检查 Flutter 共享扫码适配器
        working-directory: shared/scanner-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 本机与 CI 共用唯一入口：锁定 Flutter → 构建并验收宿主 libsmoldot
      # 全部 FFI 符号 → analyze → 顺序执行 Flutter 测试。
      - name: 分析并运行完整测试
        working-directory: citizenapp
        run: ./scripts/citizenapp-test.sh

  # ── Android APK 打包 ──
  citizenapp_ci_android__android:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenapp/ci-android.yml' && needs.validate_dispatch.result == 'success' }}
    name: 打包公民.apk
    runs-on: ubuntu-24.04
    needs: [validate_dispatch, citizenapp_ci_android__check]
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          submodules: recursive

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenapp/ci-android.mjs dependencies check --scope citizenapp

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".github/dependencies.json").read_text(encoding="utf-8"))["toolchains"]["flutter"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装 Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装 Android SDK Platform 与 Build Tools 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # chainspec.json 是从 plain SSOT + 创世状态包派生的 stateRootHash 轻形态。
      # runtime 升级走链上 system.setCode，不要重新 build-spec。
      # 可执行冻结契约由 citizenapp/scripts/check-chainspec-frozen.sh 负责。
      - name: 再次校验 chainspec.json 冻结
        run: |
          bash citizenapp/scripts/check-chainspec-frozen.sh

      # 产品 APK 只允许 arm64-v8a；禁止 CI 恢复 32 位原生库或产品包。
      - name: 编译 smoldot native library (Android ARM64)
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "citizenapp-rust-android"
          workspaces: citizenapp/smoldot/ffi -> target

      - name: 安装 Flutter 依赖
        working-directory: citizenapp
        run: flutter pub get --enforce-lockfile

      - name: 修复 isar_flutter_libs compileSdk
        run: |
          ISAR_GRADLE=$(find "$HOME/.pub-cache" -path "*/isar_flutter_libs*/android/build.gradle" | head -1)
          if [ -n "$ISAR_GRADLE" ]; then
            sed -i 's/compileSdkVersion 30/compileSdkVersion 36/' "$ISAR_GRADLE"
            echo "已将 isar_flutter_libs compileSdkVersion 30 → 36"
          fi

      # 普通 CI 与正式 Release 使用同一种 Release 产品构建。CI 生成当次临时证书完成
      # 非生产签名，任务结束即销毁；正式 APP_KEY 始终不进入 GitHub。
      - name: 打包 Android Release（CI）
        working-directory: citizenapp
        run: flutter build apk --release --target-platform android-arm64

      - name: 核验 APK 内 smoldot 原生库
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh verify-android-package build/app/outputs/flutter-apk/app-release.apk

      - name: 核验 Android CI 候选中英文系统弹窗应用名
        working-directory: citizenapp
        run: bash scripts/citizenapp-run.sh verify-android-localization build/app/outputs/flutter-apk/app-release.apk

      - name: 使用当次 CI 证书签名并核验 APK
        run: |
          set -euo pipefail
          GMB_CI_STORE_PASSWORD="$(openssl rand -hex 32)"
          GMB_CI_KEY_PASSWORD="$GMB_CI_STORE_PASSWORD"
          GMB_CI_APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          export GMB_CI_STORE_PASSWORD GMB_CI_KEY_PASSWORD
          test -x "$GMB_CI_APKSIGNER"
          trap 'rm -f "$RUNNER_TEMP/citizenapp-ci.p12"' EXIT
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/citizenapp-ci.p12" \
            -storepass:env GMB_CI_STORE_PASSWORD -keypass:env GMB_CI_KEY_PASSWORD -alias ci \
            -keyalg RSA -keysize 4096 -validity 2 \
            -dname 'CN=CitizenApp CI,O=GMB,C=US'
          "$GMB_CI_APKSIGNER" sign --ks "$RUNNER_TEMP/citizenapp-ci.p12" \
            --ks-type PKCS12 --ks-key-alias ci \
            --ks-pass env:GMB_CI_STORE_PASSWORD --key-pass env:GMB_CI_KEY_PASSWORD \
            --out citizenapp/build/app/outputs/flutter-apk/公民-CI.apk \
            citizenapp/build/app/outputs/flutter-apk/app-release.apk
          "$GMB_CI_APKSIGNER" verify --verbose --print-certs citizenapp/build/app/outputs/flutter-apk/公民-CI.apk
          unset GMB_CI_STORE_PASSWORD GMB_CI_KEY_PASSWORD

      - name: 上传签名后的公民 CI APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 公民-CI.apk
          path: citizenapp/build/app/outputs/flutter-apk/公民-CI.apk
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: 签署公民 CI APK 构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenapp/build/app/outputs/flutter-apk/公民-CI.apk

  # 中文注释：Android 与 iOS 各自维护独立版本线；本端成功不会等待或推进 iOS。

  # ── .github/workflows/citizenapp/ci-ios.yml ──
  # ── 代码检查 ──
  citizenapp_ci_ios__check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenapp/ci-ios.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: Flutter 代码检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 全产品 Logo 只允许由 shared/branding/logo.png 唯一母版生成。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenapp/ci-ios.mjs dependencies check --scope citizenapp

      - name: 校验 chainspec.json 冻结
        run: |
          bash citizenapp/scripts/check-chainspec-frozen.sh

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

