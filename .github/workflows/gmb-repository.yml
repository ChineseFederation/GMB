          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.cache_key }}
          workspaces: citizenchain -> target

      - name: 安装前端依赖并构建
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 准备空创世状态资源目录
        shell: bash
        run: |
          # 中文注释：安装包只携带节点软件；首次启动按冻结 chainspec 本地初始化并联网同步。
          rm -rf citizenchain/node/resources/genesis-state

      - name: Tauri 打包（不接触 updater 私钥）
        working-directory: citizenchain/node
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --ci -- --locked

      # Tauri 的 DMG bundler 会在生成 DMG 后清理 bundle/macos 中间 App。必须从最终 DMG
      # 重新挂载并提取真实 App，再校验签名和生成 updater 候选；继续读取已清理目录会把
      # 已成功的 macOS 构建误判成失败。
      - name: 从最终 DMG 提取并验证 macOS App
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg_file="$(find citizenchain/target/release/bundle/dmg -name '*.dmg' | head -1)"
          if [ -z "$dmg_file" ]; then
            echo "::error::未找到 macOS dmg 安装包。"
            exit 1
          fi
          mount_dir="$(mktemp -d)"
          extracted_dir="citizenchain-macos-app"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_file" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          app_bundle="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' | head -1)"
          if [ -z "$app_bundle" ]; then
            echo "::error::最终 DMG 中没有 macOS App bundle。"
            exit 1
          fi
          rm -rf "$extracted_dir"
          mkdir -p "$extracted_dir"
          ditto "$app_bundle" "$extracted_dir/$(basename "$app_bundle")"
          app_bundle="$extracted_dir/$(basename "$app_bundle")"
          codesign --verify --deep --strict "$app_bundle"
          entitlements="$(codesign -d --entitlements :- "$app_bundle" 2>/dev/null)"
          for entitlement in \
            com.apple.security.device.camera \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory; do
            # plutil 的 key path 以点号分层，签名 entitlement 的点号必须转义。
            entitlement_key_path="${entitlement//./\\.}"
            if [ "$(printf '%s' "$entitlements" | plutil -extract "$entitlement_key_path" raw -)" != "true" ]; then
              echo "::error::macOS App 缺少 $entitlement。"
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' \
            "$app_bundle/Contents/Info.plist" >/dev/null

      - name: 整理 macOS 产物
        if: matrix.platform == 'macos'
        shell: bash
        env:
          INSTALLER_NAME: ${{ matrix.installer_name }}
          UPDATER_ASSET_NAME: ${{ matrix.updater_asset_name }}
        run: |
          set -euo pipefail
          mkdir -p citizenchain-release

          dmg_file="$(find citizenchain/target/release/bundle/dmg -name '*.dmg' | head -1)"
          if [ -z "$dmg_file" ]; then
            echo "::error::未找到 macOS dmg 安装包。"
            exit 1
          fi
          cp "$dmg_file" "citizenchain-release/${INSTALLER_NAME}"


          ls -lh citizenchain-release

      - name: 上传桌面端产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: citizenchain-release/*
          retention-days: 30
          overwrite: true

      - name: 签署节点平台候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenchain-release/*

  # ── .github/workflows/citizenchain/ci-node-windows.yml ──
  citizenchain_ci_node_windows__changes:
    env:
      GMB_NODE_PLATFORM: windows
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/ci-node-windows.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 锁定公民链节点构建范围
    runs-on: ubuntu-24.04
    outputs:
      citizenchain: ${{ steps.scope.outputs.citizenchain }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_matrix: ${{ steps.scope.outputs.desktop_matrix }}
    steps:
      - name: 拉取完整变更历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          fetch-depth: 0

      # 桌面端与两款移动产品共用 shared/branding/logo.png 唯一母版。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并启用节点全量构建
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/ci-node-windows.mjs dependencies check --scope citizenchain-node
          echo "citizenchain=true" >> "$GITHUB_OUTPUT"
          echo "desktop=true" >> "$GITHUB_OUTPUT"
          test "$GMB_NODE_PLATFORM" = windows
          echo 'desktop_matrix=[{"platform":"windows","name":"Windows","os":"windows-2025","artifact":"公民链Windows","installer_name":"citizenchain-node-windows-x86_64.exe","ci_bundle_targets":"nsis","updater_manifest_name":"citizenchain-node-latest-windows-x86_64.json","expected_runner_arch":"X64","cache_key":"citizenchain-windows"}]' >> "$GITHUB_OUTPUT"

  citizenchain_ci_node_windows__verify:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: 公民链全工程验证
    needs: [validate_dispatch, citizenchain_ci_node_windows__changes]
    # 中文注释：Release 的源码提交已经由 CitizenConsole 锁定为最近成功 CI 的提交；
    # Release 只重新生成正式候选并交给本机安全进程签名，禁止把整套 CI 门禁再跑一遍。
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/ci-node-windows.yml' && needs.validate_dispatch.result == 'success' && (needs.citizenchain_ci_node_windows__changes.outputs.citizenchain == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          components: rustfmt, clippy

      - name: 安装系统依赖
        # 中文注释：全工程验证运行在 Ubuntu；最终 Windows 打包仍使用独立 Windows Runner。
        run: node .github/scripts/citizenchain/ci-node-windows.mjs linux-deps

      - name: 配置 libclang 与 protoc
        run: |
          {
            echo "LLVM_CONFIG_PATH=$(command -v llvm-config)"
            echo "LIBCLANG_PATH=$(llvm-config --libdir)"
            echo "PROTOC=$(command -v protoc)"
          } >> "$GITHUB_ENV"

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: |
            shared/scanner-react/package-lock.json
            citizenchain/node/frontend/package-lock.json
            citizenchain/onchina/frontend/package-lock.json

      # React 两端的扫码设备层独立于产品工程，必须先验证唯一 jsQR + canvas 路线。
      - name: 验证仓库级 React 扫码适配器
        run: |
          npm --prefix shared/scanner-react ci
          npm --prefix shared/scanner-react run check
          npm --prefix shared/scanner-react test

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: citizenchain-workspace
          workspaces: citizenchain -> target

      - name: 校验宪法创世 SCALE 解码器
        run: python3 citizenchain/scripts/check-constitution-genesis.py --self-test

      # Tauri generate_context! 在 Rust 编译期读取 frontendDist，必须先生成真实前端产物。
      - name: 构建公民链节点前端
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 检查 Rust 格式
        working-directory: citizenchain
        run: cargo fmt --all -- --check

      - name: 执行全 Rust workspace Clippy
        working-directory: citizenchain
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 运行全 Rust workspace 测试
        working-directory: citizenchain
        run: cargo test --workspace --all-targets --locked

      - name: 构建 OnChina 前端
        run: |
          npm --prefix citizenchain/onchina/frontend ci
          npm --prefix citizenchain/onchina/frontend run build

      # 三档鉴权的前端头部组装 + 与 Rust 后端 header 名的跨端锁。
      # 复用上一步已装好的依赖,不重复 npm ci。
      - name: 测试 OnChina 前端
        run: npm --prefix citizenchain/onchina/frontend test

      - name: 清理本次 Rust 增量缓存
        if: ${{ success() }}
        run: find citizenchain/target -type d -name incremental -prune -exec rm -rf {} +

  citizenchain_ci_node_windows__build_desktop:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: 打包公民链桌面端 (${{ matrix.name }})
    needs: [validate_dispatch, citizenchain_ci_node_windows__changes, citizenchain_ci_node_windows__verify]
    # verify 在 Release 中按设计跳过；always() 只用于允许 Release 越过这个“已跳过”的
    # 依赖，不会放过 changes 失败，也不会放过 CI 模式下的 verify 失败。
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/ci-node-windows.yml' && needs.validate_dispatch.result == 'success' && (always() && needs.citizenchain_ci_node_windows__changes.result == 'success' && needs.citizenchain_ci_node_windows__changes.outputs.desktop == 'true' && needs.citizenchain_ci_node_windows__verify.result == 'success') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.citizenchain_ci_node_windows__changes.outputs.desktop_matrix) }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 校验代码来源并应用节点候选版本
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/ci-node-windows.mjs dependencies check --scope citizenchain-node

      - name: 校验 runner 架构
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]; then
            echo "::error::runner 架构不符合 ${EXPECTED_RUNNER_ARCH}: 当前为 ${RUNNER_ARCH}"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: 安装 Node.js
        # 固定使用 Node.js 25.2.1,与项目 package.json engines 统一 Node.js 工具链一致。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 同步桌面端版本
        shell: bash
        env:
          CITIZENCHAIN_CI_BUNDLE_TARGETS: ${{ matrix.ci_bundle_targets }}
          CITIZENCHAIN_MANUAL_BUNDLE_TARGETS: ${{ matrix.manual_bundle_targets }}
          CITIZENCHAIN_UPDATER_MANIFEST_NAME: ${{ matrix.updater_manifest_name }}
          CITIZENCHAIN_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const targetSource = process.env.CITIZENCHAIN_CI_BUNDLE_TARGETS;
          const bundleTargets = (targetSource || '')
            .split(',')
            .map((target) => target.trim())
            .filter(Boolean);

          if (bundleTargets.length === 0) {
            throw new Error('缺少本 matrix 的 Tauri bundle targets。');
          }

          // 候选版本已在当前 runner 工作区应用；这里只设置本 matrix 的 bundle 目标。
          const tauriPath = 'citizenchain/node/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          const version = tauri.version;
          tauri.bundle = tauri.bundle || {};
          // 中文注释：CI 只生成用户安装包；正式 updater 候选只属于独立 Release workflow。
          tauri.bundle.targets = bundleTargets;
          // 中文注释：GitHub 只构建无私钥候选产物；updater 签名统一由本机原生安全进程在 Touch ID 后完成。
          delete tauri.bundle.createUpdaterArtifacts;
          // 中文注释：CI 不创建正式版本 Tag，诊断安装包保留源码中的正式 updater 配置。
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          console.log(`桌面端版本(源码): ${version}`);
          console.log(`Tauri bundle targets: ${bundleTargets.join(',')}`);
          NODE

      - name: 安装 Windows 构建依赖
        if: matrix.platform == 'windows'
        run: |
          choco install protoc -y
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> "$env:GITHUB_ENV"

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.cache_key }}
          workspaces: citizenchain -> target

      - name: 安装前端依赖并构建
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 准备空创世状态资源目录
        shell: bash
        run: |
          # 中文注释：安装包只携带节点软件；首次启动按冻结 chainspec 本地初始化并联网同步。
          rm -rf citizenchain/node/resources/genesis-state

      - name: Tauri 打包（不接触 updater 私钥）
        working-directory: citizenchain/node
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --ci -- --locked

      # Tauri 的 DMG bundler 会在生成 DMG 后清理 bundle/macos 中间 App。必须从最终 DMG
      # 重新挂载并提取真实 App，再校验签名和生成 updater 候选；继续读取已清理目录会把
      # 已成功的 macOS 构建误判成失败。
      - name: 整理 Windows 产物
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installerName = "${{ matrix.installer_name }}"
          New-Item -ItemType Directory -Force citizenchain-release | Out-Null

          $exe = Get-ChildItem -Path "citizenchain/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error "未找到 Windows exe 安装包。"
            exit 1
          }

          Copy-Item $exe.FullName (Join-Path "citizenchain-release" $installerName)
          # 中文注释：NSIS exe 同时作为 Windows updater 候选；签名由本机原生安全进程完成。
          Get-ChildItem citizenchain-release | Format-Table Name, Length

      - name: 上传桌面端产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: citizenchain-release/*
          retention-days: 30
          overwrite: true

      - name: 签署节点平台候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenchain-release/*

  # ── .github/workflows/citizenchain/ci-runtime-wasm.yml ──
  citizenchain_ci_runtime_wasm__build_wasm:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/ci-runtime-wasm.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 编译 WASM
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 校验代码来源与 Runtime 源码版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/ci-runtime-wasm.mjs dependencies check --scope citizenchain-runtime
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          runtime_path = Path("citizenchain/runtime/src/lib.rs")
          test_path = Path("citizenchain/runtime/src/tests/cases.rs")
          runtime_text = runtime_path.read_text(encoding="utf-8")
          test_text = test_path.read_text(encoding="utf-8")
          runtime_pattern = re.compile(r"(?m)^(\s*spec_version:\s*)(\d+)(\s*,\s*)$")
          test_pattern = re.compile(r"assert_eq!\(VERSION\.spec_version,\s*(\d+)\);")
          runtime_matches = list(runtime_pattern.finditer(runtime_text))
          test_matches = list(test_pattern.finditer(test_text))
          if len(runtime_matches) != 1 or len(test_matches) != 1:
              raise SystemExit("Runtime spec_version 真源或测试断言不唯一")
          source_version = int(runtime_matches[0].group(2))
          test_version = int(test_matches[0].group(1))
          if source_version != test_version:
              raise SystemExit("Runtime 源码与测试断言的 spec_version 不一致")
          if source_version < 0 or source_version > 2**32 - 1:
              raise SystemExit("Runtime 源码 spec_version 无效")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a", encoding="utf-8") as out:
              out.write("## CitizenChain WASM 构建来源\n\n")
              out.write("- 构建用途：纯 CI 验证\n")
              out.write(f"- 源码 spec_version：`{source_version}`\n")
              out.write(f"- 源码提交：`{os.environ['GMB_SOURCE_SHA']}`\n")
              out.write("- CI 不读取正式链、不分配正式版本、不创建 Tag\n")
          PY

      - name: 安装 Rust 工具链
        # 1.97.1 在上游是可移动分支；固定当前生成提交，action 内仍硬编码 toolchain=1.97.1。
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: wasm32v1-none
          components: rust-src, clippy

      - name: 安装 Node.js
        # NodeGuard 行为探针编译完整 Node/Tauri 宿主；固定 Node.js 25.2.1 并复用锁文件缓存，
        # 保证编译期读取的 frontendDist 来自真实前端构建，而不是占位目录或本机残留。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 安装系统依赖
        # NodeGuard 行为探针会编译完整 node/Tauri 宿主；依赖必须与 Linux 节点 CI 对齐，
        # 否则 glib-sys 等桌面依赖会在探针真正执行前因缺少 pkg-config 元数据失败。
        run: node .github/scripts/citizenchain/ci-runtime-wasm.mjs linux-deps

      - name: 校验锁文件并记录构建环境
        working-directory: citizenchain
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          def command_output(*command: str) -> str:
              return subprocess.check_output(
                  command,
                  text=True,
                  stderr=subprocess.STDOUT,
              ).strip()

          lock_data = Path("Cargo.lock").read_bytes()
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## CitizenChain WASM 固定构建环境\n\n")
              out.write("- runner label：`ubuntu-24.04`\n")
              out.write(f"- runner OS / arch：`{os.environ['RUNNER_OS']} / {os.environ['RUNNER_ARCH']}`\n")
              out.write(f"- runner image OS：`{os.environ.get('ImageOS', 'unknown')}`\n")
              out.write(f"- runner image version：`{os.environ.get('ImageVersion', 'unknown')}`\n")
              out.write(
                  "- checkout action："
                  "`fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09` (`v5.1.0`)\n"
              )
              out.write(
                  "- rust-toolchain action："
                  "`46511b1c83438f0dd37c02d843619ece5a4abb5b` (`1.97.1`)\n"
              )
              out.write(f"- Cargo.lock SHA-256：`{hashlib.sha256(lock_data).hexdigest()}`\n")
              for label, command in (
                  ("rustc", ("rustc", "--version", "--verbose")),
                  ("cargo", ("cargo", "--version", "--verbose")),
                  ("protoc", ("protoc", "--version")),
                  ("clang", ("clang", "--version")),
              ):
                  out.write(f"\n### {label}\n\n```\n{command_output(*command)}\n```\n")
          PY

      - name: 删除全部旧编译产物
        working-directory: citizenchain
        run: |
          rm -rf target
          echo "已删除全部 target 目录，从零开始编译"

      - name: 校验正式 WASM 构建特性
        working-directory: citizenchain
        run: |
          if cargo tree --locked -p citizenchain -e features --no-default-features --features std \
            | grep -F 'citizenchain feature "runtime-benchmarks"'; then
            echo "正式 WASM 依赖图禁止启用 runtime-benchmarks" >&2
            exit 1
          fi

      - name: 执行 Runtime Clippy
        working-directory: citizenchain
        # 不设 WASM_BUILD_FROM_SOURCE/WASM_FILE：build.rs 走 else 分支不编 wasm，clippy 为纯 lint 快闸。
        # scope 与「编译 WASM」同 feature 配置（-p citizenchain --features std），仅覆盖 runtime 装配 crate。
        run: cargo clippy --locked -p citizenchain --no-default-features --features std -- -D warnings

      - name: 编译 WASM
        working-directory: citizenchain
        env:
          WASM_BUILD_FROM_SOURCE: "1"
          # build.rs 只对正式候选 WASM 启用 feature 构建闸，不影响权重 benchmark runtime。
          CITIZENCHAIN_PRODUCTION_WASM_BUILD: "1"
        run: cargo build --locked --release -p citizenchain --no-default-features --features std

      - name: 校验 WASM 产物并记录摘要
        working-directory: citizenchain
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          output_dir = Path("target/release/wbuild/citizenchain")
          filenames = (
              "citizenchain.wasm",
              "citizenchain.compact.wasm",
              "citizenchain.compact.compressed.wasm",
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          rows = []
          for filename in filenames:
              path = output_dir / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"WASM 产物不存在或为空：{path}")
              data = path.read_bytes()
              digest = hashlib.blake2b(data, digest_size=32).hexdigest()
              rows.append((filename, len(data), digest))

          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## CitizenChain WASM 产物\n\n")
              out.write("| 文件 | 字节数 | Blake2-256 |\n")
              out.write("| --- | ---: | --- |\n")
              for filename, size, digest in rows:
                  out.write(f"| `{filename}` | {size} | `0x{digest}` |\n")
          PY

      # tauri::generate_context! 在 node 测试编译期读取 frontendDist；必须使用锁文件构建
      # 真实前端产物，不能提交 dist 或创建空占位文件绕过 Tauri 校验。
      - name: 构建公民链节点前端
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 校验候选 WASM 安全行为
        working-directory: citizenchain
        env:
          # 对上一步刚生成、随后将上传的同一份压缩 WASM 执行 NodeGuard 行为探针。
          WASM_FILE: ${{ github.workspace }}/citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.compressed.wasm
        run: |
          cargo test --locked -p node \
            current_wasm_passes_candidate_runtime_policy_behavior_probes -- --nocapture

      # CI artifact 只用于定位源码构建问题，名称与正式 Release 资产严格隔离；开发升级入口
      # 禁止读取本 artifact，避免把未分配正式版本的验证产物提交上链。
      - name: 上传 CI 诊断 WASM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: citizenchain-wasm-ci
          path: |
            citizenchain/target/release/wbuild/citizenchain/citizenchain.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.compressed.wasm
          retention-days: 30

      - name: 签署 WASM CI 构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            citizenchain/target/release/wbuild/citizenchain/citizenchain.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.wasm
            citizenchain/target/release/wbuild/citizenchain/citizenchain.compact.compressed.wasm

  # Release 独立读取正式链、分配 spec_version、重新执行版本相关门禁并构建正式资产；
  # CI 诊断产物不进入正式 Release，也不作为链上升级来源。

  # ── .github/workflows/citizenchain/release-node-linux-amd.yml ──
  citizenchain_release_node_linux_amd__changes:
    env:
      GMB_NODE_PLATFORM: linux-amd
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/release-node-linux-amd.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 锁定公民链 LinuxAMD 构建范围
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      citizenchain: ${{ steps.scope.outputs.citizenchain }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_matrix: ${{ steps.scope.outputs.desktop_matrix }}
    steps:
      - name: 拉取完整变更历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          fetch-depth: 0

      # 中文注释：统一入口必须与产品分组真源同步；源码固定在成功 CI，前置版本
      # 验证只读取本次 workflow 的隔离工具，禁止再次执行旧 CI 中的版本算法。
      - name: 拉取前置 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenchain/release-node-linux-amd.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 验证公民链 LinuxAMD Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/citizenchain/release-node-linux-amd.mjs version-tag verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenchain-node-linux-amd-v --product-id citizenchain-node
          --target linux-amd --workflow citizenchain/ci-node-linux-amd.yml

      # 桌面端与两款移动产品共用 shared/branding/logo.png 唯一母版。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并启用节点全量构建
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/release-node-linux-amd.mjs dependencies check --scope citizenchain-node
          echo "citizenchain=true" >> "$GITHUB_OUTPUT"
          echo "desktop=true" >> "$GITHUB_OUTPUT"
          test "$GMB_NODE_PLATFORM" = linux-amd
          echo 'desktop_matrix=[{"platform":"linux-amd","name":"LinuxAMD","os":"ubuntu-24.04","artifact":"公民链AMD","installer_name":"citizenchain-node-linux-amd64.deb","manual_bundle_targets":"deb,appimage","updater_asset_name":"citizenchain-node-linux-amd64.AppImage","updater_manifest_name":"citizenchain-node-latest-linux-amd64.json","expected_runner_arch":"X64","deb_arch":"amd64","cache_key":"citizenchain-linux-amd"}]' >> "$GITHUB_OUTPUT"

  citizenchain_release_node_linux_amd__build_desktop:
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    name: 打包公民链桌面端 (${{ matrix.name }})
    needs: [validate_dispatch, citizenchain_release_node_linux_amd__changes]
    # 中文注释：CI 来源已由 CitizenConsole 锁定；Release 只构建本平台正式候选。
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/release-node-linux-amd.yml' && needs.validate_dispatch.result == 'success' && (needs.citizenchain_release_node_linux_amd__changes.outputs.desktop == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.citizenchain_release_node_linux_amd__changes.outputs.desktop_matrix) }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/citizenchain/release-node-linux-amd.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 校验代码来源并应用节点候选版本
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/release-node-linux-amd.mjs dependencies check --scope citizenchain-node
          node release-tool/.github/scripts/citizenchain/release-node-linux-amd.mjs node-version apply "$GMB_SOFTWARE_VERSION"

      - name: 校验 runner 架构
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]; then
            echo "::error::runner 架构不符合 ${EXPECTED_RUNNER_ARCH}: 当前为 ${RUNNER_ARCH}"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: 安装 Node.js
        # 固定使用 Node.js 25.2.1,与项目 package.json engines 统一 Node.js 工具链一致。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 同步桌面端版本
        shell: bash
        env:
          CITIZENCHAIN_CI_BUNDLE_TARGETS: ${{ matrix.ci_bundle_targets }}
          CITIZENCHAIN_MANUAL_BUNDLE_TARGETS: ${{ matrix.manual_bundle_targets }}
          CITIZENCHAIN_UPDATER_MANIFEST_NAME: ${{ matrix.updater_manifest_name }}
          CITIZENCHAIN_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const targetSource = process.env.CITIZENCHAIN_MANUAL_BUNDLE_TARGETS;
          const bundleTargets = (targetSource || '')
            .split(',')
            .map((target) => target.trim())
            .filter(Boolean);

          if (bundleTargets.length === 0) {
            throw new Error('缺少本 matrix 的 Tauri bundle targets。');
          }

          // 候选版本已在当前 runner 工作区应用；这里只设置本 matrix 的 bundle 目标。
          const tauriPath = 'citizenchain/node/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          const version = tauri.version;
          tauri.bundle = tauri.bundle || {};
          // 中文注释：Release 生成安装包与 updater 正式文件；正式签名在同一 runner 的后续步骤完成。
          tauri.bundle.targets = bundleTargets;
          // 中文注释：显式关闭 Tauri 自动 updater 归档；本 workflow 按现有平台文件格式签名并生成清单。
          delete tauri.bundle.createUpdaterArtifacts;
          // 中文注释：平台 Release 可以独立成功，因此每个安装包只读取自己的更新清单；
          // 不能再用一个根 version 同时描述版本可能不同的四个目标。
          tauri.plugins = tauri.plugins || {};
          tauri.plugins.updater = tauri.plugins.updater || {};
          tauri.plugins.updater.endpoints = [
            `https://github.com/ChineseFederation/GMB/releases/download/${process.env.GMB_VERSION_TAG}/${process.env.CITIZENCHAIN_UPDATER_MANIFEST_NAME}`,
          ];
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          console.log(`桌面端版本(源码): ${version}`);
          console.log(`Tauri bundle targets: ${bundleTargets.join(',')}`);
          NODE

      - name: 安装 Linux 构建依赖
        if: startsWith(matrix.platform, 'linux-')
        run: node .github/scripts/citizenchain/release-node-linux-amd.mjs linux-deps

      - name: 配置 Linux libclang 环境变量
        if: startsWith(matrix.platform, 'linux-')
        run: |
          {
            echo "LLVM_CONFIG_PATH=$(command -v llvm-config)"
            echo "LIBCLANG_PATH=$(llvm-config --libdir)"
            echo "PROTOC=$(command -v protoc)"
          } >> "$GITHUB_ENV"

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.cache_key }}
          workspaces: citizenchain -> target

      - name: 同步并锁定节点候选版本
        run: node release-tool/.github/scripts/citizenchain/release-node-linux-amd.mjs node-version lock "$GMB_SOFTWARE_VERSION"

      - name: 安装前端依赖并构建
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 准备空创世状态资源目录
        shell: bash
        run: |
          # 中文注释：安装包只携带节点软件；首次启动按冻结 chainspec 本地初始化并联网同步。
          rm -rf citizenchain/node/resources/genesis-state

      - name: Tauri 打包正式软件
        working-directory: citizenchain/node
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --ci -- --locked

      - name: 整理 Linux 产物
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        env:
          INSTALLER_NAME: ${{ matrix.installer_name }}
          UPDATER_ASSET_NAME: ${{ matrix.updater_asset_name }}
          EXPECTED_DEB_ARCH: ${{ matrix.deb_arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_PASS }}
        run: |
          set -euo pipefail
          mkdir -p citizenchain-release
          versioned_installer="${INSTALLER_NAME%.deb}-v${GMB_SOFTWARE_VERSION}.deb"
          versioned_updater="${UPDATER_ASSET_NAME%.AppImage}-v${GMB_SOFTWARE_VERSION}.AppImage"

          deb_file="$(find citizenchain/target/release/bundle/deb -name '*.deb' | head -1)"
          if [ -z "$deb_file" ]; then
            echo "::error::未找到 Linux deb 安装包。"
            exit 1
          fi
          actual_deb_arch="$(dpkg-deb -f "$deb_file" Architecture)"
          if [ "$actual_deb_arch" != "$EXPECTED_DEB_ARCH" ]; then
            echo "::error::deb 架构不符合 ${EXPECTED_DEB_ARCH}: 当前为 ${actual_deb_arch}"
            exit 1
          fi
          cp "$deb_file" "citizenchain-release/${versioned_installer}"

          appimage_file=""
          if [ -d citizenchain/target/release/bundle/appimage ]; then
            appimage_file="$(find citizenchain/target/release/bundle/appimage -name '*.AppImage' | head -1)"
          fi

          if [ -z "$appimage_file" ]; then
            echo "::error::Release 缺少 Linux updater AppImage。"
            exit 1
          fi
          cp "$appimage_file" "citizenchain-release/${versioned_updater}"
          (cd citizenchain/node && node frontend/node_modules/@tauri-apps/cli/tauri.js signer sign "$GITHUB_WORKSPACE/citizenchain-release/${versioned_updater}")
          signature="$(tr -d '\r\n' < "citizenchain-release/${versioned_updater}.sig")"
          test -n "$signature"
          node - "$versioned_updater" "$signature" <<'NODE'
          const fs = require('node:fs');
          const [asset, signature] = process.argv.slice(2);
          fs.writeFileSync('citizenchain-release/citizenchain-node-latest-linux-amd64.json', `${JSON.stringify({
            version: process.env.GMB_SOFTWARE_VERSION,
            notes: `CitizenChain LinuxAMD v${process.env.GMB_SOFTWARE_VERSION}。`,
            pub_date: new Date().toISOString(),
            platforms: { 'linux-x86_64': {
              signature,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GMB_VERSION_TAG}/${asset}`,
            } },
          }, null, 2)}\n`);
          NODE

          ls -lh citizenchain-release

      - name: 签署节点平台正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenchain-release/*

      - name: 固化 LinuxAMD 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find citizenchain-release -type f | wc -l | tr -d ' ')" = 4
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizenchain/release-node-linux-amd.mjs github-release \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民链 · Release · LinuxAMD' \
            --notes "公民链 LinuxAMD 正式版 v${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets citizenchain-release/*

