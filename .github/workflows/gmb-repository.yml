      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenapp/release-android.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 签名并固化公民 Android Release
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          submodules: recursive

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
