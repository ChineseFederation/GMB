      # 桌面端与两款移动产品共用 shared/branding/logo.png 唯一母版。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并启用节点全量构建
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/release-node-linux-arm.mjs dependencies check --scope citizenchain-node
          echo "citizenchain=true" >> "$GITHUB_OUTPUT"
          echo "desktop=true" >> "$GITHUB_OUTPUT"
          test "$GMB_NODE_PLATFORM" = linux-arm
          echo 'desktop_matrix=[{"platform":"linux-arm","name":"LinuxARM","os":"ubuntu-24.04-arm","artifact":"公民链ARM","installer_name":"citizenchain-node-linux-arm64.deb","manual_bundle_targets":"deb,appimage","updater_asset_name":"citizenchain-node-linux-arm64.AppImage","updater_manifest_name":"citizenchain-node-latest-linux-arm64.json","expected_runner_arch":"ARM64","deb_arch":"arm64","cache_key":"citizenchain-linux-arm"}]' >> "$GITHUB_OUTPUT"

  citizenchain_release_node_linux_arm__build_desktop:
