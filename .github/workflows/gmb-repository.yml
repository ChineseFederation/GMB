        run: flutter pub get --enforce-lockfile

      - name: 编译 smoldot native library (iOS arm64)
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh ios

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "citizenapp-rust-ios"
          workspaces: citizenapp/smoldot/ffi -> target

      - name: 构建 iOS Release 正式包
        working-directory: citizenapp
        run: flutter build ios --release --no-codesign

      - name: 核验 iOS Runner 架构与 smoldot 符号
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh verify-ios-package build/ios/iphoneos/Runner.app

      - name: 核验 iOS 正式包中英文系统弹窗本地化
        working-directory: citizenapp
        run: bash scripts/citizenapp-run.sh verify-ios-localization build/ios/iphoneos/Runner.app

      - name: 使用 Apple Distribution 签名并生成 IPA
        env:
          IOS_KEY: ${{ secrets.IOS_KEY }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.APP_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/citizenapp-ios-signing"
          publish="citizenapp/build/release"
          rm -rf "$work" "$publish"
          mkdir -p "$work" "$publish"
          keychain="$work/release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          python3 - "$work" <<'PY'
          import base64, os, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          fields = {}
          for raw in os.environ.get("IOS_KEY", "").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              name, sep, value = line.partition("=")
              if not sep or name.strip() in fields or not value.strip():
                  raise SystemExit("IOS_KEY 行格式无效")
              fields[name.strip()] = value.strip()
          if set(fields) != {"pkcs12", "password", "certificate_sha1"}:
              raise SystemExit("IOS_KEY 字段集合无效")
          if not re.fullmatch(r"[0-9A-F]{40}", fields["certificate_sha1"]):
              raise SystemExit("Apple Distribution 证书摘要无效")
          try:
              pkcs12 = base64.b64decode(fields["pkcs12"], validate=True)
              profile = base64.b64decode(os.environ.get("IOS_PROVISIONING_PROFILE", ""), validate=True)
          except ValueError as exc:
              raise SystemExit("Apple Distribution 或 provisioning profile Base64 无效") from exc
          if not 1024 <= len(pkcs12) <= 32 * 1024 * 1024 or not 1024 <= len(profile) <= 1024 * 1024:
              raise SystemExit("Apple Distribution 签名材料大小无效")
          (root / "distribution.p12").write_bytes(pkcs12)
          (root / "password").write_text(fields["password"])
          (root / "certificate-sha1").write_text(fields["certificate_sha1"])
          (root / "profile.mobileprovision").write_bytes(profile)
          PY
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # 中文注释：codesign 查找 identity 依赖用户钥匙串搜索列表；仅传 --keychain
          # 不能保证干净 runner 能从证书继续定位到同钥匙串中的私钥。
          security list-keychains -d user -s "$keychain"
          security import "$work/distribution.p12" -k "$keychain" -P "$(cat "$work/password")" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          certificate_sha1="$(cat "$work/certificate-sha1")"
          security find-certificate -a -Z "$keychain" | grep -F "SHA-1 hash: $certificate_sha1"
          security find-identity -v -p codesigning "$keychain" | grep -Fq "$certificate_sha1"
          # 中文注释：干净 runner 的钥匙串不保证预装描述文件 CMS 签发链；LibreSSL
          # 直接验证 CMS 密码学签名并解出载荷，再用正式证书摘要锁定唯一配对。
          /usr/bin/openssl smime -verify -inform DER -in "$work/profile.mobileprovision" \
            -noverify -out "$work/profile.plist" >/dev/null
          profile_certificate_sha1="$(
            plutil -extract DeveloperCertificates.0 raw -o - "$work/profile.plist" \
              | base64 -D | shasum -a 1 | awk '{print toupper($1)}'
          )"
          test "$profile_certificate_sha1" = "$certificate_sha1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$work/profile.plist")" = MHYMVRN6FC
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$work/profile.plist")" = MHYMVRN6FC.ios.citizenapp
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$work/profile.plist")" = false
          plutil -extract Entitlements xml1 -o "$work/entitlements.plist" "$work/profile.plist"
          app="citizenapp/build/ios/iphoneos/Runner.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = ios.citizenapp
          cp "$work/profile.mobileprovision" "$app/embedded.mobileprovision"
          find "$app" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' item; do
            codesign --force --sign "$certificate_sha1" --keychain "$keychain" --timestamp=none "$item"
          done
          find "$app" -type d \( -name '*.framework' -o -name '*.appex' \) -print0 \
            | while IFS= read -r -d '' item; do
                codesign --force --sign "$certificate_sha1" --keychain "$keychain" --timestamp=none "$item"
              done
          codesign --force --sign "$certificate_sha1" --keychain "$keychain" --timestamp=none \
            --generate-entitlement-der --entitlements "$work/entitlements.plist" "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2> "$work/codesign.txt"
          grep -F 'TeamIdentifier=MHYMVRN6FC' "$work/codesign.txt"
          mkdir -p "$work/package/Payload"
          cp -R "$app" "$work/package/Payload/Runner.app"
          (cd "$work/package" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/$publish/citizenapp.ipa")
          unzip -Z1 "$publish/citizenapp.ipa" | grep -Fx 'Payload/Runner.app/Info.plist'

      - name: 生成并核验 iOS 正式清单
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const root = 'citizenapp/build/release';
          const digest = createHash('sha256').update(fs.readFileSync(`${root}/citizenapp.ipa`)).digest('hex');
          fs.writeFileSync(`${root}/citizenapp-release-ios.json`, `${JSON.stringify({
            product_id: 'citizenapp', version: process.env.GMB_SOFTWARE_VERSION,
            github_run_number: Number(process.env.GITHUB_RUN_NUMBER), head_sha: process.env.GMB_SOURCE_SHA,
            bundle_id: 'ios.citizenapp', package_name: 'com.crcfrcn.citizenapp',
            assets: [{ platform: 'ios', asset_name: 'citizenapp.ipa', asset_sha256: digest }],
          }, null, 2)}\n`);
          NODE
          test "$(find citizenapp/build/release -type f | wc -l | tr -d ' ')" = 2

      - name: 签署 iOS 正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenapp/build/release/*

      - name: 固化 iOS 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/citizenapp/release-ios.mjs github-release \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民 · Release · iOS' \
            --notes "公民 iOS 正式版 v${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets citizenapp/build/release/*

  # ── .github/workflows/citizenchain/ci-node-linux-amd.yml ──
  citizenchain_ci_node_linux_amd__changes:
    env:
      GMB_NODE_PLATFORM: linux-amd
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/ci-node-linux-amd.yml' && needs.validate_dispatch.result == 'success' }}
    needs: validate_dispatch
    name: 锁定公民链 LinuxAMD 构建范围
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      citizenchain: ${{ steps.scope.outputs.citizenchain }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_matrix: ${{ steps.scope.outputs.desktop_matrix }}
    steps:
      - name: 拉取完整变更历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          fetch-depth: 0

      # 桌面端与两款移动产品共用 shared/branding/logo.png 唯一母版。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并启用节点全量构建
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/ci-node-linux-amd.mjs dependencies check --scope citizenchain-node
          echo "citizenchain=true" >> "$GITHUB_OUTPUT"
          echo "desktop=true" >> "$GITHUB_OUTPUT"
          test "$GMB_NODE_PLATFORM" = linux-amd
          echo 'desktop_matrix=[{"platform":"linux-amd","name":"LinuxAMD","os":"ubuntu-24.04","artifact":"公民链AMD","installer_name":"citizenchain-node-linux-amd64.deb","ci_bundle_targets":"deb","updater_asset_name":"citizenchain-node-linux-amd64.AppImage","updater_manifest_name":"citizenchain-node-latest-linux-amd64.json","expected_runner_arch":"X64","deb_arch":"amd64","cache_key":"citizenchain-linux-amd"}]' >> "$GITHUB_OUTPUT"

  citizenchain_ci_node_linux_amd__verify:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: 公民链 LinuxAMD 全工程验证
    needs: [validate_dispatch, citizenchain_ci_node_linux_amd__changes]
    # 中文注释：Release 的源码提交已经由 CitizenConsole 锁定为最近成功 CI 的提交；
    # Release 只重新生成正式候选并交给本机安全进程签名，禁止把整套 CI 门禁再跑一遍。
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/ci-node-linux-amd.yml' && needs.validate_dispatch.result == 'success' && (needs.citizenchain_ci_node_linux_amd__changes.outputs.citizenchain == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          components: rustfmt, clippy

      - name: 安装系统依赖
        run: node .github/scripts/citizenchain/ci-node-linux-amd.mjs linux-deps

      - name: 配置 libclang 与 protoc
        run: |
          {
            echo "LLVM_CONFIG_PATH=$(command -v llvm-config)"
            echo "LIBCLANG_PATH=$(llvm-config --libdir)"
            echo "PROTOC=$(command -v protoc)"
          } >> "$GITHUB_ENV"

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: |
            shared/scanner-react/package-lock.json
            citizenchain/node/frontend/package-lock.json
            citizenchain/onchina/frontend/package-lock.json

      # React 两端的扫码设备层独立于产品工程，必须先验证唯一 jsQR + canvas 路线。
      - name: 验证仓库级 React 扫码适配器
        run: |
          npm --prefix shared/scanner-react ci
          npm --prefix shared/scanner-react run check
          npm --prefix shared/scanner-react test

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: citizenchain-workspace
          workspaces: citizenchain -> target

      - name: 校验宪法创世 SCALE 解码器
        run: python3 citizenchain/scripts/check-constitution-genesis.py --self-test

      # Tauri generate_context! 在 Rust 编译期读取 frontendDist，必须先生成真实前端产物。
      - name: 构建公民链节点前端
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 检查 Rust 格式
        working-directory: citizenchain
        run: cargo fmt --all -- --check

      - name: 执行全 Rust workspace Clippy
        working-directory: citizenchain
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 运行全 Rust workspace 测试
        working-directory: citizenchain
        run: cargo test --workspace --all-targets --locked

      - name: 构建 OnChina 前端
        run: |
          npm --prefix citizenchain/onchina/frontend ci
          npm --prefix citizenchain/onchina/frontend run build

      # 三档鉴权的前端头部组装 + 与 Rust 后端 header 名的跨端锁。
      # 复用上一步已装好的依赖,不重复 npm ci。
      - name: 测试 OnChina 前端
        run: npm --prefix citizenchain/onchina/frontend test

      - name: 清理本次 Rust 增量缓存
        if: ${{ success() }}
        run: find citizenchain/target -type d -name incremental -prune -exec rm -rf {} +

  citizenchain_ci_node_linux_amd__build_desktop:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: 打包公民链桌面端 (${{ matrix.name }})
    needs: [validate_dispatch, citizenchain_ci_node_linux_amd__changes, citizenchain_ci_node_linux_amd__verify]
    # verify 在 Release 中按设计跳过；always() 只用于允许 Release 越过这个“已跳过”的
    # 依赖，不会放过 changes 失败，也不会放过 CI 模式下的 verify 失败。
    if: ${{ inputs.pipeline == '.github/workflows/citizenchain/ci-node-linux-amd.yml' && needs.validate_dispatch.result == 'success' && (always() && needs.citizenchain_ci_node_linux_amd__changes.result == 'success' && needs.citizenchain_ci_node_linux_amd__changes.outputs.desktop == 'true' && needs.citizenchain_ci_node_linux_amd__verify.result == 'success') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.citizenchain_ci_node_linux_amd__changes.outputs.desktop_matrix) }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}

      - name: 校验代码来源并应用节点候选版本
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenchain/ci-node-linux-amd.mjs dependencies check --scope citizenchain-node

      - name: 校验 runner 架构
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]; then
            echo "::error::runner 架构不符合 ${EXPECTED_RUNNER_ARCH}: 当前为 ${RUNNER_ARCH}"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: 安装 Node.js
        # 固定使用 Node.js 25.2.1,与项目 package.json engines 统一 Node.js 工具链一致。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 25.2.1
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 同步桌面端版本
        shell: bash
        env:
          CITIZENCHAIN_CI_BUNDLE_TARGETS: ${{ matrix.ci_bundle_targets }}
          CITIZENCHAIN_MANUAL_BUNDLE_TARGETS: ${{ matrix.manual_bundle_targets }}
          CITIZENCHAIN_UPDATER_MANIFEST_NAME: ${{ matrix.updater_manifest_name }}
          CITIZENCHAIN_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const targetSource = process.env.CITIZENCHAIN_CI_BUNDLE_TARGETS;
          const bundleTargets = (targetSource || '')
            .split(',')
            .map((target) => target.trim())
            .filter(Boolean);

          if (bundleTargets.length === 0) {
            throw new Error('缺少本 matrix 的 Tauri bundle targets。');
          }

          // 候选版本已在当前 runner 工作区应用；这里只设置本 matrix 的 bundle 目标。
          const tauriPath = 'citizenchain/node/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          const version = tauri.version;
          tauri.bundle = tauri.bundle || {};
          // 中文注释：CI 只生成用户安装包；正式 updater 候选只属于独立 Release workflow。
          tauri.bundle.targets = bundleTargets;
          // 中文注释：GitHub 只构建无私钥候选产物；updater 签名统一由本机原生安全进程在 Touch ID 后完成。
          delete tauri.bundle.createUpdaterArtifacts;
          // 中文注释：CI 不创建正式版本 Tag，诊断安装包保留源码中的正式 updater 配置。
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          console.log(`桌面端版本(源码): ${version}`);
          console.log(`Tauri bundle targets: ${bundleTargets.join(',')}`);
          NODE

      - name: 安装 Linux 构建依赖
        if: startsWith(matrix.platform, 'linux-')
        run: node .github/scripts/citizenchain/ci-node-linux-amd.mjs linux-deps

      - name: 配置 Linux libclang 环境变量
        if: startsWith(matrix.platform, 'linux-')
        run: |
          {
            echo "LLVM_CONFIG_PATH=$(command -v llvm-config)"
            echo "LIBCLANG_PATH=$(llvm-config --libdir)"
            echo "PROTOC=$(command -v protoc)"
          } >> "$GITHUB_ENV"

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.cache_key }}
          workspaces: citizenchain -> target

      - name: 安装前端依赖并构建
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 准备空创世状态资源目录
        shell: bash
        run: |
          # 中文注释：安装包只携带节点软件；首次启动按冻结 chainspec 本地初始化并联网同步。
          rm -rf citizenchain/node/resources/genesis-state

      - name: Tauri 打包（不接触 updater 私钥）
        working-directory: citizenchain/node
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --ci -- --locked

      - name: 整理 Linux 产物
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        env:
          INSTALLER_NAME: ${{ matrix.installer_name }}
          UPDATER_ASSET_NAME: ${{ matrix.updater_asset_name }}
          EXPECTED_DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          mkdir -p citizenchain-release

          deb_file="$(find citizenchain/target/release/bundle/deb -name '*.deb' | head -1)"
          if [ -z "$deb_file" ]; then
            echo "::error::未找到 Linux deb 安装包。"
            exit 1
          fi
          actual_deb_arch="$(dpkg-deb -f "$deb_file" Architecture)"
          if [ "$actual_deb_arch" != "$EXPECTED_DEB_ARCH" ]; then
            echo "::error::deb 架构不符合 ${EXPECTED_DEB_ARCH}: 当前为 ${actual_deb_arch}"
            exit 1
          fi
          cp "$deb_file" "citizenchain-release/${INSTALLER_NAME}"


          ls -lh citizenchain-release

      - name: 上传桌面端产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: citizenchain-release/*
          retention-days: 30
          overwrite: true

      - name: 签署节点平台候选构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenchain-release/*

  # ── .github/workflows/citizenchain/ci-node-linux-arm.yaml ──
  citizenchain_ci_node_linux_arm__changes:
    env:
      GMB_NODE_PLATFORM: linux-arm
    permissions:
