        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh ios

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "citizenapp-rust-ios"
          workspaces: citizenapp/smoldot/ffi -> target

      - name: 构建 iOS Release 候选
        working-directory: citizenapp
        run: flutter build ios --release --no-codesign

      - name: 核验 iOS Runner 架构与 smoldot 符号
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh verify-ios-package build/ios/iphoneos/Runner.app

      - name: 使用 ad-hoc CI 身份签名并核验 iOS 产物
        run: |
          codesign --force --deep --sign - citizenapp/build/ios/iphoneos/Runner.app
          codesign --verify --deep --strict citizenapp/build/ios/iphoneos/Runner.app

      - name: 核验 iOS 候选中英文系统弹窗本地化
        working-directory: citizenapp
        run: bash scripts/citizenapp-run.sh verify-ios-localization build/ios/iphoneos/Runner.app

      - name: 整理 iOS 候选
        run: |
          set -euo pipefail
          mkdir -p citizenapp/build/release-candidate/ios
          asset='公民-iOS-CI.app.zip'
          ditto -c -k --keepParent citizenapp/build/ios/iphoneos/Runner.app \
            "citizenapp/build/release-candidate/ios/${asset}"

      - name: 上传 iOS 候选
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 公民-iOS-CI
