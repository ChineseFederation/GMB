    if: ${{ inputs.pipeline == '.github/workflows/citizenapp/ci-ios.yml' && needs.validate_dispatch.result == 'success' }}
    name: 打包公民 iOS CI
    runs-on: macos-15
    needs: [validate_dispatch, citizenapp_ci_ios__check]
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.GMB_SOURCE_SHA }}
          submodules: recursive

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
