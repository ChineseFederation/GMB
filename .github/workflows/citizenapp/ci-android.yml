name: 公民 · CI · Android
# CI_CACHE: enabled
# 中文注释：CI 只复用可再生成缓存，最终候选产物在保存前清除。
run-name: 公民 · CI · Android

# 中文注释：本软件不设 push 触发；main push 只运行独立仓库门禁，不启动本 CI；
# 本文件只处理 CitizenApp Android CI，其它产品、动作和端使用独立 workflow 并可并行。
on:
  workflow_dispatch:

concurrency:
  group: citizenapp-ci-android
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GMB_SOURCE_SHA: ${{ github.sha }}

jobs:
  # ── 代码检查 ──
  check:
    permissions: { actions: write, contents: read }
    name: Flutter 代码检查
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      # 全产品 Logo 只允许由 shared/branding/logo.png 唯一母版生成。
      - name: 准备统一CI增量缓存
        id: ci_cache
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_PRODUCT: citizenapp
          CI_CACHE_PLATFORM: android
          CI_CACHE_ARCHITECTURE: arm64
          CI_CACHE_COMPONENT: check
          CI_CACHE_WORKFLOW: citizenapp-android
          CI_CACHE_JOB: check
          CI_CACHE_TOOLCHAIN_FINGERPRINT: ${{ hashFiles('.github/dependencies.json', 'Cargo.lock', '**/Cargo.lock', '**/pubspec.lock', '**/package-lock.json') }}
          CI_CACHE_PATHS: |
            cargo-home
            cargo-target
            dart-pub
            gradle
            flutter-build
            xdg
          CI_CACHE_LINKS: |
            citizenapp/smoldot/ffi/target=cargo-target
            citizenapp/build=flutter-build
          CI_CACHE_FINALS: |
            cargo-target/aarch64-linux-android/release/libsmoldot.so
            flutter-build/app/outputs/flutter-apk
            flutter-build/app/outputs/bundle
        run: node .github/scripts/ci-cache.mjs prepare

      - name: 恢复上一次成功的CI增量缓存
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.restore_key }}

      - name: 接入受控生成目录
        run: node .github/scripts/ci-cache.mjs wire

      - name: 清理缓存中的最终产物
        run: node .github/scripts/ci-cache.mjs sanitize
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenapp/ci-android.mjs dependencies check --scope citizenapp

      - name: 校验 chainspec.json 冻结
        run: |
          bash citizenapp/scripts/check-chainspec-frozen.sh

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".github/dependencies.json").read_text(encoding="utf-8"))["toolchains"]["flutter"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装依赖
        working-directory: citizenapp
        run: flutter pub get --enforce-lockfile

      # 扫码设备层由 CitizenApp / CitizenWallet 共同消费；包本身不解析业务码型。
      - name: 检查 Flutter 共享扫码适配器
        working-directory: shared/scanner-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 本机与 CI 共用唯一入口：锁定 Flutter → 构建并验收宿主 libsmoldot
      # 全部 FFI 符号 → analyze → 顺序执行 Flutter 测试。
      - name: 分析并运行完整测试
        working-directory: citizenapp
        run: ./scripts/citizenapp-test.sh

  # ── Android APK 打包 ──
      - name: 记录失败CI增量缓存
        if: ${{ failure() && !cancelled() }}
        env:
          CI_CACHE_TERMINAL_STATE: failure
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次失败的CI增量缓存
        id: ci_cache_save_failure
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.failure_paths }}
          key: ${{ steps.ci_cache.outputs.failure_key }}

      - name: 清理旧失败CI增量缓存
        if: ${{ failure() && !cancelled() && steps.ci_cache_save_failure.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: failure
        run: node .github/scripts/ci-cache.mjs prune

      - name: 准备成功CI增量缓存
        if: ${{ success() }}
        env:
          CI_CACHE_TERMINAL_STATE: success
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次成功的CI增量缓存
        id: ci_cache_save_success
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.success_key }}

      - name: 清理旧成功CI增量缓存
        if: ${{ success() && steps.ci_cache_save_success.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: success
        run: node .github/scripts/ci-cache.mjs prune
  android:
    permissions: { actions: write, contents: read }
    name: 打包公民.apk
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: 准备统一CI增量缓存
        id: ci_cache
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_PRODUCT: citizenapp
          CI_CACHE_PLATFORM: android
          CI_CACHE_ARCHITECTURE: arm64
          CI_CACHE_COMPONENT: android
          CI_CACHE_WORKFLOW: citizenapp-android
          CI_CACHE_JOB: android
          CI_CACHE_TOOLCHAIN_FINGERPRINT: ${{ hashFiles('.github/dependencies.json', 'Cargo.lock', '**/Cargo.lock', '**/pubspec.lock', '**/package-lock.json') }}
          CI_CACHE_PATHS: |
            cargo-home
            cargo-target
            dart-pub
            gradle
            flutter-build
            xdg
          CI_CACHE_LINKS: |
            citizenapp/smoldot/ffi/target=cargo-target
            citizenapp/build=flutter-build
          CI_CACHE_FINALS: |
            cargo-target/aarch64-linux-android/release/libsmoldot.so
            flutter-build/app/outputs/flutter-apk
            flutter-build/app/outputs/bundle
        run: node .github/scripts/ci-cache.mjs prepare

      - name: 恢复上一次成功的CI增量缓存
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.restore_key }}

      - name: 接入受控生成目录
        run: node .github/scripts/ci-cache.mjs wire

      - name: 清理缓存中的最终产物
        run: node .github/scripts/ci-cache.mjs sanitize
      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/citizenapp/ci-android.mjs dependencies check --scope citizenapp

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".github/dependencies.json").read_text(encoding="utf-8"))["toolchains"]["flutter"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装 Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装 Android SDK Platform 与 Build Tools 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # chainspec.json 是从 plain SSOT + 创世状态包派生的 stateRootHash 轻形态。
      # runtime 升级走链上 system.setCode，不要重新 build-spec。
      # 可执行冻结契约由 citizenapp/scripts/check-chainspec-frozen.sh 负责。
      - name: 再次校验 chainspec.json 冻结
        run: |
          bash citizenapp/scripts/check-chainspec-frozen.sh

      # 产品 APK 只允许 arm64-v8a；禁止 CI 恢复 32 位原生库或产品包。
      - name: 编译 smoldot native library (Android ARM64)
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh android

      - name: 安装 Flutter 依赖
        working-directory: citizenapp
        run: flutter pub get --enforce-lockfile

      - name: 修复 isar_flutter_libs compileSdk
        run: |
          ISAR_GRADLE=$(find "$HOME/.pub-cache" -path "*/isar_flutter_libs*/android/build.gradle" | head -1)
          if [ -n "$ISAR_GRADLE" ]; then
            sed -i 's/compileSdkVersion 30/compileSdkVersion 36/' "$ISAR_GRADLE"
            echo "已将 isar_flutter_libs compileSdkVersion 30 → 36"
          fi

      # 普通 CI 与正式 Release 使用同一种 Release 产品构建。CI 生成当次临时证书完成
      # 非生产签名，任务结束即销毁；正式 APP_KEY 始终不进入 GitHub。
      - name: 打包 Android Release（CI）
        working-directory: citizenapp
        run: flutter build apk --release --target-platform android-arm64

      - name: 核验 APK 内 smoldot 原生库
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh verify-android-package build/app/outputs/flutter-apk/app-release.apk

      - name: 核验 Android CI 候选中英文系统弹窗应用名
        working-directory: citizenapp
        run: bash scripts/citizenapp-run.sh verify-android-localization build/app/outputs/flutter-apk/app-release.apk

      - name: 使用当次 CI 证书签名并核验 APK
        run: |
          set -euo pipefail
          GMB_CI_STORE_PASSWORD="$(openssl rand -hex 32)"
          GMB_CI_KEY_PASSWORD="$GMB_CI_STORE_PASSWORD"
          GMB_CI_APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          export GMB_CI_STORE_PASSWORD GMB_CI_KEY_PASSWORD
          test -x "$GMB_CI_APKSIGNER"
          trap 'rm -f "$RUNNER_TEMP/citizenapp-ci.p12"' EXIT
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/citizenapp-ci.p12" \
            -storepass:env GMB_CI_STORE_PASSWORD -keypass:env GMB_CI_KEY_PASSWORD -alias ci \
            -keyalg RSA -keysize 4096 -validity 2 \
            -dname 'CN=CitizenApp CI,O=GMB,C=US'
          "$GMB_CI_APKSIGNER" sign --ks "$RUNNER_TEMP/citizenapp-ci.p12" \
            --ks-type PKCS12 --ks-key-alias ci \
            --ks-pass env:GMB_CI_STORE_PASSWORD --key-pass env:GMB_CI_KEY_PASSWORD \
            --out citizenapp/build/app/outputs/flutter-apk/公民-CI.apk \
            citizenapp/build/app/outputs/flutter-apk/app-release.apk
          "$GMB_CI_APKSIGNER" verify --verbose --print-certs citizenapp/build/app/outputs/flutter-apk/公民-CI.apk
          unset GMB_CI_STORE_PASSWORD GMB_CI_KEY_PASSWORD

      - name: 上传签名后的公民 CI APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 公民-CI.apk
          path: citizenapp/build/app/outputs/flutter-apk/公民-CI.apk
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: 签署公民 CI APK 构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenapp/build/app/outputs/flutter-apk/公民-CI.apk

  # 中文注释：Android 与 iOS 各自维护独立版本线；本端成功不会等待或推进 iOS。
      - name: 记录失败CI增量缓存
        if: ${{ failure() && !cancelled() }}
        env:
          CI_CACHE_TERMINAL_STATE: failure
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次失败的CI增量缓存
        id: ci_cache_save_failure
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.failure_paths }}
          key: ${{ steps.ci_cache.outputs.failure_key }}

      - name: 清理旧失败CI增量缓存
        if: ${{ failure() && !cancelled() && steps.ci_cache_save_failure.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: failure
        run: node .github/scripts/ci-cache.mjs prune

      - name: 准备成功CI增量缓存
        if: ${{ success() }}
        env:
          CI_CACHE_TERMINAL_STATE: success
        run: |
          node .github/scripts/ci-cache.mjs sanitize
          node .github/scripts/ci-cache.mjs record

      - name: 保存本次成功的CI增量缓存
        id: ci_cache_save_success
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.ci_cache.outputs.success_paths }}
          key: ${{ steps.ci_cache.outputs.success_key }}

      - name: 清理旧成功CI增量缓存
        if: ${{ success() && steps.ci_cache_save_success.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_TERMINAL_STATE: success
        run: node .github/scripts/ci-cache.mjs prune
