name: 公民链 · Release · macOS
run-name: 公民链 · Release · macOS

# 中文注释：本软件不设 push 触发；main push 只运行独立仓库门禁，不启动本 Release；
# CI 只能由公民控制台节点行的「运行 CI / Release」按钮经 workflow_dispatch 发起。
# 这样每个软件的 CI 彼此彻底分开，也不会出现「推送触发一条、dispatch 再触发一条、
# 后者用 concurrency 把前者掐掉」的空跑 runner 浪费。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: GitHub main 准确提交
        required: true
        type: string
      ci_run_id:
        description: 本次 Release 复核的准确成功 CI run_id
        required: true
        type: string
      version_tag:
        description: 公民链 macOS 正式版本 Tag
        required: true
        type: string
      software_version:
        description: 本次候选软件版本
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  # 中文注释：目标是并发键的一部分，四个目标互不取消；同目标新任务也只排队，绝不
  # 把已经运行数小时的任务掐掉。CitizenConsole 会在 dispatch 前负责精确去重。
  group: citizenchain-node-release-macos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  GMB_SOURCE_SHA: ${{ inputs.source_sha }}
  GMB_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GMB_VERSION_TAG: ${{ inputs.version_tag }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}
  GMB_NODE_PLATFORM: macos

jobs:
  changes:
    name: 锁定公民链节点构建范围
    runs-on: ubuntu-24.04
    outputs:
      citizenchain: ${{ steps.scope.outputs.citizenchain }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_matrix: ${{ steps.scope.outputs.desktop_matrix }}
    steps:
      - name: 拉取完整变更历史
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: 验证公民链 macOS Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/version-tag-contract.mjs verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenchain-node-macos-v --product-id citizenchain-node
          --target macos --workflow citizenchain-node-ci-macos.yml

      # 桌面端与两款移动产品共用 docs/logo.png 唯一母版。
      - name: 校验 Logo 唯一真源派生物
        run: node scripts/generate-logo-assets.mjs --check

      - name: 校验代码来源并启用节点全量构建
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/dependencies.mjs check --scope citizenchain-node
          echo "citizenchain=true" >> "$GITHUB_OUTPUT"
          echo "desktop=true" >> "$GITHUB_OUTPUT"
          test "$GMB_NODE_PLATFORM" = macos
          echo 'desktop_matrix=[{"platform":"macos","name":"macOS Apple","os":"macos-15","artifact":"公民链macOS","installer_name":"citizenchain-node-macos-arm64.dmg","manual_bundle_targets":"dmg","updater_asset_name":"citizenchain-node-macos-arm64.app.tar.gz","updater_manifest_name":"citizenchain-node-latest-macos-arm64.json","expected_runner_arch":"ARM64","cache_key":"citizenchain-macos-apple"}]' >> "$GITHUB_OUTPUT"

  build-desktop:
    name: 打包公民链桌面端 (${{ matrix.name }})
    needs: changes
    # 中文注释：CI 来源已由 CitizenConsole 锁定；Release 只构建本平台正式候选。
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.desktop_matrix) }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/github-release.mjs
            .github/scripts/version-tag-contract.mjs
            .github/scripts/citizenchain-node-version.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 校验代码来源并应用节点候选版本
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/dependencies.mjs check --scope citizenchain-node
          node release-tool/.github/scripts/citizenchain-node-version.mjs apply "$GMB_SOFTWARE_VERSION"

      - name: 校验 runner 架构
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ARCH}" != "${EXPECTED_RUNNER_ARCH}" ]; then
            echo "::error::runner 架构不符合 ${EXPECTED_RUNNER_ARCH}: 当前为 ${RUNNER_ARCH}"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: 安装 Node.js
        # 固定使用 Node.js 24,与项目 package.json engines 和 GitHub Actions node24 运行时一致。
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: citizenchain/node/frontend/package-lock.json

      - name: 同步桌面端版本
        shell: bash
        env:
          CITIZENCHAIN_CI_BUNDLE_TARGETS: ${{ matrix.ci_bundle_targets }}
          CITIZENCHAIN_MANUAL_BUNDLE_TARGETS: ${{ matrix.manual_bundle_targets }}
          CITIZENCHAIN_UPDATER_MANIFEST_NAME: ${{ matrix.updater_manifest_name }}
          CITIZENCHAIN_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const targetSource = process.env.CITIZENCHAIN_MANUAL_BUNDLE_TARGETS;
          const bundleTargets = (targetSource || '')
            .split(',')
            .map((target) => target.trim())
            .filter(Boolean);

          if (bundleTargets.length === 0) {
            throw new Error('缺少本 matrix 的 Tauri bundle targets。');
          }

          // 候选版本已在当前 runner 工作区应用；这里只设置本 matrix 的 bundle 目标。
          const tauriPath = 'citizenchain/node/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          const version = tauri.version;
          tauri.bundle = tauri.bundle || {};
          // 中文注释：Release 生成安装包与 updater 正式文件；updater 在同一 runner 内签名。
          tauri.bundle.targets = bundleTargets;
          // 中文注释：按现有平台归档格式在后续步骤签名，禁止再交给本机下载后二次处理。
          delete tauri.bundle.createUpdaterArtifacts;
          // 中文注释：平台 Release 可以独立成功，因此每个安装包只读取自己的更新清单；
          // 不能再用一个根 version 同时描述版本可能不同的四个目标。
          tauri.plugins = tauri.plugins || {};
          tauri.plugins.updater = tauri.plugins.updater || {};
          tauri.plugins.updater.endpoints = [
            `https://github.com/ChineseFederation/GMB/releases/download/${process.env.GMB_VERSION_TAG}/${process.env.CITIZENCHAIN_UPDATER_MANIFEST_NAME}`,
          ];
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          console.log(`桌面端版本(源码): ${version}`);
          console.log(`Tauri bundle targets: ${bundleTargets.join(',')}`);
          NODE

      - name: 安装 macOS 构建依赖
        if: matrix.platform == 'macos'
        run: brew install protobuf llvm

      - name: 配置 macOS LLVM 环境变量
        if: matrix.platform == 'macos'
        run: |
          echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: 配置 macOS 应用签名
        if: matrix.platform == 'macos'
        run: |
          # 中文注释：现有节点软件只要求完整可验证的 Apple Silicon 应用签名；正式 updater
          # 签名由本 workflow 的独立 Tauri 私钥完成。显式使用 Tauri 官方 ad-hoc 身份，避免 bundler 自动
          # 生成只有资源封套声明、却缺少 CodeResources 的残缺签名。
          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.cache_key }}
          workspaces: citizenchain -> target

      - name: 同步并锁定节点候选版本
        run: node release-tool/.github/scripts/citizenchain-node-version.mjs lock "$GMB_SOFTWARE_VERSION"

      - name: 安装前端依赖并构建
        run: |
          npm --prefix citizenchain/node/frontend ci
          npm --prefix citizenchain/node/frontend run build

      - name: 准备空创世状态资源目录
        shell: bash
        run: |
          # 中文注释：安装包只携带节点软件；首次启动按冻结 chainspec 本地初始化并联网同步。
          rm -rf citizenchain/node/resources/genesis-state

      - name: Tauri 打包正式软件
        working-directory: citizenchain/node
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --ci -- --locked

      # Tauri 的 DMG bundler 会在生成 DMG 后清理 bundle/macos 中间 App。必须从最终 DMG
      # 重新挂载并提取真实 App，再校验签名和生成 updater 候选；继续读取已清理目录会把
      # 已成功的 macOS 构建误判成失败。
      - name: 从最终 DMG 提取并验证 macOS App
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg_file="$(find citizenchain/target/release/bundle/dmg -name '*.dmg' | head -1)"
          if [ -z "$dmg_file" ]; then
            echo "::error::未找到 macOS dmg 安装包。"
            exit 1
          fi
          mount_dir="$(mktemp -d)"
          extracted_dir="citizenchain-macos-app"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_file" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          app_bundle="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' | head -1)"
          if [ -z "$app_bundle" ]; then
            echo "::error::最终 DMG 中没有 macOS App bundle。"
            exit 1
          fi
          rm -rf "$extracted_dir"
          mkdir -p "$extracted_dir"
          ditto "$app_bundle" "$extracted_dir/$(basename "$app_bundle")"
          app_bundle="$extracted_dir/$(basename "$app_bundle")"
          codesign --verify --deep --strict "$app_bundle"
          entitlements="$(codesign -d --entitlements :- "$app_bundle" 2>/dev/null)"
          for entitlement in \
            com.apple.security.device.camera \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory; do
            # plutil 的 key path 以点号分层，签名 entitlement 的点号必须转义。
            entitlement_key_path="${entitlement//./\\.}"
            if [ "$(printf '%s' "$entitlements" | plutil -extract "$entitlement_key_path" raw -)" != "true" ]; then
              echo "::error::macOS App 缺少 $entitlement。"
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' \
            "$app_bundle/Contents/Info.plist" >/dev/null

      - name: 整理 macOS 产物
        if: matrix.platform == 'macos'
        shell: bash
        env:
          INSTALLER_NAME: ${{ matrix.installer_name }}
          UPDATER_ASSET_NAME: ${{ matrix.updater_asset_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_PASS }}
        run: |
          set -euo pipefail
          mkdir -p citizenchain-release
          versioned_installer="${INSTALLER_NAME%.dmg}-v${GMB_SOFTWARE_VERSION}.dmg"
          versioned_updater="${UPDATER_ASSET_NAME%.app.tar.gz}-v${GMB_SOFTWARE_VERSION}.app.tar.gz"

          dmg_file="$(find citizenchain/target/release/bundle/dmg -name '*.dmg' | head -1)"
          if [ -z "$dmg_file" ]; then
            echo "::error::未找到 macOS dmg 安装包。"
            exit 1
          fi
          cp "$dmg_file" "citizenchain-release/${versioned_installer}"

          app_bundle="$(find citizenchain-macos-app -maxdepth 1 -type d -name '*.app' | head -1)"
          if [ -z "$app_bundle" ]; then
            echo "::error::Release 缺少从最终 DMG 验证并提取的 macOS App bundle。"
            exit 1
          fi
          # 中文注释：保持 Tauri updater 要求的 .app 根目录归档格式，并在同一 runner 内签名。
          COPYFILE_DISABLE=1 tar \
            -C "$(dirname "$app_bundle")" \
            -czf "citizenchain-release/${versioned_updater}" \
            "$(basename "$app_bundle")"
          (cd citizenchain/node && node frontend/node_modules/@tauri-apps/cli/tauri.js signer sign "$GITHUB_WORKSPACE/citizenchain-release/${versioned_updater}")
          signature="$(tr -d '\r\n' < "citizenchain-release/${versioned_updater}.sig")"
          test -n "$signature"
          node - "$versioned_updater" "$signature" <<'NODE'
          const fs = require('node:fs');
          const [asset, signature] = process.argv.slice(2);
          fs.writeFileSync('citizenchain-release/citizenchain-node-latest-macos-arm64.json', `${JSON.stringify({
            version: process.env.GMB_SOFTWARE_VERSION,
            notes: `CitizenChain macOS v${process.env.GMB_SOFTWARE_VERSION}。`,
            pub_date: new Date().toISOString(),
            platforms: { 'darwin-aarch64': {
              signature,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GMB_VERSION_TAG}/${asset}`,
            } },
          }, null, 2)}\n`);
          NODE

          ls -lh citizenchain-release

      - name: 签署节点平台正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenchain-release/*

      - name: 固化 macOS 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find citizenchain-release -type f | wc -l | tr -d ' ')" = 4
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/github-release.mjs \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民链 · Release · macOS' \
            --notes "公民链 macOS 正式版 v${GMB_SOFTWARE_VERSION}。" --latest false \
            --assets citizenchain-release/*
