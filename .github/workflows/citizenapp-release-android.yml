name: 公民 · Release · Android
run-name: 公民 · Release · Android

# 中文注释：本软件不设 push 触发；main push 只运行独立仓库门禁，不启动本 Release；
# 本文件只处理 CitizenApp Android Release，其它产品、动作和端使用独立 workflow 并可并行。
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: GitHub main 准确提交
        required: true
        type: string
      ci_run_id:
        description: 本次 Release 复核的准确成功 CI run_id
        required: true
        type: string
      version_tag:
        description: 公民 Android 正式版本 Tag
        required: true
        type: string
      software_version:
        description: 本次候选软件版本
        required: true
        type: string
      build_number:
        description: 本次候选构建号
        required: true
        type: string

concurrency:
  group: citizenapp-release-android
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GMB_SOURCE_SHA: ${{ inputs.source_sha }}
  GMB_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GMB_VERSION_TAG: ${{ inputs.version_tag }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}
  GMB_BUILD_NUMBER: ${{ inputs.build_number }}

jobs:
  # Release 在同一个受控 runner 内完成构建、正式签名、验签和正式资产发布。
  android:
    name: 签名并发布公民 Android 正式版
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive

      # 中文注释：产品源码保持在成功 CI 提交；Release 工具从本次 workflow 提交隔离读取。
      - name: 拉取 Release 工具
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: release-tool
          sparse-checkout: |
            .github/scripts/github-release.mjs
            .github/scripts/version-tag-contract.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 验证公民 Android Release 的正式版本 Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-tool/.github/scripts/version-tag-contract.mjs verify-release-source
          --ci-run-id "$GMB_CI_RUN_ID"
          --version-tag "$GMB_VERSION_TAG" --source-sha "$GMB_SOURCE_SHA"
          --prefix citizenapp-android-v --product-id citizenapp
          --target android --workflow citizenapp-ci-android.yml

      - name: 校验代码来源并应用候选版本
        run: |
          test "$(git rev-parse HEAD)" = "$GMB_SOURCE_SHA"
          node .github/scripts/dependencies.mjs check --scope citizenapp
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version, build = os.environ["GMB_SOFTWARE_VERSION"], os.environ["GMB_BUILD_NUMBER"]
          if not re.fullmatch(r"\d+\.\d{1,2}\.\d{1,2}", version) or not re.fullmatch(r"[1-9]\d*", build):
              raise SystemExit("CitizenApp 候选版本输入无效")
          path = Path("citizenapp/pubspec.yaml")
          text, count = re.subn(r"(?m)^version:\s*\d+\.\d+\.\d+\+\d+\s*$", f"version: {version}+{build}", path.read_text(), count=1)
          if count != 1: raise SystemExit("CitizenApp pubspec 版本真源无效")
          path.write_text(text)
          PY

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          targets: aarch64-linux-android

      - name: 读取 Flutter 版本
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = json.loads(Path(".fvm/fvm_config.json").read_text(encoding="utf-8"))["flutterSdkVersion"]
          print(f"version={version}")
          PY

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: 安装 Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: 安装 Android SDK 签名工具
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "cmdline-tools;latest"

      # chainspec.json 是从 plain SSOT + 创世状态包派生的 stateRootHash 轻形态。
      # runtime 升级走链上 system.setCode，不要重新 build-spec。
      # 可执行冻结契约由 citizenapp/scripts/check-chainspec-frozen.sh 负责。
      - name: 再次校验 chainspec.json 冻结
        run: |
          export CITIZENAPP_REQUIRE_STATE_ROOT=1
          bash citizenapp/scripts/check-chainspec-frozen.sh

      # 产品 APK 只允许 arm64-v8a；禁止 CI 恢复 32 位原生库或产品包。
      - name: 编译 smoldot native library (Android ARM64)
        working-directory: citizenapp
        run: ./scripts/build-smoldot-native.sh android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "citizenapp-rust-android"
          workspaces: citizenapp/rust -> target

      - name: 安装 Flutter 依赖
        working-directory: citizenapp
        run: flutter pub get --enforce-lockfile

      - name: 修复 isar_flutter_libs compileSdk
        run: |
          ISAR_GRADLE=$(find "$HOME/.pub-cache" -path "*/isar_flutter_libs*/android/build.gradle" | head -1)
          if [ -n "$ISAR_GRADLE" ]; then
            sed -i 's/compileSdkVersion 30/compileSdkVersion 36/' "$ISAR_GRADLE"
            echo "已将 isar_flutter_libs compileSdkVersion 30 → 36"
          fi

      - name: 构建 Android Release 正式包
        working-directory: citizenapp
        run: |
          flutter build apk --release --target-platform android-arm64
          flutter build appbundle --release --target-platform android-arm64

      - name: 核验 Android Release 中英文系统弹窗应用名
        working-directory: citizenapp
        run: bash scripts/citizenapp-run.sh verify-android-localization build/app/outputs/flutter-apk/app-release.apk

      - name: 使用 APP_KEY 签名并回读验证正式包
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/citizenapp-android-signing"
          publish="citizenapp/build/release"
          rm -rf "$work" "$publish"
          mkdir -p "$work" "$publish"
          trap 'rm -rf "$work"' EXIT
          python3 - "$work" <<'PY'
          import base64, os, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          fields = {}
          for raw in os.environ.get("APP_KEY", "").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              name, sep, value = line.partition("=")
              if not sep or name.strip() in fields or not value.strip():
                  raise SystemExit("APP_KEY 行格式无效")
              fields[name.strip()] = value.strip()
          if set(fields) - {"keystore", "password", "alias", "keyPassword"}:
              raise SystemExit("APP_KEY 包含未登记字段")
          alias = fields.get("alias", "upload")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,128}", alias):
              raise SystemExit("APP_KEY alias 无效")
          try:
              key = base64.b64decode(fields["keystore"], validate=True)
              password = fields["password"]
          except (KeyError, ValueError) as exc:
              raise SystemExit("APP_KEY 缺少有效签名材料") from exc
          if not 1024 <= len(key) <= 32 * 1024 * 1024:
              raise SystemExit("APP_KEY keystore 大小无效")
          (root / "release.keystore").write_bytes(key)
          (root / "password").write_text(password)
          (root / "key-password").write_text(fields.get("keyPassword", password))
          (root / "alias").write_text(alias)
          PY
          store_password="$(cat "$work/password")"
          key_password="$(cat "$work/key-password")"
          alias="$(cat "$work/alias")"
          export GMB_ANDROID_STORE_PASSWORD="$store_password"
          export GMB_ANDROID_KEY_PASSWORD="$key_password"
          apksigner="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          test -x "$apksigner"
          "$apksigner" sign --ks "$work/release.keystore" \
            --ks-pass env:GMB_ANDROID_STORE_PASSWORD --key-pass env:GMB_ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false \
            --ks-key-alias "$alias" --out "$publish/citizenapp.apk" \
            citizenapp/build/app/outputs/flutter-apk/app-release.apk
          cp citizenapp/build/app/outputs/bundle/release/app-release.aab "$publish/citizenapp.aab"
          jarsigner -keystore "$work/release.keystore" \
            -storepass:env GMB_ANDROID_STORE_PASSWORD -keypass:env GMB_ANDROID_KEY_PASSWORD \
            "$publish/citizenapp.aab" "$alias"
          "$apksigner" verify --verbose --print-certs "$publish/citizenapp.apk" \
            | tee "$work/apk-verification.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$work/apk-verification.txt"
          # Android 上传证书按平台规范可以自签名；只验证包完整性，再从三处回读同一证书。
          jarsigner -verify "$publish/citizenapp.aab"
          apk_certificate_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$work/apk-verification.txt")"
          key_certificate_sha256="$(keytool -exportcert -alias "$alias" \
            -keystore "$work/release.keystore" -storepass:env GMB_ANDROID_STORE_PASSWORD -rfc \
            | openssl x509 -outform DER | sha256sum | awk '{print $1}')"
          aab_certificate_sha256="$(keytool -printcert -jarfile "$publish/citizenapp.aab" -rfc \
            | openssl x509 -outform DER | sha256sum | awk '{print $1}')"
          [[ "$apk_certificate_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$apk_certificate_sha256" = "$key_certificate_sha256"
          test "$apk_certificate_sha256" = "$aab_certificate_sha256"
          test "$(apkanalyzer manifest application-id "$publish/citizenapp.apk")" = com.crcfrcn.citizenapp
          test "$(apkanalyzer manifest version-code "$publish/citizenapp.apk")" = "$GMB_BUILD_NUMBER"

      - name: 生成并核验 Android 正式清单
        run: |
          set -euo pipefail
          node <<'NODE'
            const { createHash } = require("node:crypto");
            const fs = require("node:fs");
            const root = "citizenapp/build/release";
            const digest = (name) => createHash("sha256").update(fs.readFileSync(`${root}/${name}`)).digest("hex");
            fs.writeFileSync(`${root}/citizenapp-release-android.json`, `${JSON.stringify({
              product_id: "citizenapp", version: process.env.GMB_SOFTWARE_VERSION,
              build_number: Number(process.env.GMB_BUILD_NUMBER), head_sha: process.env.GMB_SOURCE_SHA,
              bundle_id: "ios.citizenapp", package_name: "com.crcfrcn.citizenapp",
              assets: [
                { platform: "android", asset_name: "citizenapp.apk", asset_sha256: digest("citizenapp.apk") },
                { platform: "android", asset_name: "citizenapp.aab", asset_sha256: digest("citizenapp.aab") },
              ],
            }, null, 2)}\n`);
          NODE
          test "$(find citizenapp/build/release -type f | wc -l | tr -d ' ')" = 3

      - name: 签署 Android 正式资产构建来源
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: citizenapp/build/release/*

      - name: 固化 Android 正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C release-tool rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tool/.github/scripts/github-release.mjs \
            --tag "$GMB_VERSION_TAG" \
            --source-sha "$GMB_SOURCE_SHA" --title '公民 · Release · Android' \
            --notes "公民 Android 正式版 v${GMB_SOFTWARE_VERSION}。" --latest true \
            --assets citizenapp/build/release/*
